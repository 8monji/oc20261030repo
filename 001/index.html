<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>東方風・参道極弾幕絵巻</title>
  <style>
    /* =========================================================
       基本スタイル & レスポンシブ設定 (和風アニメテイスト)
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #06020c;
      color: #fff;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', '游明朝', serif;
      overflow: hidden;
      touch-action: none;
    }

    /* 全体を画面中央に配置するラッパー */
    #game-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: radial-gradient(circle, #1c0a32 0%, #030108 100%);
    }

    /* 960x540 の固定ゲームワールドコンテナ */
    #game-container {
      width: 960px;
      height: 540px;
      position: relative;
      overflow: hidden;
      background-color: #120826;
      box-shadow: 0 0 60px rgba(255, 42, 95, 0.5), 0 0 120px rgba(18, 8, 38, 0.9);
      border-radius: 12px;
      border: 2px solid rgba(255, 215, 0, 0.5);
      transform-origin: center center;
    }

    /* Canvas 描画領域 */
    #gameCanvas {
      width: 960px;
      height: 540px;
      display: block;
    }

    /* =========================================================
       UI レイヤー (タイトル、HUD、ゲームオーバー等)
       ========================================================= */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .interactive {
      pointer-events: auto;
    }

    /* 和風アニメ風タイトルデザイン */
    .shrine-title {
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 
        0 0 8px #fff,
        0 0 18px #ff2a5f,
        0 0 35px #ff2a5f,
        0 0 60px #ff0055;
      margin-bottom: 8px;
    }

    .shrine-subtitle {
      font-size: 20px;
      font-weight: bold;
      color: #ffe600;
      text-shadow: 0 0 12px rgba(255, 230, 0, 0.9), 2px 2px 4px #000;
      margin-bottom: 25px;
    }

    /* ボタンデザイン */
    .btn {
      background: linear-gradient(135deg, #d62828 0%, #800f2f 100%);
      border: 2px solid #ffe600;
      color: #ffffff;
      padding: 14px 44px;
      font-size: 22px;
      font-weight: bold;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 75, 92, 0.6), inset 0 0 10px rgba(255, 230, 0, 0.4);
      transition: all 0.2s ease;
      margin: 8px;
      outline: none;
      text-shadow: 1px 1px 3px #000;
    }

    .btn:hover, .btn:active {
      background: linear-gradient(135deg, #ff4b5c 0%, #c9184a 100%);
      box-shadow: 0 0 35px rgba(255, 230, 0, 0.9), inset 0 0 15px #fff;
      transform: scale(1.06);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #2b1e3a 0%, #150d2a 100%);
      border-color: #ff4b5c;
      box-shadow: 0 0 15px rgba(255, 75, 92, 0.4);
      font-size: 16px;
      padding: 10px 28px;
    }

    /* HUD (ゲーム情報表示) */
    #hud {
      position: absolute;
      top: 18px;
      left: 25px;
      right: 25px;
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: bold;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      color: #ffffff;
      text-shadow: 0 0 10px #ff4b5c, 2px 2px 4px #000;
      z-index: 15;
    }

    .hud-box {
      background: rgba(18, 8, 38, 0.75);
      padding: 6px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 230, 0, 0.5);
    }

    /* ボスHPゲージ */
    #boss-bar-wrapper {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 15;
      pointer-events: none;
    }

    #boss-title {
      font-size: 16px;
      font-weight: bold;
      color: #ffe600;
      text-shadow: 0 0 10px #ff0055, 1px 1px 3px #000;
      margin-bottom: 4px;
    }

    .boss-hp-bg {
      width: 100%;
      height: 16px;
      background: rgba(18, 8, 38, 0.9);
      border: 2px solid #ffe600;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 18px rgba(255, 42, 95, 0.8);
    }

    #boss-hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055 0%, #ff4b5c 50%, #ffe600 100%);
      transition: width 0.08s linear;
    }

    /* 右下 FIRE ボタン */
    #fire-btn {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff4b5c 0%, #800f2f 75%);
      border: 3px solid #ffe600;
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(255, 75, 92, 0.8), inset 0 0 12px rgba(255, 230, 0, 0.6);
      z-index: 20;
      user-select: none;
      touch-action: none;
      text-shadow: 0 0 8px #000;
    }

    #fire-btn:active {
      background: radial-gradient(circle, #ffe600 0%, #ff4b5c 80%);
      color: #800f2f;
      transform: scale(0.92);
      box-shadow: 0 0 35px #ffe600;
    }

    /* 操作ガイド */
    .controls-hint {
      font-size: 14px;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      color: #d1c4e9;
      margin-top: 15px;
      text-align: center;
      line-height: 1.7;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 22px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* 縦画面警告オーバーレイ */
    #portrait-warning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0c0517;
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      color: #fff;
    }

    #portrait-warning .icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: rotate-hint 2.5s infinite ease-in-out;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
  </style>
</head>
<body>

  <!-- スマホ縦画面時の警告 -->
  <div id="portrait-warning">
    <div class="icon">⛩️↻</div>
    <h2 style="font-size: 26px; color: #ffe600;">画面を横にしてね</h2>
    <p style="margin-top: 12px; color: #b3a2c7;">スマートフォンを横向きにすると結界が開きます</p>
  </div>

  <!-- ゲーム全体ラッパー -->
  <div id="game-wrapper">
    <!-- 960x540 ゲーム本体コンテナ -->
    <div id="game-container">
      
      <!-- Canvas 描画スクリーン -->
      <canvas id="gameCanvas" width="960" height="540"></canvas>

      <!-- プレイ中の HUD -->
      <div id="hud" style="display: none;">
        <div class="hud-box">TIME: <span id="time-val" style="color: #ffe600;">0.0</span>s</div>
        <div class="hud-box">HIT: <span id="score-val" style="color: #ff4b5c;">0</span></div>
      </div>

      <!-- ボス HP ゲージ表示 -->
      <div id="boss-bar-wrapper">
        <div id="boss-title">【大妖魔】 九尾の古妖狐</div>
        <div class="boss-hp-bg">
          <div id="boss-hp-fill"></div>
        </div>
      </div>

      <!-- タッチ用 FIRE ボタン -->
      <div id="fire-btn" class="interactive" style="display: none;">祓霊</div>

      <!-- タイトル画面 UI -->
      <div id="ui-title" class="ui-layer">
        <h1 class="shrine-title" id="title-text">東方風・参道極弾幕絵巻</h1>
        <p class="shrine-subtitle" id="subtitle-text">〜 咲き狂う妖弾を交わし祓え！極限弾幕結界戦 〜</p>
        
        <button id="start-btn" class="btn interactive">参拝開始 (PLAY)</button>
        <button id="fullscreen-btn" class="btn btn-secondary interactive">FULL SCREEN</button>

        <div class="controls-hint">
          【操作方法】<br>
          自機移動：上下ドラッグ / 指スライド / 矢印キー / [W][S]<br>
          破魔弾発射：画面タップ / [祓霊]ボタン / [SPACE]キー<br>
          <span style="color: #ffe600;">※自機中心の「赤い極小点」に敵弾が触れると判定されます</span>
        </div>
      </div>

      <!-- ゲームオーバー画面 UI -->
      <div id="ui-gameover" class="ui-layer" style="display: none;">
        <h1 class="shrine-title" style="color: #ff4b5c; text-shadow: 0 0 25px #ff0055;">妖弾被弾...</h1>
        <p style="font-size: 24px; margin-bottom: 10px; color: #fff;">妖怪撃破数 (HIT): <span id="final-score" style="color: #ffe600; font-weight: bold;">0</span> 匹</p>
        <p style="font-size: 24px; margin-bottom: 30px; color: #fff;">生存時間 (TIME): <span id="final-time" style="color: #ff4b5c; font-weight: bold;">0.0</span> 秒</p>
        <button id="retry-btn" class="btn interactive">再挑戦 (RETRY)</button>
      </div>

    </div>
  </div>

  <script>
    /* =========================================================
       ★ 体験授業用 CONFIG オブジェクト (超高密度弾幕パラメータ) ★
       ========================================================= */
    const CONFIG = {
      // --- 基本テキスト ---
      TITLE: '東方風・参道極弾幕絵巻',
      SUBTITLE: '〜 咲き狂う妖弾を交わし祓え！極限弾幕結界戦 〜',

      // --- テーマカラー ---
      BG_COLOR: '#120826',        // 夜の参道・背景ベース色
      PLAYER_COLOR: '#ff4b5c',    // 自機（式神のお札・朱色）
      BULLET_COLOR: '#ffe600',    // 自機破魔弾（輝く黄色）

      // --- 弾幕・難易度設定 ---
      ENEMY_SPEED: 2.0,           // 雑魚敵の出現移動スピード
      SPAWN_INTERVAL: 1100,       // 雑魚敵の出現間隔 (ミリ秒)
      BULLET_SPEED: 15,           // 自機破魔弾の飛行速度
      FOLLOW_SPEED: 0.25,         // 自機の指/キー追従速度
      
      // 敵弾幕設定
      ENEMY_BULLET_SPEED: 3.0,    // 敵弾の標準飛行速度
      ENEMY_SHOOT_INTERVAL: 32,   // 雑魚敵の発射クールダウン(フレーム数)

      // --- ボス設定 ---
      BOSS_INTERVAL: 30,          // ボス出現撃破数 (30体ごと)
      BOSS_BASE_HP: 220           // ボスの耐久力
    };

    /* =========================================================
       ゲームエンジン & システム変数
       ========================================================= */

    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;

    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const uiTitle = document.getElementById('ui-title');
    const uiGameOver = document.getElementById('ui-gameover');
    const hud = document.getElementById('hud');
    const fireBtn = document.getElementById('fire-btn');
    const scoreVal = document.getElementById('score-val');
    const timeVal = document.getElementById('time-val');
    const finalScore = document.getElementById('final-score');
    const finalTime = document.getElementById('final-time');

    // ゲーム状態
    let gameState = 'TITLE'; // 'TITLE', 'PLAYING', 'GAMEOVER'
    let currentScale = 1;
    let score = 0;
    let startTime = 0;
    let elapsedTime = 0;
    let lastSpawnTime = 0;
    let isPaused = false;
    let frameCount = 0;

    // 自機（喰らい判定は半径 4.5px と極小にして超弾幕を避けやすくする）
    let player = { 
      x: 120, 
      y: 270, 
      targetY: 270, 
      visualRadius: 22,
      hitRadius: 4.5 // 弾幕ゲー特有の極小判定
    };

    // 配列管理
    let playerBullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let petals = [];
    let toriiGates = [];
    let lanterns = [];

    // 操作状態
    let isFiring = false;
    let fireCooldown = 0;
    let keys = {};

    // ボス管理変数
    let boss = null;
    let bossLevel = 1;
    let nextBossKills = CONFIG.BOSS_INTERVAL;
    let warningTimer = 0;

    /* ---------------------------------------------------------
       1. 画面リサイズ ＆ 座標系変換
       --------------------------------------------------------- */
    function fitScreen() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      const isPortrait = windowHeight > windowWidth;
      document.getElementById('portrait-warning').style.display = isPortrait ? 'flex' : 'none';
      isPaused = isPortrait;

      const scaleX = windowWidth / GAME_WIDTH;
      const scaleY = windowHeight / GAME_HEIGHT;
      currentScale = Math.min(scaleX, scaleY);

      container.style.transform = `scale(${currentScale})`;
    }

    window.addEventListener('resize', fitScreen);
    window.addEventListener('orientationchange', fitScreen);
    fitScreen();

    function getGameCoordinates(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (GAME_WIDTH / rect.width),
        y: (clientY - rect.top) * (GAME_HEIGHT / rect.height)
      };
    }

    /* ---------------------------------------------------------
       2. 背景描画 (アニメ調・夜の参道・舞い散る桜)
       --------------------------------------------------------- */
    function initBackgroundElements() {
      petals = [];
      for (let i = 0; i < 60; i++) {
        petals.push({
          x: Math.random() * GAME_WIDTH,
          y: Math.random() * GAME_HEIGHT,
          size: Math.random() * 5 + 4,
          speedX: -(Math.random() * 2.2 + 1.2),
          speedY: Math.random() * 1.4 + 0.5,
          angle: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.06
        });
      }

      toriiGates = [];
      for (let i = 0; i < 5; i++) {
        toriiGates.push({ x: 200 + i * 220 });
      }

      lanterns = [];
      for (let i = 0; i < 7; i++) {
        lanterns.push({ x: 100 + i * 160 });
      }
    }

    function drawBackground() {
      // 空グラデーション
      const skyGradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
      skyGradient.addColorStop(0.0, '#06020c');
      skyGradient.addColorStop(0.35, '#1e082e');
      skyGradient.addColorStop(0.7, '#4d1033');
      skyGradient.addColorStop(0.88, '#8c253d');
      skyGradient.addColorStop(1.0, '#120826');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // 満月
      ctx.save();
      const moonX = 780;
      const moonY = 110;
      const moonGlow = ctx.createRadialGradient(moonX, moonY, 15, moonX, moonY, 120);
      moonGlow.addColorStop(0, 'rgba(255, 255, 220, 0.95)');
      moonGlow.addColorStop(0.3, 'rgba(255, 190, 130, 0.45)');
      moonGlow.addColorStop(1, 'rgba(255, 150, 80, 0)');
      ctx.fillStyle = moonGlow;
      ctx.beginPath();
      ctx.arc(moonX, moonY, 120, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fffdf0';
      ctx.beginPath();
      ctx.arc(moonX, moonY, 38, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 遠景山脈＆五重塔
      ctx.save();
      ctx.fillStyle = '#140622';
      ctx.beginPath();
      ctx.moveTo(0, 420);
      ctx.quadraticCurveTo(180, 330, 360, 390);
      ctx.quadraticCurveTo(540, 310, 720, 380);
      ctx.quadraticCurveTo(840, 340, 960, 410);
      ctx.lineTo(960, 540);
      ctx.lineTo(0, 540);
      ctx.closePath();
      ctx.fill();

      const pagX = 700;
      const pagY = 325;
      ctx.fillStyle = '#0b0314';
      for (let i = 0; i < 5; i++) {
        const w = 36 - i * 5;
        const h = 12;
        const y = pagY - i * 16;
        ctx.fillRect(pagX - w / 2, y, w, h);
        ctx.beginPath();
        ctx.moveTo(pagX - w / 2 - 8, y + 2);
        ctx.lineTo(pagX + w / 2 + 8, y + 2);
        ctx.lineTo(pagX, y - 4);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillRect(pagX - 2, pagY - 88, 4, 18);
      ctx.restore();

      // 参道床
      const groundY = 460;
      ctx.fillStyle = '#1a0c2e';
      ctx.fillRect(0, groundY, GAME_WIDTH, GAME_HEIGHT - groundY);

      ctx.strokeStyle = 'rgba(255, 215, 0, 0.22)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(GAME_WIDTH, groundY);
      ctx.stroke();

      // 鳥居
      const speed = (gameState === 'PLAYING' && !isPaused) ? 1.8 : 0.4;
      toriiGates.forEach(gate => {
        if (gameState === 'PLAYING' && !isPaused) {
          gate.x -= speed;
          if (gate.x < -80) gate.x = GAME_WIDTH + 60;
        }

        ctx.save();
        ctx.translate(gate.x, groundY);
        ctx.fillStyle = '#c92a2a';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff4b5c';
        ctx.fillRect(-28, -130, 8, 130);
        ctx.fillRect(20, -130, 8, 130);
        ctx.fillRect(-34, -100, 68, 7);
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-38, -138, 76, 10);
        ctx.fillStyle = '#d62828';
        ctx.fillRect(-35, -132, 70, 6);
        ctx.fillStyle = '#111';
        ctx.fillRect(-4, -130, 8, 22);
        ctx.restore();
      });

      // 石灯籠
      lanterns.forEach(lan => {
        if (gameState === 'PLAYING' && !isPaused) {
          lan.x -= speed * 1.2;
          if (lan.x < -40) lan.x = GAME_WIDTH + 40;
        }

        ctx.save();
        ctx.translate(lan.x, groundY + 10);
        ctx.fillStyle = '#251e30';
        ctx.fillRect(-8, -25, 16, 25);
        ctx.fillRect(-12, -30, 24, 6);
        ctx.fillStyle = '#ffe600';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffe600';
        ctx.fillRect(-7, -42, 14, 12);
        ctx.fillStyle = '#161220';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(-16, -42);
        ctx.lineTo(16, -42);
        ctx.lineTo(0, -52);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // 舞い散る桜
      petals.forEach(p => {
        if (gameState === 'PLAYING' && !isPaused) {
          p.x += p.speedX;
          p.y += p.speedY;
          p.angle += p.rotSpeed;

          if (p.x < -10) p.x = GAME_WIDTH + 10;
          if (p.y > GAME_HEIGHT + 10) p.y = -10;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = '#ffb7c5';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff4b5c';
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.quadraticCurveTo(p.size, -p.size / 2, p.size / 2, p.size);
        ctx.quadraticCurveTo(0, p.size / 2, -p.size / 2, p.size);
        ctx.quadraticCurveTo(-p.size, -p.size / 2, 0, -p.size);
        ctx.fill();
        ctx.restore();
      });
    }

    /* ---------------------------------------------------------
       3. パーティクル (爆発・破片)
       --------------------------------------------------------- */
    function createExplosion(x, y, color, count = 22) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7.5 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 4.5 + 2,
          alpha: 1.0,
          color: color || '#00f0ff'
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.035;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    /* ---------------------------------------------------------
       4. 入力ハンドラー
       --------------------------------------------------------- */
    function handlePointerMove(e) {
      if (gameState !== 'PLAYING' || isPaused) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const coords = getGameCoordinates(clientX, clientY);
      player.targetY = Math.max(35, Math.min(GAME_HEIGHT - 35, coords.y));
    }

    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', (e) => {
      handlePointerMove(e);
      e.preventDefault();
    }, { passive: false });

    function handlePointerDown(e) {
      if (gameState !== 'PLAYING' || isPaused) return;
      if (e.target !== fireBtn) {
        handlePointerMove(e);
        shootPlayerBullet();
      }
    }

    window.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('touchstart', (e) => {
      handlePointerDown(e);
    }, { passive: false });

    fireBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      isFiring = true;
      shootPlayerBullet();
    });
    fireBtn.addEventListener('pointerup', () => { isFiring = false; });
    fireBtn.addEventListener('pointerleave', () => { isFiring = false; });

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && gameState === 'PLAYING') {
        shootPlayerBullet();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function shootPlayerBullet() {
      if (fireCooldown <= 0) {
        // 自機ショット：扇状5WAY高火力破魔弾
        const spd = CONFIG.BULLET_SPEED;
        playerBullets.push({ x: player.x + 25, y: player.y - 8, vx: spd, vy: 0, radius: 6 });
        playerBullets.push({ x: player.x + 25, y: player.y + 8, vx: spd, vy: 0, radius: 6 });
        playerBullets.push({ x: player.x + 20, y: player.y - 12, vx: spd * 0.95, vy: -1.8, radius: 5 });
        playerBullets.push({ x: player.x + 20, y: player.y + 12, vx: spd * 0.95, vy: 1.8, radius: 5 });
        playerBullets.push({ x: player.x + 15, y: player.y - 16, vx: spd * 0.9, vy: -3.5, radius: 5 });
        playerBullets.push({ x: player.x + 15, y: player.y + 16, vx: spd * 0.9, vy: 3.5, radius: 5 });
        
        fireCooldown = 6;
      }
    }

    /* ---------------------------------------------------------
       5. 雑魚敵 ＆ ボス 弾幕パターン生成エンジン
       --------------------------------------------------------- */

    // 汎用：弾生成ヘルパー
    function addEnemyBullet(x, y, vx, vy, type = 'circle', color = '#ff2a5f', glow = '#ff0055', radius = 6) {
      if (enemyBullets.length > 600) return; // 処理負荷防止の上限ガード
      enemyBullets.push({
        x, y, vx, vy,
        type,      // 'circle'(丸小弾), 'kunai'(クナイ針弾), 'big'(大玉), 'petal'(桜弾)
        color,
        glow,
        radius,
        angle: Math.atan2(vy, vx),
        timer: 0
      });
    }

    // A. 雑魚敵の多重弾幕パターン
    function spawnEnemyBulletPattern(enemy) {
      const ex = enemy.x;
      const ey = enemy.y + Math.sin(enemy.floatOffset) * 12;
      const baseAngle = Math.atan2(player.y - ey, player.x - ex);

      switch (enemy.type) {
        case 0: { // 青緑の鬼火：広角 7WAY 扇状小丸弾 ＋ 中央狙撃クナイ
          const count = 7;
          const spread = Math.PI / 3.0;
          for (let i = 0; i < count; i++) {
            const ang = baseAngle - spread / 2 + (spread / (count - 1)) * i;
            addEnemyBullet(ex, ey, Math.cos(ang) * 3.2, Math.sin(ang) * 3.2, 'circle', '#00f0ff', '#0088ff', 5);
          }
          // 中央高速針
          addEnemyBullet(ex, ey, Math.cos(baseAngle) * 5.2, Math.sin(baseAngle) * 5.2, 'kunai', '#ffe600', '#ffaa00', 5);
          break;
        }

        case 1: { // 朱色の妖狐：交差連射ストリーム弾 (左右交互)
          const side = (enemy.shootCount % 2 === 0) ? 1 : -1;
          const ang = baseAngle + side * 0.25;
          addEnemyBullet(ex, ey, Math.cos(ang) * 3.8, Math.sin(ang) * 3.8, 'kunai', '#ff2a5f', '#ff0055', 6);
          addEnemyBullet(ex, ey, Math.cos(baseAngle) * 3.4, Math.sin(baseAngle) * 3.4, 'circle', '#ffa200', '#ff5500', 5);
          break;
        }

        case 2: { // 紫のカラス天狗：全方位16連サークル弾
          const count = 16;
          const offsetAngle = enemy.shootCount * 0.15;
          for (let i = 0; i < count; i++) {
            const ang = (Math.PI * 2 / count) * i + offsetAngle;
            addEnemyBullet(ex, ey, Math.cos(ang) * 2.8, Math.sin(ang) * 2.8, 'circle', '#a000ff', '#d000ff', 5.5);
          }
          break;
        }

        case 3: { // 金色の妖怪大玉：低速巨大陰陽玉 ＋ 拡散桜花弁
          addEnemyBullet(ex, ey, Math.cos(baseAngle) * 2.0, Math.sin(baseAngle) * 2.0, 'big', '#ffe600', '#ff8800', 14);
          for (let i = 0; i < 6; i++) {
            const ang = baseAngle + (Math.PI * 2 / 6) * i;
            addEnemyBullet(ex, ey, Math.cos(ang) * 3.2, Math.sin(ang) * 3.2, 'petal', '#ffb7c5', '#ff2a5f', 7);
          }
          break;
        }
      }

      enemy.shootCount++;
    }

    // B. ボス（九尾の大妖魔）の5段階極高密度弾幕
    function spawnBoss() {
      bossLevel = Math.floor(score / CONFIG.BOSS_INTERVAL) || 1;
      const maxHp = CONFIG.BOSS_BASE_HP + (bossLevel - 1) * 80;
      boss = {
        x: GAME_WIDTH + 120,
        targetX: 720,
        y: GAME_HEIGHT / 2,
        radius: 54,
        hp: maxHp,
        maxHp: maxHp,
        floatOffset: 0,
        shootTimer: 0,
        phaseTimer: 0,
        name: `【第${bossLevel}関門】 九尾の大妖魔`
      };
      warningTimer = 140;

      document.getElementById('boss-title').textContent = boss.name;
      document.getElementById('boss-bar-wrapper').style.display = 'flex';
      updateBossHpBar();
    }

    function updateBossHpBar() {
      if (!boss) {
        document.getElementById('boss-bar-wrapper').style.display = 'none';
        return;
      }
      const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
      document.getElementById('boss-hp-fill').style.width = pct + '%';
    }

    function updateBossShooting() {
      if (!boss || boss.x > boss.targetX + 20) return;
      boss.shootTimer++;
      boss.phaseTimer++;

      const hpRatio = boss.hp / boss.maxHp;
      const ex = boss.x;
      const ey = boss.y + Math.sin(boss.floatOffset) * 22;
      const baseAngle = Math.atan2(player.y - ey, player.x - ex);

      // ★ ボス形態1 (HP 100% ~ 80%): 多重カラフル全方位リング波
      if (hpRatio >= 0.80) {
        if (boss.shootTimer % 35 === 0) {
          const count = 20;
          const rot = boss.phaseTimer * 0.08;
          for (let i = 0; i < count; i++) {
            const ang = (Math.PI * 2 / count) * i + rot;
            addEnemyBullet(ex, ey, Math.cos(ang) * 3.2, Math.sin(ang) * 3.2, 'circle', '#00f0ff', '#00aaff', 6);
            addEnemyBullet(ex, ey, Math.cos(ang) * 2.2, Math.sin(ang) * 2.2, 'circle', '#ff2a5f', '#ff0055', 5);
          }
        }
      }
      // ★ ボス形態2 (HP 80% ~ 60%): 双方向高速回転スパイラル渦弾
      else if (hpRatio >= 0.60) {
        if (boss.shootTimer % 4 === 0) {
          const ang1 = boss.phaseTimer * 0.22;
          const ang2 = -boss.phaseTimer * 0.22;
          addEnemyBullet(ex, ey, Math.cos(ang1) * 3.8, Math.sin(ang1) * 3.8, 'kunai', '#ffe600', '#ff9900', 6);
          addEnemyBullet(ex, ey, Math.cos(ang1 + Math.PI) * 3.8, Math.sin(ang1 + Math.PI) * 3.8, 'kunai', '#ffe600', '#ff9900', 6);
          
          addEnemyBullet(ex, ey, Math.cos(ang2) * 3.2, Math.sin(ang2) * 3.2, 'circle', '#ff2a5f', '#ff0055', 5);
          addEnemyBullet(ex, ey, Math.cos(ang2 + Math.PI) * 3.2, Math.sin(ang2 + Math.PI) * 3.2, 'circle', '#ff2a5f', '#ff0055', 5);
        }
      }
      // ★ ボス形態3 (HP 60% ~ 40%): 咲き狂う桜花弁スターバースト (星型全方位拡散)
      else if (hpRatio >= 0.40) {
        if (boss.shootTimer % 40 === 0) {
          const petalsCount = 24;
          for (let i = 0; i < petalsCount; i++) {
            const ang = (Math.PI * 2 / petalsCount) * i + (boss.phaseTimer * 0.12);
            const speed = (i % 2 === 0) ? 3.6 : 2.2;
            addEnemyBullet(ex, ey, Math.cos(ang) * speed, Math.sin(ang) * speed, 'petal', '#ffb7c5', '#ff2a5f', 7);
          }
        }
        // 自機狙い高速クナイ
        if (boss.shootTimer % 18 === 0) {
          for (let i = -1; i <= 1; i++) {
            const ang = baseAngle + i * 0.15;
            addEnemyBullet(ex, ey, Math.cos(ang) * 5.0, Math.sin(ang) * 5.0, 'kunai', '#a000ff', '#d000ff', 6);
          }
        }
      }
      // ★ ボス形態4 (HP 40% ~ 20%): 低速巨大陰陽玉 ＋ 超高速針クナイ交差
      else if (hpRatio >= 0.20) {
        if (boss.shootTimer % 50 === 0) {
          // 3連巨大玉
          for (let i = -1; i <= 1; i++) {
            const ang = baseAngle + i * 0.3;
            addEnemyBullet(ex, ey, Math.cos(ang) * 1.8, Math.sin(ang) * 1.8, 'big', '#ffe600', '#ffaa00', 16);
          }
        }
        if (boss.shootTimer % 6 === 0) {
          const waveAng = Math.sin(boss.phaseTimer * 0.15) * 0.8 + baseAngle;
          addEnemyBullet(ex, ey, Math.cos(waveAng) * 5.8, Math.sin(waveAng) * 5.8, 'kunai', '#00f0ff', '#00ffff', 5);
        }
      }
      // ★ ボス形態5 (HP 20% ~ 0% 【発狂モード】): 猛烈全方位渦巻き ＋ 9WAY超連射扇状狙撃
      else {
        // 激しい全方位螺旋
        if (boss.shootTimer % 3 === 0) {
          const ang = boss.phaseTimer * 0.35;
          addEnemyBullet(ex, ey, Math.cos(ang) * 3.5, Math.sin(ang) * 3.5, 'circle', '#ff0055', '#ff2a5f', 5);
          addEnemyBullet(ex, ey, Math.cos(-ang) * 3.5, Math.sin(-ang) * 3.5, 'circle', '#ffe600', '#ffaa00', 5);
        }
        // 9WAY狙撃扇
        if (boss.shootTimer % 28 === 0) {
          const way = 9;
          const spread = Math.PI / 2.2;
          for (let i = 0; i < way; i++) {
            const ang = baseAngle - spread / 2 + (spread / (way - 1)) * i;
            addEnemyBullet(ex, ey, Math.cos(ang) * 4.6, Math.sin(ang) * 4.6, 'kunai', '#a000ff', '#ffffff', 6.5);
          }
        }
      }
    }

    /* ---------------------------------------------------------
       6. ゲーム更新 ＆ 当たり判定
       --------------------------------------------------------- */
    function resetGame() {
      score = 0;
      startTime = Date.now();
      lastSpawnTime = Date.now();
      elapsedTime = 0;
      fireCooldown = 0;
      frameCount = 0;

      boss = null;
      bossLevel = 1;
      nextBossKills = CONFIG.BOSS_INTERVAL;
      warningTimer = 0;

      player.x = 120;
      player.y = GAME_HEIGHT / 2;
      player.targetY = GAME_HEIGHT / 2;

      playerBullets = [];
      enemyBullets = [];
      enemies = [];
      particles = [];

      scoreVal.textContent = "0";
      timeVal.textContent = "0.0";
      document.getElementById('boss-bar-wrapper').style.display = 'none';
    }

    function startGame() {
      resetGame();
      gameState = 'PLAYING';
      uiTitle.style.display = 'none';
      uiGameOver.style.display = 'none';
      hud.style.display = 'flex';
      fireBtn.style.display = 'flex';
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      hud.style.display = 'none';
      fireBtn.style.display = 'none';
      document.getElementById('boss-bar-wrapper').style.display = 'none';

      finalScore.textContent = score;
      finalTime.textContent = elapsedTime.toFixed(1);
      uiGameOver.style.display = 'flex';
    }

    function spawnEnemy() {
      const type = Math.floor(Math.random() * 4);
      const radius = 22;
      enemies.push({
        x: GAME_WIDTH + radius + 20,
        y: Math.random() * (GAME_HEIGHT - 140) + 50,
        radius: radius,
        speed: CONFIG.ENEMY_SPEED + (Math.random() * 0.8),
        floatOffset: Math.random() * Math.PI * 2,
        floatSpeed: Math.random() * 0.05 + 0.03,
        type: type,
        shootTimer: Math.floor(Math.random() * 15),
        shootCount: 0,
        hp: (type === 3) ? 5 : 3
      });
    }

    function update() {
      if (gameState !== 'PLAYING' || isPaused) return;

      frameCount++;
      elapsedTime = (Date.now() - startTime) / 1000;
      timeVal.textContent = elapsedTime.toFixed(1);

      // キーボード移動
      const kbSpeed = 8.5;
      if (keys['ArrowUp'] || keys['KeyW']) player.targetY -= kbSpeed;
      if (keys['ArrowDown'] || keys['KeyS']) player.targetY += kbSpeed;
      player.targetY = Math.max(35, Math.min(GAME_HEIGHT - 35, player.targetY));

      // 自機スムーズ移動
      player.y += (player.targetY - player.y) * CONFIG.FOLLOW_SPEED;

      // 自機連射
      if (fireCooldown > 0) fireCooldown--;
      if ((isFiring || keys['Space']) && fireCooldown <= 0) {
        shootPlayerBullet();
      }

      // 1. 自機弾更新
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x > GAME_WIDTH + 30 || b.y < -20 || b.y > GAME_HEIGHT + 20) {
          playerBullets.splice(i, 1);
        }
      }

      // ボス出現トリガー
      if (score >= nextBossKills && !boss) {
        spawnBoss();
      }

      // 2. 雑魚敵スポーン (ボス戦時は停止)
      if (!boss && Date.now() - lastSpawnTime > CONFIG.SPAWN_INTERVAL) {
        spawnEnemy();
        lastSpawnTime = Date.now();
      }

      // ボスの更新 ＆ 当たり判定
      if (boss) {
        if (boss.x > boss.targetX) boss.x -= 2.2;
        boss.floatOffset += 0.03;
        updateBossShooting();

        const currentBossY = boss.y + Math.sin(boss.floatOffset) * 22;

        // 自機 vs ボス直撃
        const distToPlayer = Math.hypot(boss.x - player.x, currentBossY - player.y);
        if (distToPlayer < boss.radius + player.hitRadius) {
          createExplosion(player.x, player.y, CONFIG.PLAYER_COLOR, 40);
          createExplosion(boss.x, currentBossY, '#ff0055', 40);
          gameOver();
          return;
        }

        // 自機弾 vs ボス
        for (let j = playerBullets.length - 1; j >= 0; j--) {
          const pb = playerBullets[j];
          const distToBullet = Math.hypot(boss.x - pb.x, currentBossY - pb.y);
          if (distToBullet < boss.radius + pb.radius) {
            createExplosion(pb.x, pb.y, '#ffe600', 5);
            playerBullets.splice(j, 1);
            boss.hp--;
            updateBossHpBar();

            if (boss.hp <= 0) {
              // ボス撃破！華やかな大爆発
              for (let k = 0; k < 8; k++) {
                createExplosion(
                  boss.x + (Math.random() - 0.5) * 90,
                  currentBossY + (Math.random() - 0.5) * 90,
                  '#ff0055',
                  30
                );
                createExplosion(
                  boss.x + (Math.random() - 0.5) * 90,
                  currentBossY + (Math.random() - 0.5) * 90,
                  '#ffe600',
                  30
                );
              }
              score += 5;
              scoreVal.textContent = score;
              nextBossKills = (Math.floor(score / CONFIG.BOSS_INTERVAL) + 1) * CONFIG.BOSS_INTERVAL;
              boss = null;
              document.getElementById('boss-bar-wrapper').style.display = 'none';
              break;
            }
          }
        }
      }

      // 3. 雑魚敵の動作 ＆ 弾幕発射処理
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x -= e.speed;
        e.floatOffset += e.floatSpeed;
        const currentY = e.y + Math.sin(e.floatOffset) * 12;

        // 画面内発射
        if (e.x < GAME_WIDTH - 20 && e.x > 80) {
          e.shootTimer++;
          
          const interval = (e.type === 1) ? 14 : CONFIG.ENEMY_SHOOT_INTERVAL;
          if (e.shootTimer >= interval) {
            spawnEnemyBulletPattern(e);
            e.shootTimer = 0;
          }
        }

        // 画面外脱出
        if (e.x < -e.radius - 40) {
          enemies.splice(i, 1);
          continue;
        }

        // 自機 vs 雑魚敵直撃
        const distToPlayer = Math.hypot(e.x - player.x, currentY - player.y);
        if (distToPlayer < e.radius + player.hitRadius) {
          createExplosion(player.x, player.y, CONFIG.PLAYER_COLOR, 35);
          createExplosion(e.x, currentY, '#00f0ff', 35);
          gameOver();
          return;
        }

        // 自機弾 vs 雑魚敵
        for (let j = playerBullets.length - 1; j >= 0; j--) {
          const pb = playerBullets[j];
          const distToBullet = Math.hypot(e.x - pb.x, currentY - pb.y);

          if (distToBullet < e.radius + pb.radius) {
            createExplosion(pb.x, pb.y, '#ffe600', 6);
            playerBullets.splice(j, 1);
            
            e.hp--;
            if (e.hp <= 0) {
              createExplosion(e.x, currentY, '#00f0ff', 25);
              createExplosion(e.x, currentY, '#ffe600', 15);
              enemies.splice(i, 1);
              score++;
              scoreVal.textContent = score;
              break;
            }
          }
        }
      }

      // 4. 敵弾（弾幕）の更新 ＆ 自機との喰らい判定
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;
        eb.timer++;

        // 画面外消去
        if (eb.x < -40 || eb.x > GAME_WIDTH + 40 || eb.y < -40 || eb.y > GAME_HEIGHT + 40) {
          enemyBullets.splice(i, 1);
          continue;
        }

        // ★ 判定：敵弾 vs 自機判定点 (player.hitRadius = 4.5px) ★
        const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
        if (dist < eb.radius + player.hitRadius) {
          createExplosion(player.x, player.y, '#ff0055', 40);
          createExplosion(player.x, player.y, '#ffe600', 30);
          gameOver();
          return;
        }
      }
    }

    /* ---------------------------------------------------------
       7. 描画処理 (多彩な妖弾グラフィック・極小判定点)
       --------------------------------------------------------- */
    function draw() {
      drawBackground();
      updateAndDrawParticles();

      if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        
        // A. 自機ショット描画
        playerBullets.forEach(b => {
          ctx.save();
          ctx.shadowBlur = 12;
          ctx.shadowColor = CONFIG.BULLET_COLOR;
          ctx.fillStyle = CONFIG.BULLET_COLOR;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // B. ボス（九尾の大妖魔）描画
        if (boss) {
          const currentBossY = boss.y + Math.sin(boss.floatOffset) * 22;
          ctx.save();
          ctx.translate(boss.x, currentBossY);

          // 9本の尾
          ctx.fillStyle = 'rgba(255, 0, 85, 0.8)';
          ctx.shadowBlur = 25;
          ctx.shadowColor = '#ff0055';
          for (let i = 0; i < 9; i++) {
            const tailAngle = (i - 4) * 0.22 + Math.sin(frameCount * 0.05 + i) * 0.14;
            ctx.save();
            ctx.rotate(tailAngle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(65, -38, 105, 0);
            ctx.quadraticCurveTo(65, 38, 0, 0);
            ctx.fill();
            ctx.restore();
          }

          // 妖術魔法陣
          ctx.save();
          ctx.rotate(frameCount * 0.025);
          ctx.strokeStyle = '#ffe600';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(0, 0, boss.radius + 18, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.rect(-boss.radius, -boss.radius, boss.radius * 2, boss.radius * 2);
          ctx.stroke();
          ctx.restore();

          // ボス本体核
          const bossGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, boss.radius);
          bossGrad.addColorStop(0, '#ffffff');
          bossGrad.addColorStop(0.35, '#ff0055');
          bossGrad.addColorStop(0.8, '#800f2f');
          bossGrad.addColorStop(1, 'rgba(20, 0, 30, 0.9)');

          ctx.fillStyle = bossGrad;
          ctx.beginPath();
          ctx.arc(0, 0, boss.radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }

        // WARNING アラート表示
        if (warningTimer > 0) {
          warningTimer--;
          if (Math.floor(warningTimer / 10) % 2 === 0) {
            ctx.save();
            ctx.fillStyle = 'rgba(255, 0, 85, 0.25)';
            ctx.fillRect(0, 190, GAME_WIDTH, 160);

            ctx.font = '900 42px "Hiragino Kaku Gothic ProN", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffe600';
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ff0055';
            ctx.fillText('⚠️ WARNING!! 大妖魔襲来 ⚠️', GAME_WIDTH / 2, GAME_HEIGHT / 2);
            ctx.restore();
          }
        }

        // C. 雑魚敵（4種類の和風妖怪）描画
        enemies.forEach(e => {
          const currentY = e.y + Math.sin(e.floatOffset) * 12;
          ctx.save();
          ctx.translate(e.x, currentY);

          const colors = ['#00f0ff', '#ff2a5f', '#a000ff', '#ffe600'];
          const mainColor = colors[e.type] || '#00f0ff';

          ctx.shadowBlur = 20;
          ctx.shadowColor = mainColor;

          const flameGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, e.radius);
          flameGrad.addColorStop(0, '#ffffff');
          flameGrad.addColorStop(0.45, mainColor);
          flameGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          
          ctx.fillStyle = flameGrad;
          ctx.beginPath();
          ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
          ctx.fill();

          // 妖火炎の尾
          ctx.fillStyle = mainColor;
          ctx.beginPath();
          ctx.moveTo(0, -e.radius * 0.7);
          ctx.quadraticCurveTo(e.radius * 1.6, 0, e.radius * 0.8, e.radius * 0.7);
          ctx.quadraticCurveTo(0, e.radius * 0.3, 0, -e.radius * 0.7);
          ctx.fill();

          ctx.restore();
        });

        // D. 敵弾幕（多彩な弾の種別描画）
        enemyBullets.forEach(eb => {
          ctx.save();
          ctx.translate(eb.x, eb.y);

          ctx.shadowBlur = 12;
          ctx.shadowColor = eb.glow || '#ff0055';

          if (eb.type === 'kunai') {
            // ★ クナイ/針弾 (進行方向に回転)
            ctx.rotate(eb.angle);
            ctx.fillStyle = eb.color;
            ctx.beginPath();
            ctx.moveTo(eb.radius * 2.2, 0);
            ctx.lineTo(-eb.radius * 1.2, -eb.radius * 0.7);
            ctx.lineTo(-eb.radius * 0.5, 0);
            ctx.lineTo(-eb.radius * 1.2, eb.radius * 0.7);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-2, -1.5, 6, 3);
          } 
          else if (eb.type === 'big') {
            // ★ 巨大陰陽玉/大玉
            const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, eb.radius);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.3, eb.color);
            grad.addColorStop(1, 'rgba(20,0,30,0.8)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, eb.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
          } 
          else if (eb.type === 'petal') {
            // ★ 桜花弁弾
            ctx.rotate(eb.angle + eb.timer * 0.08);
            ctx.fillStyle = eb.color;
            ctx.beginPath();
            ctx.moveTo(0, -eb.radius);
            ctx.quadraticCurveTo(eb.radius, -eb.radius / 2, eb.radius / 2, eb.radius);
            ctx.quadraticCurveTo(0, eb.radius / 2, -eb.radius / 2, eb.radius);
            ctx.quadraticCurveTo(-eb.radius, -eb.radius / 2, 0, -eb.radius);
            ctx.fill();
          } 
          else {
            // ★ 標準小丸弾
            ctx.fillStyle = eb.color || '#ff2a5f';
            ctx.beginPath();
            ctx.arc(0, 0, eb.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, eb.radius * 0.45, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        });

        // E. 自機（式神のお札）＆ 喰らい判定ドット表示
        if (gameState === 'PLAYING') {
          ctx.save();
          ctx.translate(player.x, player.y);

          // 霊力オーラ
          ctx.shadowBlur = 18;
          ctx.shadowColor = CONFIG.PLAYER_COLOR;
          
          const tailGrad = ctx.createLinearGradient(0, 0, -45, 0);
          tailGrad.addColorStop(0, CONFIG.PLAYER_COLOR);
          tailGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = tailGrad;
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.lineTo(-45, 0);
          ctx.lineTo(0, 10);
          ctx.closePath();
          ctx.fill();

          // お札本体
          ctx.rotate(0.08);
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = CONFIG.PLAYER_COLOR;
          ctx.lineWidth = 2.5;
          ctx.fillRect(-14, -22, 28, 44);
          ctx.strokeRect(-14, -22, 28, 44);

          // 呪印
          ctx.fillStyle = CONFIG.PLAYER_COLOR;
          ctx.fillRect(-6, -16, 12, 5);
          ctx.fillRect(-3, -8, 6, 18);
          ctx.fillRect(-8, 2, 16, 3);
          ctx.fillRect(-8, 10, 16, 3);

          ctx.restore();

          // ★ 喰らい判定ポイント（自機中心に小さく輝く赤い点） ★
          ctx.save();
          ctx.translate(player.x, player.y);
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#ff0000';
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#ff0055';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, player.hitRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    /* ---------------------------------------------------------
       8. 主ループ
       --------------------------------------------------------- */
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    initBackgroundElements();
    requestAnimationFrame(gameLoop);

    /* ---------------------------------------------------------
       9. ボタンイベント
       --------------------------------------------------------- */
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('retry-btn').addEventListener('click', startGame);

    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      const target = document.documentElement;
      if (!document.fullscreenElement) {
        if (target.requestFullscreen) {
          target.requestFullscreen();
        } else if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });
  </script>
</body>
