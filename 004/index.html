<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>マイ・シューティングゲーム</title>
  <style>
    /* 全体スタイル・スクロール防止 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #030308;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 縦画面警告メッセージ */
    #portrait-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 15, 0.98);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 22px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }
    #portrait-warning .phone-icon {
      font-size: 60px;
      margin-bottom: 20px;
      animation: rotate-device 2s infinite ease-in-out;
    }
    @keyframes rotate-device {
      0%, 10% { transform: rotate(0deg); }
      40%, 60% { transform: rotate(-90deg); }
      90%, 100% { transform: rotate(0deg); }
    }

    /* ゲームコンテナ（16:9固定・余白自動調整） */
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
      border: 2px solid #00ffff;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* UI画面オーバーレイ */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 5, 15, 0.85);
      backdrop-filter: blur(4px);
      z-index: 10;
      transition: opacity 0.3s;
    }
    .hidden {
      display: none !important;
    }

    /* ネオン風テキスト & ボタン */
    h1 {
      font-size: 44px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #0088ff;
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-align: center;
    }
    p.instruction {
      font-size: 15px;
      color: #d0e0ff;
      margin-bottom: 25px;
      text-align: center;
      line-height: 1.8;
      background: rgba(0, 255, 255, 0.05);
      padding: 15px 25px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 255, 0.2);
    }
    .btn-group {
      display: flex;
      gap: 20px;
    }
    .neon-btn {
      padding: 12px 32px;
      font-size: 18px;
      font-weight: bold;
      color: #00ffff;
      background: transparent;
      border: 2px solid #00ffff;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.2);
      text-shadow: 0 0 5px #00ffff;
      transition: all 0.2s ease;
      outline: none;
    }
    .neon-btn:active {
      background: #00ffff;
      color: #000;
      box-shadow: 0 0 25px #00ffff;
    }

    /* プレイ中HUD */
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-family: monospace;
      font-size: 22px;
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff;
      font-weight: bold;
      z-index: 5;
    }

    /* スマホ用独立FIREボタン */
    #fire-btn {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 0, 100, 0.35);
      border: 3px solid #ff0055;
      color: #ffffff;
      font-weight: bold;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6), inset 0 0 10px rgba(255, 0, 85, 0.4);
      text-shadow: 0 0 5px #ff0055;
      z-index: 6;
      cursor: pointer;
      outline: none;
    }
    #fire-btn:active {
      background: rgba(255, 0, 100, 0.85);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- 縦画面警告 -->
  <div id="portrait-warning">
    <div class="phone-icon">📱</div>
    <div>スマホを横にしてね</div>
  </div>

  <!-- ゲームコンテナ（960x540 固定比率） -->
  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- プレイ中表示HUD -->
    <div id="hud" class="hidden">
      <div>TIME: <span id="time-val">0.0</span>s</div>
      <div>HIT: <span id="hit-val">0</span></div>
    </div>

    <!-- タップ発射用FIREボタン -->
    <button id="fire-btn" class="hidden">FIRE</button>

    <!-- タイトル画面 -->
    <div id="title-screen" class="screen">
      <h1 id="title-text">CANDY SHOOTING</h1>
      <p class="instruction">
        【操作方法】<br>
        ・上下ドラッグ（またはW/S・矢印キー）: 宇宙船の移動<br>
        ・画面タップ / 右下FIREボタン / Spaceキー: 弾発射
      </p>
      <div class="btn-group">
        <button id="start-btn" class="neon-btn">PLAY GAME</button>
        <button id="fullscreen-btn" class="neon-btn">FULL SCREEN</button>
      </div>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-screen" class="screen hidden">
      <h1>GAME OVER</h1>
      <p class="instruction" id="final-stats">
        TIME: 0.0s<br>
        HIT: 0
      </p>
      <button id="retry-btn" class="neon-btn">RETRY</button>
    </div>
  </div>

  <script>
    // =========================================================
    // 【CONFIG】体験授業用カスタマイズ設定
    // =========================================================
    const CONFIG = {
      title: "CANDY SHOOTING",      // タイトルテキスト
      bgColor: "#080816",           // 背景色
      playerColor: "#00ffff",       // 自機の色
      enemyColor: "#ff3399",        // 敵（キャンディー）の色
      bulletColor: "#ffff00",       // 弾の色
      enemySpeedMin: 180,           // 敵の最小スピード (px/秒)
      enemySpeedMax: 360,           // 敵の最大スピード (px/秒)
      enemySpawnInterval: 0.7,      // 敵の出現間隔 (秒)
      bulletSpeed: 850,             // 弾のスピード (px/秒)
      playerFollowSpeed: 0.25       // ドラッグ移動の追従スムーズさ (0.05〜1.0)
    };

    // 仮想ゲーム世界サイズ
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;

    // ゲーム状態
    let canvas, ctx;
    let gameState = 'TITLE'; // 'TITLE', 'PLAYING', 'GAMEOVER'
    let isPaused = false;
    let lastTime = 0;

    // スコア＆タイマー
    let score = 0;
    let survivalTime = 0;
    let fireTimer = 0;
    let spawnTimer = 0;

    // 入力状態
    const keys = {};
    let isFiring = false;
    let isDragging = false;

    // オブジェクトデータ
    let player = {
      x: 100,
      y: 270,
      targetY: 270,
      radius: 18
    };
    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];

    // =========================================================
    // 初期化
    // =========================================================
    window.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');

      // 設定適用
      document.getElementById('title-text').textContent = CONFIG.title;

      // 背景の星を生成
      for (let i = 0; i < 60; i++) {
        stars.push({
          x: Math.random() * GAME_WIDTH,
          y: Math.random() * GAME_HEIGHT,
          size: Math.random() * 2 + 1,
          speed: Math.random() * 80 + 20
        });
      }

      // イベントリスナー設定
      window.addEventListener('resize', resizeGame);
      window.addEventListener('orientationchange', resizeGame);
      resizeGame();

      document.getElementById('start-btn').addEventListener('click', startGame);
      document.getElementById('retry-btn').addEventListener('click', startGame);
      document.getElementById('fullscreen-btn').addEventListener('click', toggleFullScreen);

      setupInputListeners();

      // ゲームループ起動
      requestAnimationFrame(gameLoop);
    });

    // 画面リサイズ & 16:9表示保持
    function resizeGame() {
      const container = document.getElementById('game-container');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      const targetRatio = GAME_WIDTH / GAME_HEIGHT;
      const currentRatio = windowWidth / windowHeight;

      let w, h;
      if (currentRatio > targetRatio) {
        h = windowHeight;
        w = h * targetRatio;
      } else {
        w = windowWidth;
        h = w / targetRatio;
      }

      container.style.width = `${w}px`;
      container.style.height = `${h}px`;

      // 縦画面判定（一時停止メッセージ表示）
      const warning = document.getElementById('portrait-warning');
      if (windowWidth < windowHeight && windowWidth < 768) {
        warning.style.display = 'flex';
        isPaused = true;
      } else {
        warning.style.display = 'none';
        if (gameState === 'PLAYING') isPaused = false;
      }
    }

    // 全画面表示切替
    function toggleFullScreen() {
      const container = document.getElementById('game-container');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // =========================================================
    // 入力処理（座標変換・移動・発射）
    // =========================================================
    function getGameCoords(e) {
      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else if (e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      const scaleX = GAME_WIDTH / rect.width;
      const scaleY = GAME_HEIGHT / rect.height;

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function setupInputListeners() {
      const container = document.getElementById('game-container');
      const fireBtn = document.getElementById('fire-btn');

      // FIREボタンのイベント処理（移動操作と分離）
      const fireStart = (e) => {
        e.preventDefault();
        e.stopPropagation();
        isFiring = true;
      };
      const fireEnd = (e) => {
        e.preventDefault();
        e.stopPropagation();
        isFiring = false;
      };

      fireBtn.addEventListener('touchstart', fireStart, { passive: false });
      fireBtn.addEventListener('touchend', fireEnd, { passive: false });
      fireBtn.addEventListener('mousedown', fireStart);
      fireBtn.addEventListener('mouseup', fireEnd);

      // ドラッグ & タップ発射処理
      const handleDown = (e) => {
        if (gameState !== 'PLAYING' || isPaused) return;
        if (e.target === fireBtn) return;

        isDragging = true;
        const pos = getGameCoords(e);
        player.targetY = pos.y;
        isFiring = true;
      };

      const handleMove = (e) => {
        if (!isDragging || gameState !== 'PLAYING' || isPaused) return;
        const pos = getGameCoords(e);
        player.targetY = pos.y;
      };

      const handleUp = (e) => {
        if (e.target === fireBtn) return;
        isDragging = false;
        isFiring = false;
      };

      container.addEventListener('mousedown', handleDown);
      window.addEventListener('mousemove', handleMove);
      window.addEventListener('mouseup', handleUp);

      container.addEventListener('touchstart', handleDown, { passive: false });
      window.addEventListener('touchmove', handleMove, { passive: false });
      window.addEventListener('touchend', handleUp, { passive: false });

      // キーボード操作
      window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Space') isFiring = true;
      });

      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
        if (e.code === 'Space') isFiring = false;
      });
    }

    // =========================================================
    // ゲーム進行・ゲームオーバー
    // =========================================================
    function startGame() {
      score = 0;
      survivalTime = 0;
      fireTimer = 0;
      spawnTimer = 0;
      bullets = [];
      enemies = [];
      particles = [];

      player.y = GAME_HEIGHT / 2;
      player.targetY = GAME_HEIGHT / 2;

      document.getElementById('hit-val').textContent = '0';
      document.getElementById('time-val').textContent = '0.0';

      document.getElementById('title-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      document.getElementById('fire-btn').classList.remove('hidden');

      gameState = 'PLAYING';
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';

      // 自機爆発エフェクト
      createExplosion(player.x, player.y, CONFIG.playerColor, 35);

      setTimeout(() => {
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('fire-btn').classList.add('hidden');
        document.getElementById('final-stats').innerHTML = 
          `TIME: ${survivalTime.toFixed(1)}s<br>HIT: ${score}`;
        document.getElementById('gameover-screen').classList.remove('hidden');
      }, 500);
    }

    // =========================================================
    // メインループ
    // =========================================================
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      if (gameState === 'PLAYING' && !isPaused) {
        update(dt);
      } else if (gameState === 'GAMEOVER') {
        updateParticles(dt);
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      // 生存時間更新
      survivalTime += dt;
      document.getElementById('time-val').textContent = survivalTime.toFixed(1);

      // キーボード移動
      if (keys['KeyW'] || keys['ArrowUp']) player.targetY -= 450 * dt;
      if (keys['KeyS'] || keys['ArrowDown']) player.targetY += 450 * dt;

      // 画面端の移動制限
      player.targetY = Math.max(player.radius, Math.min(GAME_HEIGHT - player.radius, player.targetY));

      // 自機移動（スムーズ追従）
      player.y += (player.targetY - player.y) * CONFIG.playerFollowSpeed;

      // 弾の発射制御
      fireTimer += dt;
      if (isFiring && fireTimer >= 0.15) { // 連射間隔 0.15秒
        fireTimer = 0;
        bullets.push({
          x: player.x + 20,
          y: player.y,
          radius: 5
        });
      }

      // 弾の更新
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].x += CONFIG.bulletSpeed * dt;
        if (bullets[i].x > GAME_WIDTH + 20) {
          bullets.splice(i, 1);
        }
      }

      // 敵（キャンディー）の出現
      spawnTimer += dt;
      if (spawnTimer >= CONFIG.enemySpawnInterval) {
        spawnTimer = 0;
        const speed = CONFIG.enemySpeedMin + Math.random() * (CONFIG.enemySpeedMax - CONFIG.enemySpeedMin);
        enemies.push({
          x: GAME_WIDTH + 30,
          y: Math.random() * (GAME_HEIGHT - 60) + 30,
          speed: speed,
          radius: 18,
          rotation: Math.random() * Math.PI
        });
      }

      // 敵の移動 & 当たり判定
      for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
        const e = enemies[eIdx];
        e.x -= e.speed * dt;
        e.rotation += dt * 2; // キャンディーの回転

        // 画面外脱出
        if (e.x < -30) {
          enemies.splice(eIdx, 1);
          continue;
        }

        // 自機との当たり判定
        const distPlayer = Math.hypot(e.x - player.x, e.y - player.y);
        if (distPlayer < e.radius + player.radius) {
          triggerGameOver();
          return;
        }

        // 弾との当たり判定
        for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
          const b = bullets[bIdx];
          const distBullet = Math.hypot(e.x - b.x, e.y - b.y);

          if (distBullet < e.radius + b.radius) {
            createExplosion(e.x, e.y, CONFIG.enemyColor, 15);
            enemies.splice(eIdx, 1);
            bullets.splice(bIdx, 1);
            score++;
            document.getElementById('hit-val').textContent = score;
            break;
          }
        }
      }

      // 背景の星のスクロール
      for (let s of stars) {
        s.x -= s.speed * dt;
        if (s.x < 0) s.x = GAME_WIDTH;
      }

      updateParticles(dt);
    }

    function createExplosion(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 220;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: color,
          radius: 2 + Math.random() * 3,
          alpha: 1.0,
          decay: 1.2 + Math.random() * 1.5
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= p.decay * dt;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    // =========================================================
    // 描画処理
    // =========================================================
    function render() {
      // 背景描画
      ctx.fillStyle = CONFIG.bgColor;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // 背景の星描画
      ctx.fillStyle = "#ffffff";
      for (let s of stars) {
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }

      // 弾の描画
      for (let b of bullets) {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(b.x, b.y, 10, 4, 0, 0, Math.PI * 2);
        ctx.fillStyle = CONFIG.bulletColor;
        ctx.shadowColor = CONFIG.bulletColor;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }

      // 敵（キャンディー）の描画
      for (let e of enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rotation);

        const r = e.radius;

        // 左右の包み紙（リボン部）
        ctx.fillStyle = CONFIG.enemyColor;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;

        // 左包み紙
        ctx.beginPath();
        ctx.moveTo(-r + 2, 0);
        ctx.lineTo(-r - 14, -11);
        ctx.lineTo(-r - 8, 0);
        ctx.lineTo(-r - 14, 11);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 右包み紙
        ctx.beginPath();
        ctx.moveTo(r - 2, 0);
        ctx.lineTo(r + 14, -11);
        ctx.lineTo(r + 8, 0);
        ctx.lineTo(r + 14, 11);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // キャンディー本体（丸）
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = CONFIG.enemyColor;
        ctx.shadowColor = CONFIG.enemyColor;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();

        // キャンディーのハイライト・模様（つやと渦巻きライン）
        ctx.shadowBlur = 0;

        // 白い光沢スポット
        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 0.35, r * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
        ctx.fill();

        // ポップな渦巻き線
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.55, -Math.PI * 0.3, Math.PI * 0.3);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.restore();
      }

      // 自機の描画
      if (gameState === 'PLAYING') {
        ctx.save();
        ctx.translate(player.x, player.y);

        // ジェット噴射
        const flameSize = 10 + Math.random() * 8;
        ctx.beginPath();
        ctx.moveTo(-15, 0);
        ctx.lineTo(-15 - flameSize, -6);
        ctx.lineTo(-15 - flameSize, 6);
        ctx.closePath();
        ctx.fillStyle = "#ffaa00";
        ctx.shadowColor = "#ffaa00";
        ctx.shadowBlur = 10;
        ctx.fill();

        // 機体
        ctx.beginPath();
        ctx.moveTo(22, 0);
        ctx.lineTo(-14, -18);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-14, 18);
        ctx.closePath();

        ctx.fillStyle = CONFIG.playerColor;
        ctx.shadowColor = CONFIG.playerColor;
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();
      }

      // パーティクル描画
      for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }
    }
  </script>
</body>
</html>
