<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>癒やしの魔法使い</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #1a0933;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
    }

    #game-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 960px;
      height: 540px;
      background-color: #12002b;
      box-shadow: 0 0 25px rgba(230, 130, 255, 0.3);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      background: rgba(18, 0, 43, 0.85);
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 48px;
      color: #ff99f8;
      text-shadow: 0 0 10px #ff99f8, 0 0 20px #e052ff;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    p {
      font-size: 18px;
      margin-bottom: 12px;
      color: #f3e5ff;
      text-align: center;
      line-height: 1.5;
    }

    .btn-container {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    button {
      padding: 12px 30px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #da44ff, #8a2be2);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(218, 68, 255, 0.5);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    button:active {
      transform: scale(0.95);
      box-shadow: 0 0 5px rgba(218, 68, 255, 0.5);
    }

    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      color: #ffb8fb;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 0 5px #ff6eff;
      pointer-events: none;
      z-index: 5;
    }

    #fire-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 105, 180, 0.6);
      border: 3px solid #ff69b4;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
      z-index: 5;
      touch-action: none;
    }

    #fire-btn:active {
      background: rgba(255, 105, 180, 0.9);
    }

    #orientation-warning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #ff99f8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      z-index: 100;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <div id="hud">
      TIME: <span id="time-val">0</span>s | HEAL: <span id="hit-val">0</span>人
    </div>

    <div id="fire-btn">HEAL</div>

    <div id="title-screen" class="screen">
      <h1 id="title-text">癒やしの魔法使い</h1>
      <p>【操作方法】<br>上下ドラッグ（スワイプ）：魔法使いの移動<br>画面タップ / HEALボタン / スペースキー：癒やしの魔法を放つ<br>ケガをした人たちに魔法を当てて治してあげよう！</p>
      <div class="btn-container">
        <button id="start-btn">PLAY</button>
        <button id="fullscreen-btn">FULL SCREEN</button>
      </div>
    </div>

    <div id="gameover-screen" class="screen hidden">
      <h1 style="color: #ff77aa; text-shadow: 0 0 10px #ff77aa;">GAME OVER</h1>
      <p>ケガをした人とぶつかってしまいました！</p>
      <p>TIME: <span id="final-time">0</span>s</p>
      <p>HEAL: <span id="final-hit">0</span>人</p>
      <div class="btn-container">
        <button id="retry-btn">RETRY</button>
      </div>
    </div>
  </div>

  <div id="orientation-warning" class="hidden">
    📱 画面を横にして遊んでね！
  </div>

  <script>
    // ==========================================
    // カスタマイズ設定 (CONFIG)
    // ==========================================
    const CONFIG = {
      title: "癒やしの魔法使い",          // タイトルテキスト
      bgColor: "#12002b",               // 背景色
      playerColor: "#ff99f8",           // 魔法使いの色
      patientColor: "#ff7777",          // ケガをした人の色
      patientSpeed: 200,                // ケガ人の移動速度
      patientInterval: 1.2,             // 出現間隔(秒)
      magicSpeed: 750,                  // 魔法弾の速度
      playerFollowSpeed: 12.0           // ドラッグ追従の滑らかさ
    };

    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const titleText = document.getElementById('title-text');
    const titleScreen = document.getElementById('title-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const fireBtn = document.getElementById('fire-btn');
    const timeVal = document.getElementById('time-val');
    const hitVal = document.getElementById('hit-val');
    const finalTime = document.getElementById('final-time');
    const finalHit = document.getElementById('final-hit');
    const orientationWarning = document.getElementById('orientation-warning');

    titleText.textContent = CONFIG.title;
    container.style.backgroundColor = CONFIG.bgColor;

    let gameState = 'TITLE';
    let lastTime = 0;
    let elapsedTime = 0;
    let hitCount = 0;
    let spawnTimer = 0;
    let isTouching = false;
    let targetPlayerY = 270;

    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;

    const player = {
      x: 80,
      y: 270,
      width: 40,
      height: 40,
      color: CONFIG.playerColor
    };

    let magics = [];
    let patients = [];

    function resizeGame() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      if (windowHeight > windowWidth) {
        orientationWarning.classList.remove('hidden');
      } else {
        orientationWarning.classList.add('hidden');
      }

      const scale = Math.min(windowWidth / GAME_WIDTH, windowHeight / GAME_HEIGHT);
      container.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener('resize', resizeGame);
    window.addEventListener('orientationchange', resizeGame);
    resizeGame();

    function getGameCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleY = GAME_HEIGHT / rect.height;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return (clientY - rect.top) * scaleY;
    }

    function startGame() {
      gameState = 'PLAYING';
      elapsedTime = 0;
      hitCount = 0;
      spawnTimer = 0;
      magics = [];
      patients = [];
      player.y = 270;
      targetPlayerY = 270;

      timeVal.textContent = '0';
      hitVal.textContent = '0';

      titleScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
    }

    function castMagic() {
      if (gameState !== 'PLAYING') return;
      magics.push({
        x: player.x + 20,
        y: player.y,
        radius: 10,
        color: '#77ffff'
      });
    }

    function spawnPatient() {
      const size = 35;
      const minY = size;
      const maxY = GAME_HEIGHT - size;
      const randomY = Math.random() * (maxY - minY) + minY;

      patients.push({
        x: GAME_WIDTH + size,
        y: randomY,
        width: size,
        height: size,
        color: CONFIG.patientColor
      });
    }

    function handlePointerMove(e) {
      if (gameState !== 'PLAYING') return;
      targetPlayerY = getGameCoordinates(e);
    }

    function handlePointerStart(e) {
      if (gameState !== 'PLAYING') return;
      if (e.target !== fireBtn) {
        isTouching = true;
        targetPlayerY = getGameCoordinates(e);
        castMagic();
      }
    }

    function handlePointerEnd() {
      isTouching = false;
    }

    window.addEventListener('mousedown', handlePointerStart);
    window.addEventListener('mousemove', (e) => { if (isTouching || e.buttons === 1) handlePointerMove(e); });
    window.addEventListener('mouseup', handlePointerEnd);

    window.addEventListener('touchstart', handlePointerStart, { passive: false });
    window.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerEnd);

    fireBtn.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      e.preventDefault();
      castMagic();
    });
    fireBtn.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      castMagic();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        castMagic();
      }
    });

    startBtn.addEventListener('click', startGame);
    retryBtn.addEventListener('click', startGame);

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
          alert("全画面表示に対応していません: " + err.message);
        });
      } else {
        document.exitFullscreen();
      }
    });

    function checkCollision(circle, rect) {
      return (
        circle.x - circle.radius < rect.x + rect.width / 2 &&
        circle.x + circle.radius > rect.x - rect.width / 2 &&
        circle.y - circle.radius < rect.y + rect.height / 2 &&
        circle.y + circle.radius > rect.y - rect.height / 2
      );
    }

    function checkPlayerCollision(p1, p2) {
      return (
        p1.x - p1.width / 2 < p2.x + p2.width / 2 &&
        p1.x + p1.width / 2 > p2.x - p2.width / 2 &&
        p1.y - p1.height / 2 < p2.y + p2.height / 2 &&
        p1.y + p1.height / 2 > p2.y - p2.height / 2
      );
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      finalTime.textContent = Math.floor(elapsedTime);
      finalHit.textContent = hitCount;
      gameoverScreen.classList.remove('hidden');
    }

    function update(dt) {
      if (gameState !== 'PLAYING') return;

      elapsedTime += dt;
      timeVal.textContent = Math.floor(elapsedTime);

      player.y += (targetPlayerY - player.y) * CONFIG.playerFollowSpeed * dt;
      player.y = Math.max(player.height / 2, Math.min(GAME_HEIGHT - player.height / 2, player.y));

      spawnTimer += dt;
      if (spawnTimer >= CONFIG.patientInterval) {
        spawnPatient();
        spawnTimer = 0;
      }

      for (let i = magics.length - 1; i >= 0; i--) {
        magics[i].x += CONFIG.magicSpeed * dt;
        if (magics[i].x > GAME_WIDTH + 50) {
          magics.splice(i, 1);
        }
      }

      for (let i = patients.length - 1; i >= 0; i--) {
        patients[i].x -= CONFIG.patientSpeed * dt;

        if (checkPlayerCollision(player, patients[i])) {
          triggerGameOver();
          return;
        }

        if (patients[i].x < -50) {
          patients.splice(i, 1);
        }
      }

      for (let i = magics.length - 1; i >= 0; i--) {
        for (let j = patients.length - 1; j >= 0; j--) {
          if (checkCollision(magics[i], patients[j])) {
            magics.splice(i, 1);
            patients.splice(j, 1);
            hitCount++;
            hitVal.textContent = hitCount;
            break;
          }
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        // 1. 魔法使いの描画（帽子＋服をイメージした星型付きアイコン）
        ctx.fillStyle = player.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffb3ff';
        
        // とんがり帽子
        ctx.beginPath();
        ctx.moveTo(player.x + 15, player.y);
        ctx.lineTo(player.x - 20, player.y - 20);
        ctx.lineTo(player.x - 10, player.y + 20);
        ctx.closePath();
        ctx.fill();

        // 2. 癒やしの魔法弾（光る魔法玉）
        ctx.fillStyle = '#99ffff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00ffff';
        for (const m of magics) {
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        // 3. ケガした人（赤系の十字マーク付きのひし形）
        for (const p of patients) {
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = p.color;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.width / 2, 0, Math.PI * 2);
          ctx.fill();

          // ケガの包帯/絆創膏イメージのクロス
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(p.x - 2, p.y - 8, 4, 16);
          ctx.fillRect(p.x - 8, p.y - 2, 16, 4);
        }

        ctx.shadowBlur = 0;
      }
    }

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
