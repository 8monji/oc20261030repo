<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>癒やしの魔女</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #1a0933;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
    }

    #game-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 960px;
      height: 540px;
      background-color: #12002b;
      box-shadow: 0 0 25px rgba(230, 130, 255, 0.3);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      background: rgba(18, 0, 43, 0.85);
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 48px;
      color: #ff99f8;
      text-shadow: 0 0 10px #ff99f8, 0 0 20px #e052ff;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    p {
      font-size: 18px;
      margin-bottom: 12px;
      color: #f3e5ff;
      text-align: center;
      line-height: 1.5;
    }

    .btn-container {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    button {
      padding: 12px 30px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #da44ff, #8a2be2);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(218, 68, 255, 0.5);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    button:active {
      transform: scale(0.95);
      box-shadow: 0 0 5px rgba(218, 68, 255, 0.5);
    }

    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      color: #ffb8fb;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 0 5px #ff6eff;
      pointer-events: none;
      z-index: 5;
    }

    #fire-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 105, 180, 0.6);
      border: 3px solid #ff69b4;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
      z-index: 5;
      touch-action: none;
    }

    #fire-btn:active {
      background: rgba(255, 105, 180, 0.9);
    }

    #orientation-warning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #ff99f8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      z-index: 100;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <div id="hud">
      TIME: <span id="time-val">0</span>s | HEAL: <span id="hit-val">0</span>人
    </div>

    <div id="fire-btn">HEAL</div>

    <div id="title-screen" class="screen">
      <h1 id="title-text">癒や
