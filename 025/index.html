<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HALLOWEEN NIGHT SHOOTER - POWER UP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0717;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #05030a;
    }

    canvas {
      display: block;
      background-color: #120924;
      box-shadow: 0 0 25px rgba(255, 123, 0, 0.25);
    }

    /* UIレイヤー共通 */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
    }

    /* ハロウィン調ネオンボタン */
    .btn {
      pointer-events: auto;
      background: rgba(35, 12, 58, 0.85);
      color: #ff9900;
      border: 2px solid #ff9900;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 153, 0, 0.5);
      text-shadow: 0 0 6px rgba(255, 153, 0, 0.8);
      transition: all 0.2s;
      margin: 8px;
    }

    .btn:active {
      background: #ff9900;
      color: #1a0826;
      box-shadow: 0 0 24px #ff9900;
    }

    /* タイトル画面 */
    #title-screen {
      background: rgba(10, 5, 20, 0.85);
      z-index: 10;
    }

    .title-text {
      font-size: 2.8rem;
      color: #ff7700;
      text-shadow: 0 0 12px #ff5500, 0 0 24px #b800ff;
      margin-bottom: 12px;
    }

    .instructions {
      font-size: 0.95rem;
      color: #e5ccff;
      line-height: 1.6;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.06);
      padding: 12px 20px;
      border-radius: 6px;
      border: 1px solid rgba(255, 153, 0, 0.2);
    }

    /* ゲームオーバー画面 */
    #gameover-screen {
      background: rgba(25, 6, 16, 0.88);
      z-index: 10;
      display: none;
    }

    .gameover-text {
      font-size: 3rem;
      color: #ff3344;
      text-shadow: 0 0 16px #ff0055, 0 0 30px #8800ff;
      margin-bottom: 10px;
    }

    .result-text {
      font-size: 1.3rem;
      color: #ffd699;
      margin-bottom: 20px;
    }

    /* スマホ操作用 FIREボタン */
    #fire-button {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: rgba(255, 85, 0, 0.35);
      border: 3px solid #ff7700;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      box-shadow: 0 0 16px rgba(255, 119, 0, 0.6);
      z-index: 5;
    }

    #fire-button:active {
      background: rgba(255, 119, 0, 0.85);
      transform: scale(0.95);
    }

    /* 縦画面警告オーバーレイ */
    #rotate-warning {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0d0718;
      z-index: 999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ff9900;
      text-align: center;
      padding: 20px;
    }

    #rotate-warning .icon {
      font-size: 3rem;
      margin-bottom: 16px;
      animation: rotate-anim 1.5s infinite alternate ease-in-out;
    }

    @keyframes rotate-anim {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-90deg); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- FIREボタン（スマホ用） -->
    <div id="fire-button">FIRE</div>

    <!-- タイトル画面 -->
    <div id="title-screen" class="ui-layer">
      <h1 class="title-text" id="display-title">HALLOWEEN SHOOTER</h1>
      <div class="instructions">
        【操作方法】<br>
        上下ドラッグ / マウス移動: カボチャを上下移動<br>
        画面タップ / FIREボタン / SPACEキー: 鬼火ショット発射<br>
        🍬 敵を倒して出るキャンディーを取ると、扇状に火の玉が増加！
      </div>
      <div>
        <button id="btn-play" class="btn">GAME START</button>
        <button id="btn-fullscreen" class="btn">FULL SCREEN</button>
      </div>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-screen" class="ui-layer">
      <h1 class="gameover-text">TRICK OR TREAT!</h1>
      <div class="result-text" id="result-stats">TIME: 0s | HIT: 0 | LEVEL: 1</div>
      <button id="btn-retry" class="btn">RETRY</button>
    </div>

    <!-- 縦画面注意表示 -->
    <div id="rotate-warning">
      <div class="icon">📱</div>
      <h2>画面を横向きにしてください</h2>
      <p style="margin-top: 8px; color: #b39ddb;">端末を回転させるとゲームを再開します</p>
    </div>
  </div>

  <script>
    // ==========================================
    // 設定パラメータ（授業で自由に変更できるエリア）
    // ==========================================
    const CONFIG = {
      title: "PUMPKIN CANDY FRENZY", // ゲームタイトル
      bgColor: "#110722",             // 夜空のベース色
      playerColor: "#ff7700",         // カボチャのオレンジ
      stemColor: "#2e7d32",           // ヘタの緑
      fireInnerColor: "#ffff88",      // 火の玉の中心
      fireOuterColor: "#ff3700",      // 火の玉の外炎
      enemySpeed: 210,                // 敵の前進速度（px/秒）
      enemySpawnInterval: 0.95,       // 敵の出現間隔（秒）
      bulletSpeed: 600,               // 火の玉の速さ（px/秒）
      playerFollowSpeed: 10.0,        // 自機の上下追従速度
      waveAmplitude: 38,              // 敵のゆらゆら上下幅（px）
      waveFrequency: 3.5,             // 敵の揺れる周期
      itemDropRate: 0.6,              // キャンディー出現確率（0.0〜1.0）
      maxPowerLevel: 5                // パワーアップ最大レベル
    };

    const VIRTUAL_WIDTH = 960;
    const VIRTUAL_HEIGHT = 540;

    const STATE_TITLE = 0;
    const STATE_PLAYING = 1;
    const STATE_GAMEOVER = 2;
    let gameState = STATE_TITLE;

    const container = document.getElementById("game-container");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const titleScreen = document.getElementById("title-screen");
    const gameoverScreen = document.getElementById("gameover-screen");
    const rotateWarning = document.getElementById("rotate-warning");
    const fireBtn = document.getElementById("fire-button");
    const btnPlay = document.getElementById("btn-play");
    const btnRetry = document.getElementById("btn-retry");
    const btnFullscreen = document.getElementById("btn-fullscreen");
    const displayTitle = document.getElementById("display-title");
    const resultStats = document.getElementById("result-stats");

    displayTitle.textContent = CONFIG.title;

    // 自機データ
    let player = {
      x: 110,
      y: VIRTUAL_HEIGHT / 2,
      targetY: VIRTUAL_HEIGHT / 2,
      radius: 20,
      powerLevel: 1 // パワーレベル（初期は基本の1発、最大5）
    };

    let bullets = [];
    let enemies = [];
    let items = []; // ドロップしたキャンディー
    let bgParticles = [];
    let scoreHits = 0;
    let elapsedTime = 0;
    let spawnTimer = 0;
    let lastTime = performance.now();
    let isPausedByOrientation = false;

    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;

    // 背景に漂うハロウィン粒子
    for (let i = 0; i < 40; i++) {
      bgParticles.push({
        x: Math.random() * VIRTUAL_WIDTH,
        y: Math.random() * VIRTUAL_HEIGHT,
        speed: 25 + Math.random() * 60,
        size: 1.5 + Math.random() * 2.5,
        color: Math.random() > 0.4 ? "rgba(180, 100, 255, 0.6)" : "rgba(255, 170, 0, 0.5)"
      });
    }

    // ------------------------------------------
    // 画面リサイズ & 座標変換
    // ------------------------------------------
    function resizeCanvas() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      const isPortrait = windowHeight > windowWidth;
      if (isPortrait) {
        rotateWarning.style.display = "flex";
        isPausedByOrientation = true;
      } else {
        rotateWarning.style.display = "none";
        isPausedByOrientation = false;
      }

      const scaleX = windowWidth / VIRTUAL_WIDTH;
      const scaleY = windowHeight / VIRTUAL_HEIGHT;
      scale = Math.min(scaleX, scaleY);

      const renderWidth = VIRTUAL_WIDTH * scale;
      const renderHeight = VIRTUAL_HEIGHT * scale;

      canvas.style.width = `${renderWidth}px`;
      canvas.style.height = `${renderHeight}px`;

      offsetX = (windowWidth - renderWidth) / 2;
      offsetY = (windowHeight - renderHeight) / 2;
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);
    resizeCanvas();

    function screenToGameCoords(clientX, clientY) {
      return {
        x: (clientX - offsetX) / scale,
        y: (clientY - offsetY) / scale
      };
    }

    // ------------------------------------------
    // ゲーム初期化 & 終了
    // ------------------------------------------
    function initGame() {
      player.y = VIRTUAL_HEIGHT / 2;
      player.targetY = VIRTUAL_HEIGHT / 2;
      player.powerLevel = 1;
      bullets = [];
      enemies = [];
      items = [];
      scoreHits = 0;
      elapsedTime = 0;
      spawnTimer = 0;
      gameState = STATE_PLAYING;

      titleScreen.style.display = "none";
      gameoverScreen.style.display = "none";
      lastTime = performance.now();
    }

    function gameOver() {
      gameState = STATE_GAMEOVER;
      resultStats.textContent = `TIME: ${Math.floor(elapsedTime)}s  |  HIT: ${scoreHits}  |  LEVEL: ${player.powerLevel}`;
      gameoverScreen.style.display = "flex";
    }

    // 扇状ショット発射
    function fireBullet() {
      if (gameState !== STATE_PLAYING) return;

      // 基本の正面弾（速度vx, vyで管理）
      bullets.push({
        x: player.x + 24,
        y: player.y,
        vx: CONFIG.bulletSpeed,
        vy: 0,
        radius: 9
      });

      // レベルに応じて上下に広がる角度（ラジアン）の弾を追加
      // レベル2: ±10度, レベル3: ±10度, ±20度, ...
      const spreadStep = 10 * (Math.PI / 180);
      const extraPairs = player.powerLevel - 1;

      for (let p = 1; p <= extraPairs; p++) {
        const angle = p * spreadStep;
        // 上方向の弾
        bullets.push({
          x: player.x + 24,
          y: player.y,
          vx: Math.cos(-angle) * CONFIG.bulletSpeed,
          vy: Math.sin(-angle) * CONFIG.bulletSpeed,
          radius: 8
        });
        // 下方向の弾
        bullets.push({
          x: player.x + 24,
          y: player.y,
          vx: Math.cos(angle) * CONFIG.bulletSpeed,
          vy: Math.sin(angle) * CONFIG.bulletSpeed,
          radius: 8
        });
      }
    }

    // ------------------------------------------
    // 入力イベント
    // ------------------------------------------
    function handlePointerMove(e) {
      if (gameState !== STATE_PLAYING) return;
      if (e.target === fireBtn) return;

      const coords = screenToGameCoords(e.clientX, e.clientY);
      player.targetY = Math.max(30, Math.min(VIRTUAL_HEIGHT - 30, coords.y));
    }

    window.addEventListener("pointerdown", (e) => {
      if (e.target === fireBtn || e.target.classList.contains("btn")) return;
      if (gameState === STATE_PLAYING) {
        handlePointerMove(e);
        fireBullet();
      }
    });

    window.addEventListener("pointermove", (e) => {
      if (e.buttons > 0 || e.pointerType === "touch") {
        handlePointerMove(e);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        fireBullet();
      }
    });

    fireBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      e.preventDefault();
      fireBullet();
    });

    btnPlay.addEventListener("click", initGame);
    btnRetry.addEventListener("click", initGame);

    btnFullscreen.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // ------------------------------------------
    // メイン更新処理
    // ------------------------------------------
    function update(dt) {
      if (isPausedByOrientation || gameState !== STATE_PLAYING) return;

      elapsedTime += dt;

      // 自機の追従
      player.y += (player.targetY - player.y) * Math.min(1.0, CONFIG.playerFollowSpeed * dt);

      // 背景粒子の移動
      for (let p of bgParticles) {
        p.x -= p.speed * dt;
        if (p.x < -10) {
          p.x = VIRTUAL_WIDTH + 10;
          p.y = Math.random() * VIRTUAL_HEIGHT;
        }
      }

      // 弾の移動
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        // 画面外判定
        if (b.x > VIRTUAL_WIDTH + 40 || b.y < -30 || b.y > VIRTUAL_HEIGHT + 30) {
          bullets.splice(i, 1);
        }
      }

      // キャンディーアイテムの移動＆自機取得判定
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.x -= it.speed * dt;
        it.y += Math.sin(elapsedTime * 4 + it.id) * 0.8; // ゆっくり漂う

        // 自機との接触（アイテム取得）
        const distToPlayer = Math.hypot(it.x - player.x, it.y - player.y);
        if (distToPlayer < (player.radius + it.radius)) {
          if (player.powerLevel < CONFIG.maxPowerLevel) {
            player.powerLevel++;
          }
          items.splice(i, 1);
          continue;
        }

        // 左端へ消去
        if (it.x < -30) {
          items.splice(i, 1);
        }
      }

      // 敵の生成
      spawnTimer += dt;
      if (spawnTimer >= CONFIG.enemySpawnInterval) {
        spawnTimer = 0;
        const enemyType = Math.random() < 0.5 ? "ghost" : "reaper";
        const baseY = 60 + Math.random() * (VIRTUAL_HEIGHT - 120);

        enemies.push({
          type: enemyType,
          x: VIRTUAL_WIDTH + 40,
          baseY: baseY,
          y: baseY,
          radius: 20,
          phaseOffset: Math.random() * Math.PI * 2
        });
      }

      // 敵の移動・当たり判定
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x -= CONFIG.enemySpeed * dt;

        // ゆらゆら揺れ
        const wave = Math.sin(elapsedTime * CONFIG.waveFrequency + e.phaseOffset) * CONFIG.waveAmplitude;
        e.y = Math.max(30, Math.min(VIRTUAL_HEIGHT - 30, e.baseY + wave));

        // 画面外退場
        if (e.x < -50) {
          enemies.splice(i, 1);
          continue;
        }

        // 自機との接触判定
        const distPlayer = Math.hypot(e.x - player.x, e.y - player.y);
        if (distPlayer < (player.radius + e.radius)) {
          gameOver();
          return;
        }

        // 弾との接触判定
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const distBullet = Math.hypot(e.x - b.x, e.y - b.y);
          if (distBullet < (e.radius + b.radius)) {
            // 撃破時に確率でキャンディーをドロップ
            if (Math.random() < CONFIG.itemDropRate) {
              items.push({
                id: Math.random(),
                x: e.x,
                y: e.y,
                speed: 120, // プレイヤー側にゆっくり流れてくる
                radius: 14,
                colorType: Math.random() < 0.5 ? "pink" : "orange"
              });
            }

            enemies.splice(i, 1);
            bullets.splice(j, 1);
            scoreHits++;
            break;
          }
        }
      }
    }

    // ------------------------------------------
    // 描画処理（Canvas 図形レンダリング）
    // ------------------------------------------

    // カボチャ（自機）の描画
    function drawPumpkin(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(elapsedTime * 6) * 0.08);

      // パワーアップ状態のオーラ
      if (player.powerLevel > 1) {
        ctx.fillStyle = `rgba(255, 180, 0, ${0.15 + player.powerLevel * 0.06})`;
        ctx.beginPath();
        ctx.arc(0, 0, 26 + player.powerLevel * 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // ヘタ（緑）
      ctx.fillStyle = CONFIG.stemColor;
      ctx.beginPath();
      ctx.rect(-3, -24, 6, 8);
      ctx.fill();

      // オレンジの果実
      ctx.fillStyle = CONFIG.playerColor;
      ctx.shadowColor = "#ff7700";
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.ellipse(-8, 0, 12, 18, 0, 0, Math.PI * 2);
      ctx.ellipse(8, 0, 12, 18, 0, 0, Math.PI * 2);
      ctx.ellipse(0, 0, 15, 19, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // ジャック・オー・ランタンの顔
      ctx.fillStyle = "#1e0802";
      ctx.beginPath();
      ctx.moveTo(-9, -7); ctx.lineTo(-4, -1); ctx.lineTo(-11, -1);
      ctx.moveTo(3, -1); ctx.lineTo(10, -1); ctx.lineTo(5, -7);
      ctx.fill();

      // 口
      ctx.beginPath();
      ctx.moveTo(-11, 6);
      ctx.lineTo(-6, 11);
      ctx.lineTo(-2, 7);
      ctx.lineTo(2, 11);
      ctx.lineTo(6, 7);
      ctx.lineTo(11, 10);
      ctx.lineTo(8, 14);
      ctx.lineTo(-8, 14);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // 火の玉の描画
    function drawFireball(b) {
      ctx.save();
      ctx.translate(b.x, b.y);

      // 飛ぶ向きに回転
      const angle = Math.atan2(b.vy, b.vx);
      ctx.rotate(angle);

      // 外炎
      ctx.fillStyle = CONFIG.fireOuterColor;
      ctx.beginPath();
      ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
      ctx.moveTo(-b.radius, 0);
      ctx.lineTo(-b.radius - 12 - Math.random() * 6, -2);
      ctx.lineTo(-b.radius, 5);
      ctx.closePath();
      ctx.fill();

      // 内側の芯
      ctx.fillStyle = CONFIG.fireInnerColor;
      ctx.beginPath();
      ctx.arc(1, 0, b.radius * 0.55, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // キャンディーアイテムの描画
    function drawCandy(x, y, colorType) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(elapsedTime * 5) * 0.25);

      const mainColor = colorType === "pink" ? "#ff4081" : "#ff9100";
      const stripeColor = "#ffffff";

      // 包み紙の両端（リボン状）
      ctx.fillStyle = mainColor;
      ctx.beginPath();
      // 左リボン
      ctx.moveTo(-8, 0); ctx.lineTo(-18, -9); ctx.lineTo(-18, 9); ctx.closePath();
      // 右リボン
      ctx.moveTo(8, 0); ctx.lineTo(18, -9); ctx.lineTo(18, 9); ctx.closePath();
      ctx.fill();

      // 中央のキャンディー玉（光る）
      ctx.shadowColor = mainColor;
      ctx.shadowBlur = 10;
      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 縞模様
      ctx.fillStyle = stripeColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, 4, 9, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // お化けアイコン
    function drawGhost(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(elapsedTime * 4) * 0.12);

      ctx.fillStyle = "#f5f5ff";
      ctx.shadowColor = "#99bbff";
      ctx.shadowBlur = 10;

      ctx.beginPath();
      ctx.arc(0, -5, 16, Math.PI, 0, false);
      ctx.lineTo(16, 14);
      ctx.lineTo(9, 9);
      ctx.lineTo(0, 15);
      ctx.lineTo(-9, 9);
      ctx.lineTo(-16, 14);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#1e1035";
      ctx.beginPath();
      ctx.arc(-6, -6, 2.5, 0, Math.PI * 2);
      ctx.arc(5, -6, 2.5, 0, Math.PI * 2);
      ctx.arc(0, 2, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 死神アイコン
    function drawReaper(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.cos(elapsedTime * 3.5) * 0.1);

      // 大鎌
      ctx.strokeStyle = "#8d6e63";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(12, 18);
      ctx.lineTo(6, -24);
      ctx.stroke();

      ctx.fillStyle = "#e0e0e0";
      ctx.beginPath();
      ctx.moveTo(6, -24);
      ctx.quadraticCurveTo(-14, -30, -18, -12);
      ctx.quadraticCurveTo(-10, -20, 6, -18);
      ctx.closePath();
      ctx.fill();

      // ローブ
      ctx.fillStyle = "#261c38";
      ctx.shadowColor = "#ff0055";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, -6, 15, Math.PI, 0, false);
      ctx.lineTo(12, 16);
      ctx.lineTo(-12, 16);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      // 顔の闇と赤目
      ctx.fillStyle = "#0c0614";
      ctx.beginPath();
      ctx.arc(0, -4, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff1744";
      ctx.beginPath();
      ctx.arc(-3, -4, 1.8, 0, Math.PI * 2);
      ctx.arc(3, -4, 1.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 全体描画
    function draw() {
      // 背景クリア
      ctx.fillStyle = CONFIG.bgColor;
      ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

      // 月
      ctx.save();
      ctx.fillStyle = "rgba(255, 235, 150, 0.25)";
      ctx.beginPath();
      ctx.arc(820, 90, 60, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 背景の粒子
      for (let p of bgParticles) {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // キャンディーアイテム
      for (let it of items) {
        drawCandy(it.x, it.y, it.colorType);
      }

      // 弾（火の玉）
      for (let b of bullets) {
        drawFireball(b);
      }

      // 敵
      for (let e of enemies) {
        if (e.type === "ghost") {
          drawGhost(e.x, e.y);
        } else {
          drawReaper(e.x, e.y);
        }
      }

      // 自機
      if (gameState === STATE_PLAYING || gameState === STATE_GAMEOVER) {
        drawPumpkin(player.x, player.y);
      }

      // UI
      if (gameState === STATE_PLAYING) {
        ctx.fillStyle = "#ffb84d";
        ctx.font = "bold 20px 'Segoe UI', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`🎃 TIME: ${Math.floor(elapsedTime)}s`, 25, 38);
        ctx.fillText(`👻 HIT: ${scoreHits}`, 170, 38);

        // ショットパワー表示
        ctx.fillStyle = "#ff4081";
        ctx.fillText(`🍬 SHOT LV: ${player.powerLevel} ${player.powerLevel >= CONFIG.maxPowerLevel ? '(MAX)' : ''}`, 300, 38);
      }
    }

    // ------------------------------------------
    // アニメーションループ
    // ------------------------------------------
    function loop(currentTime) {
      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame((time) => {
      lastTime = time;
      loop(time);
    });
  </script>
</body>
</html>
