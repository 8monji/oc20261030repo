<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オーシャン・シューティング</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030814;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            box-shadow: 0 0 35px rgba(0, 212, 255, 0.4);
            overflow: hidden;
            background-color: #03045e;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(3, 10, 35, 0.85);
            backdrop-filter: blur(6px);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 42px;
            color: #80e5ff;
            text-shadow: 0 0 10px #00bfff, 0 0 20px #00bfff, 0 0 40px #0077b6;
            margin-bottom: 15px;
            letter-spacing: 3px;
            text-align: center;
        }

        p.instructions {
            font-size: 15px;
            color: #d0f4de;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.8;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(128, 229, 255, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #00bfff, #0077b6);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.6);
            transition: all 0.15s ease;
            outline: none;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(0, 191, 255, 0.9);
        }

        .btn-sub {
            background: linear-gradient(135deg, #2c5364, #203a43);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.6);
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            color: #80e5ff;
            text-shadow: 0 0 8px #00bfff;
            pointer-events: none;
            z-index: 5;
        }

        #fire-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #e6e6fa 60%, #b0c4de 100%);
            border: 3px solid #80e5ff;
            color: #004466;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 10px rgba(0, 191, 255, 0.5);
            z-index: 8;
            cursor: pointer;
        }

        #fire-btn:active {
            transform: scale(0.92);
            background: radial-gradient(circle, #ffffff 0%, #d8bfd8 100%);
        }

        #portrait-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #030814;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .phone-icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container">
            <canvas id="gameCanvas" width="960" height="540"></canvas>

            <!-- HUD (画面表示) -->
            <div id="hud" class="hidden">
                <div>TIME: <span id="time-val">0.0</span>s</div>
                <div>HIT: <span id="hit-val">0</span></div>
            </div>

            <!-- FIREボタン (真珠発射) -->
            <div id="fire-btn" class="hidden">PEARL</div>

            <!-- タイトル画面 -->
            <div id="title-screen" class="overlay">
                <h1 id="title-text">OCEAN SHOOTING</h1>
                <p class="instructions">
                    【操作方法】<br>
                    上下ドラッグ：イルカの移動<br>
                    画面タップ または PEARLボタン：真珠を発射 (PC: Spaceキー)
                </p>
                <div class="btn-group">
                    <button class="btn" id="start-btn">PLAY</button>
                    <button class="btn btn-sub" id="fullscreen-btn">FULL SCREEN</button>
                </div>
            </div>

            <!-- ゲームオーバー画面 -->
            <div id="gameover-screen" class="overlay hidden">
                <h1 style="color: #ff4757; text-shadow: 0 0 10px #ff4757, 0 0 20px #ff4757;">GAME OVER</h1>
                <p class="instructions" style="font-size: 18px; line-height: 2;">
                    TIME: <span id="final-time" style="color: #80e5ff;">0.0</span> 秒<br>
                    HIT: <span id="final-hit" style="color: #80e5ff;">0</span> 匹退治
                </p>
                <button class="btn btn-danger" id="retry-btn">RETRY</button>
            </div>
        </div>
    </div>

    <!-- 縦画面注意表示 -->
    <div id="portrait-warning" class="hidden">
        <div class="phone-icon">📱</div>
        <h2 style="color: #80e5ff; margin-bottom: 10px;">スマホを横にしてね</h2>
        <p style="color: #aaaaaa;">このゲームは横画面専用です</p>
    </div>

    <script>
        // ==========================================
        // 【CONFIG】設定変更コーナー
        // ==========================================
        const CONFIG = {
            TITLE: "OCEAN SHOOTING", // ゲームタイトル
            ENEMY_SPEED: 220,         // 敵の移動速度 (px/秒)
            ENEMY_INTERVAL: 0.9,      // 敵が出現する間隔 (秒)
            BULLET_SPEED: 720,        // 真珠の移動速度 (px/秒)
            PLAYER_SMOOTH: 0.2,       // イルカの移動追従速度 (0.01~1.0)
            BUBBLE_COUNT: 65          // 背景の泡の数
        };

        // ==========================================
        // システム定数・変数定義
        // ==========================================
        const V_WIDTH = 960;
        const V_HEIGHT = 540;

        let canvas, ctx;
        let gameState = 'TITLE'; // 'TITLE', 'PLAYING', 'GAMEOVER'
        let gameTime = 0;
        let hitCount = 0;
        let lastTimestamp = 0;
        let enemyTimer = 0;
        let isPaused = false;

        // プレイヤー (水色のイルカ)
        let player = {
            x: 100,
            y: V_HEIGHT / 2,
            targetY: V_HEIGHT / 2,
            radius: 22
        };

        let bullets = [];   // 真珠
        let enemies = [];   // クラゲ・シャチ・サメ
        let bubbles = [];   // 背景の泡
        let particles = []; // 水滴パーティクル

        // UI要素参照
        let titleText, timeVal, hitVal, finalTime, finalHit;
        let titleScreen, gameoverScreen, hud, fireBtn, portraitWarning;

        // 初期化処理
        window.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            titleText = document.getElementById('title-text');
            timeVal = document.getElementById('time-val');
            hitVal = document.getElementById('hit-val');
            finalTime = document.getElementById('final-time');
            finalHit = document.getElementById('final-hit');

            titleScreen = document.getElementById('title-screen');
            gameoverScreen = document.getElementById('gameover-screen');
            hud = document.getElementById('hud');
            fireBtn = document.getElementById('fire-btn');
            portraitWarning = document.getElementById('portrait-warning');

            titleText.textContent = CONFIG.TITLE;

            initBubbles();
            setupEventListeners();

            resizeGame();
            window.addEventListener('resize', resizeGame);
            window.addEventListener('orientationchange', resizeGame);

            requestAnimationFrame(gameLoop);
        });

        function initBubbles() {
            bubbles = [];
            for (let i = 0; i < CONFIG.BUBBLE_COUNT; i++) {
                bubbles.push({
                    x: Math.random() * V_WIDTH,
                    y: Math.random() * V_HEIGHT,
                    size: Math.random() * 3 + 2,
                    speedX: Math.random() * 40 + 20,
                    speedY: Math.random() * 30 + 10,
                    wobble: Math.random() * Math.PI * 2
                });
            }
        }

        function setupEventListeners() {
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('retry-btn').addEventListener('click', resetGame);
            document.getElementById('fullscreen-btn').addEventListener('click', toggleFullScreen);

            fireBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (gameState === 'PLAYING') shootBullet();
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    if (gameState === 'PLAYING') shootBullet();
                    e.preventDefault();
                }
            });

            const container = document.getElementById('game-container');
            let isPointerDown = false;

            container.addEventListener('pointerdown', (e) => {
                if (gameState !== 'PLAYING') return;
                isPointerDown = true;
                const pos = getGameCoordinates(e.clientX, e.clientY);
                player.targetY = pos.y;

                if (e.target !== fireBtn) {
                    shootBullet();
                }
            });

            container.addEventListener('pointermove', (e) => {
                if (gameState !== 'PLAYING') return;
                if (isPointerDown || e.pointerType === 'mouse') {
                    const pos = getGameCoordinates(e.clientX, e.clientY);
                    player.targetY = pos.y;
                }
            });

            const endPointer = () => { isPointerDown = false; };
            container.addEventListener('pointerup', endPointer);
            container.addEventListener('pointercancel', endPointer);
        }

        function getGameCoordinates(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = V_WIDTH / rect.width;
            const scaleY = V_HEIGHT / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function resizeGame() {
            const container = document.getElementById('game-container');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            if (windowWidth < windowHeight) {
                portraitWarning.classList.remove('hidden');
                isPaused = true;
            } else {
                portraitWarning.classList.add('hidden');
                isPaused = false;
            }

            let targetWidth = windowWidth;
            let targetHeight = windowWidth * (9 / 16);

            if (targetHeight > windowHeight) {
                targetHeight = windowHeight;
                targetWidth = windowHeight * (16 / 9);
            }

            container.style.width = `${targetWidth}px`;
            container.style.height = `${targetHeight}px`;
        }

        function toggleFullScreen() {
            const container = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function startGame() {
            gameState = 'PLAYING';
            titleScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            fireBtn.classList.remove('hidden');
            resetGameData();
        }

        function resetGame() {
            gameState = 'PLAYING';
            gameoverScreen.classList.add('hidden');
            resetGameData();
        }

        function resetGameData() {
            gameTime = 0;
            hitCount = 0;
            enemyTimer = 0;
            bullets = [];
            enemies = [];
            particles = [];
            player.y = V_HEIGHT / 2;
            player.targetY = V_HEIGHT / 2;
            timeVal.textContent = "0.0";
            hitVal.textContent = "0";
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            hud.classList.add('hidden');
            fireBtn.classList.add('hidden');
            finalTime.textContent = gameTime.toFixed(1);
            finalHit.textContent = hitCount;
            gameoverScreen.classList.remove('hidden');
        }

        function shootBullet() {
            bullets.push({
                x: player.x + 25,
                y: player.y,
                radius: 7,
                speed: CONFIG.BULLET_SPEED
            });
        }

        function spawnEnemy() {
            const types = ['jellyfish', 'orca', 'shark'];
            const type = types[Math.floor(Math.random() * types.length)];
            let radius = 24;
            if (type === 'jellyfish') radius = 20;
            if (type === 'orca') radius = 28;
            if (type === 'shark') radius = 25;

            enemies.push({
                type: type,
                x: V_WIDTH + radius + 10,
                y: Math.random() * (V_HEIGHT - radius * 2 - 80) + radius + 20,
                radius: radius,
                speed: CONFIG.ENEMY_SPEED * (0.8 + Math.random() * 0.4)
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 14; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 160 + 30;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    life: 0.4,
                    maxLife: 0.4,
                    color: color
                });
            }
        }

        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
            lastTimestamp = timestamp;

            if (!isPaused) {
                update(dt);
                draw();
            }

            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            bubbles.forEach(b => {
                b.wobble += dt * 3;
                b.x -= b.speedX * dt;
                b.y -= Math.sin(b.wobble) * 15 * dt + b.speedY * dt;

                if (b.x < -10 || b.y < -10) {
                    b.x = V_WIDTH + 10;
                    b.y = Math.random() * V_HEIGHT + 10;
                }
            });

            if (gameState !== 'PLAYING') return;

            gameTime += dt;
            timeVal.textContent = gameTime.toFixed(1);

            player.targetY = Math.max(player.radius + 10, Math.min(V_HEIGHT - player.radius - 40, player.targetY));
            player.y += (player.targetY - player.y) * CONFIG.PLAYER_SMOOTH;

            enemyTimer += dt;
            if (enemyTimer >= CONFIG.ENEMY_INTERVAL) {
                spawnEnemy();
                enemyTimer = 0;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].speed * dt;
                if (bullets[i].x > V_WIDTH + 20) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.x -= enemy.speed * dt;

                const distToPlayer = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (distToPlayer < enemy.radius + player.radius - 5) {
                    createParticles(player.x, player.y, "#80e5ff");
                    createParticles(enemy.x, enemy.y, "#ffffff");
                    gameOver();
                    return;
                }

                if (enemy.x < -enemy.radius - 20) {
                    enemies.splice(i, 1);
                    continue;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bullet = bullets[j];
                    const distToBullet = Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y);

                    if (distToBullet < enemy.radius + bullet.radius) {
                        let color = "#ff69b4";
                        if (enemy.type === 'orca') color = "#1a1a24";
                        if (enemy.type === 'shark') color = "#788e9c";

                        createParticles(enemy.x, enemy.y, color);
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        hitCount++;
                        hitVal.textContent = hitCount;
                        break;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // ==========================================
        // 描画処理 (Canvas)
        // ==========================================
        function draw() {
            // 背景（水色から暗い青色へシームレスにつながるなめらかなグラデーション）
            const bgGrad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
            bgGrad.addColorStop(0.0, "#00d2ff"); // 最上部（明るい水色）
            bgGrad.addColorStop(0.35, "#0088fe"); // 水色から青へのなめらかな変化
            bgGrad.addColorStop(0.7, "#003388");  // 深みのある青
            bgGrad.addColorStop(1.0, "#001133");  // 最下部（暗い青色）
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

            // サンゴと海底の描画
            drawCorals();

            // 背景の泡描画
            bubbles.forEach(b => {
                ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
                ctx.beginPath();
                ctx.arc(b.x - b.size * 0.3, b.y - b.size * 0.3, b.size * 0.25, 0, Math.PI * 2);
                ctx.fill();
            });

            if (gameState === 'TITLE') return;

            // 弾（真珠 Pearl）の描画
            bullets.forEach(b => drawPearl(b.x, b.y, b.radius));

            // 敵キャラの描画 (クラゲ・シャチ・サメ)
            enemies.forEach(e => {
                if (e.type === 'jellyfish') drawJellyfish(e.x, e.y, e.radius);
                else if (e.type === 'orca') drawOrca(e.x, e.y, e.radius);
                else if (e.type === 'shark') drawShark(e.x, e.y, e.radius);
            });

            // プレイヤー（水色のイルカ）の描画
            if (gameState === 'PLAYING') {
                drawDolphin(player.x, player.y, player.radius);
            }

            // パーティクルの描画
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        // ------------------------------------------
        // サンゴ＆海底の描画関数
        // ------------------------------------------
        function drawCorals() {
            // 海底の岩場シルエット
            ctx.fillStyle = "#001a35";
            ctx.beginPath();
            ctx.moveTo(0, V_HEIGHT);
            ctx.quadraticCurveTo(150, V_HEIGHT - 25, 300, V_HEIGHT - 10);
            ctx.quadraticCurveTo(500, V_HEIGHT - 35, 700, V_HEIGHT - 15);
            ctx.quadraticCurveTo(850, V_HEIGHT - 25, V_WIDTH, V_HEIGHT);
            ctx.fill();

            // カラフルなサンゴ群
            drawCoralBranch(80, V_HEIGHT - 10, "#ff5252", 0.95);  // 赤系サンゴ
            drawCoralBranch(220, V_HEIGHT - 15, "#ff9f43", 1.15); // オレンジ系サンゴ
            drawCoralBranch(380, V_HEIGHT - 8, "#a55eea", 0.85);  // 紫系サンゴ
            drawCoralBranch(560, V_HEIGHT - 20, "#ff78ae", 1.2);  // ピンク系サンゴ
            drawCoralBranch(720, V_HEIGHT - 12, "#48dbfb", 0.9);  // 水色系サンゴ
            drawCoralBranch(880, V_HEIGHT - 5, "#ff6b6b", 1.0);   // コーラルレッドサンゴ
        }

        // サンゴの枝描画（一本一本枝分かれするデザイン）
        function drawCoralBranch(x, y, color, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineCap = "round";

            // メイン幹
            ctx.lineWidth = 9;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-5, -25, -10, -50);
            ctx.stroke();

            // 枝分岐
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(-7, -25);
            ctx.quadraticCurveTo(-22, -40, -28, -58);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-10, -50);
            ctx.quadraticCurveTo(8, -62, 14, -76);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-10, -50);
            ctx.quadraticCurveTo(-20, -68, -24, -82);
            ctx.stroke();

            // サンゴの先端の丸み
            const tips = [[-28, -58], [14, -76], [-24, -82], [-10, -50]];
            tips.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt[0], pt[1], 4.5, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        // ------------------------------------------
        // キャラクター描画関数
        // ------------------------------------------

        // 1. 水色のイルカ (Dolphin)
        function drawDolphin(x, y, r) {
            ctx.save();
            ctx.translate(x, y);

            const bodyGrad = ctx.createLinearGradient(0, -r, 0, r);
            bodyGrad.addColorStop(0, "#99ffff");
            bodyGrad.addColorStop(0.5, "#00c8ff");
            bodyGrad.addColorStop(1, "#e0ffff");

            // 尾びれ
            ctx.fillStyle = "#00bfff";
            ctx.beginPath();
            ctx.moveTo(-r * 0.8, 0);
            ctx.quadraticCurveTo(-r * 1.5, -r * 0.8, -r * 1.6, -r * 0.7);
            ctx.quadraticCurveTo(-r * 1.1, 0, -r * 1.6, r * 0.7);
            ctx.quadraticCurveTo(-r * 1.5, r * 0.8, -r * 0.8, 0);
            ctx.fill();

            // 胴体 ＆ くちばし
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(-r * 0.9, 0);
            ctx.bezierCurveTo(-r * 0.5, -r * 0.9, r * 0.4, -r * 0.8, r * 0.9, -r * 0.2);
            ctx.bezierCurveTo(r * 1.25, -r * 0.1, r * 1.25, r * 0.25, r * 0.85, r * 0.3);
            ctx.bezierCurveTo(r * 0.3, r * 0.8, -r * 0.5, r * 0.7, -r * 0.9, 0);
            ctx.fill();

            // 背びれ
            ctx.beginPath();
            ctx.moveTo(-r * 0.1, -r * 0.65);
            ctx.quadraticCurveTo(-r * 0.3, -r * 1.2, -r * 0.6, -r * 1.1);
            ctx.quadraticCurveTo(-r * 0.4, -r * 0.6, -r * 0.4, -r * 0.5);
            ctx.fill();

            // 胸びれ
            ctx.beginPath();
            ctx.moveTo(r * 0.1, r * 0.2);
            ctx.quadraticCurveTo(-r * 0.2, r * 0.8, -r * 0.5, r * 0.7);
            ctx.quadraticCurveTo(-r * 0.1, r * 0.3, r * 0.1, r * 0.2);
            ctx.fill();

            // 目
            ctx.fillStyle = "#002b49";
            ctx.beginPath();
            ctx.arc(r * 0.5, -r * 0.15, r * 0.14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(r * 0.53, -r * 0.18, r * 0.06, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // 2. 真珠 (Pearl)
        function drawPearl(x, y, r) {
            ctx.save();
            const pearlGrad = ctx.createRadialGradient(
                x - r * 0.3, y - r * 0.3, r * 0.1,
                x, y, r
            );
            pearlGrad.addColorStop(0, "#ffffff");
            pearlGrad.addColorStop(0.4, "#fff0f5");
            pearlGrad.addColorStop(0.8, "#e6e6fa");
            pearlGrad.addColorStop(1, "#b0c4de");

            ctx.fillStyle = pearlGrad;
            ctx.shadowColor = "rgba(255, 255, 255, 0.9)";
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // 3. クラゲ (Jellyfish)
        function drawJellyfish(x, y, r) {
            ctx.save();
            ctx.translate(x, y);

            const jGrad = ctx.createRadialGradient(0, -r * 0.2, r * 0.1, 0, 0, r);
            jGrad.addColorStop(0, "rgba(255, 182, 193, 0.95)");
            jGrad.addColorStop(0.7, "rgba(255, 105, 180, 0.85)");
            jGrad.addColorStop(1, "rgba(218, 112, 214, 0.65)");
            ctx.fillStyle = jGrad;

            ctx.beginPath();
            ctx.arc(0, 0, r, Math.PI, 0, false);
            ctx.quadraticCurveTo(0, r * 0.3, -r, 0);
            ctx.fill();

            ctx.strokeStyle = "rgba(255, 182, 193, 0.85)";
            ctx.lineWidth = 2.2;
            const timeOffset = Date.now() * 0.006;
            for (let i = -2; i <= 2; i++) {
                const offsetX = i * (r * 0.38);
                const wave = Math.sin(timeOffset + i) * 5;
                ctx.beginPath();
                ctx.moveTo(offsetX, 0);
                ctx.quadraticCurveTo(offsetX + wave, r * 0.7, offsetX - wave, r * 1.3);
                ctx.stroke();
            }

            ctx.restore();
        }

        // 4. シャチ (Orca)
        function drawOrca(x, y, r) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(-1, 1);

            ctx.fillStyle = "#161622";
            ctx.beginPath();
            ctx.moveTo(-r * 0.9, 0);
            ctx.bezierCurveTo(-r * 0.5, -r * 0.9, r * 0.4, -r * 0.8, r * 0.9, -r * 0.2);
            ctx.bezierCurveTo(r * 1.2, -r * 0.1, r * 1.1, r * 0.3, r * 0.7, r * 0.4);
            ctx.bezierCurveTo(r * 0.2, r * 0.8, -r * 0.5, r * 0.7, -r * 0.9, 0);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.moveTo(-r * 0.3, r * 0.3);
            ctx.quadraticCurveTo(r * 0.3, r * 0.5, r * 0.7, r * 0.2);
            ctx.quadraticCurveTo(r * 0.2, r * 0.6, -r * 0.3, r * 0.3);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(r * 0.35, -r * 0.22, r * 0.22, r * 0.1, Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#161622";
            ctx.beginPath();
            ctx.moveTo(-r * 0.1, -r * 0.6);
            ctx.lineTo(-r * 0.3, -r * 1.35);
            ctx.lineTo(-r * 0.6, -r * 0.5);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-r * 0.8, 0);
            ctx.lineTo(-r * 1.4, -r * 0.6);
            ctx.lineTo(-r * 1.1, 0);
            ctx.lineTo(-r * 1.4, r * 0.6);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // 5. サメ (Shark)
        function drawShark(x, y, r) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(-1, 1);

            const sharkGrad = ctx.createLinearGradient(0, -r, 0, r);
            sharkGrad.addColorStop(0, "#4a586e");
            sharkGrad.addColorStop(0.6, "#6c7a89");
            sharkGrad.addColorStop(1, "#c8d6e5");

            ctx.fillStyle = sharkGrad;
            ctx.beginPath();
            ctx.moveTo(-r * 1.0, 0);
            ctx.bezierCurveTo(-r * 0.5, -r * 0.8, r * 0.5, -r * 0.7, r * 1.1, -r * 0.1);
            ctx.bezierCurveTo(r * 1.2, 0, r * 1.0, r * 0.5, r * 0.5, r * 0.5);
            ctx.bezierCurveTo(-r * 0.2, r * 0.6, -r * 0.6, r * 0.5, -r * 1.0, 0);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, -r * 0.55);
            ctx.lineTo(-r * 0.25, -r * 1.2);
            ctx.lineTo(-r * 0.55, -r * 0.45);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-r * 0.9, 0);
            ctx.lineTo(-r * 1.45, -r * 0.75);
            ctx.lineTo(-r * 1.15, 0);
            ctx.lineTo(-r * 1.35, r * 0.55);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#ffcc00";
            ctx.beginPath();
            ctx.arc(r * 0.6, -r * 0.15, r * 0.12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000000";
            ctx.beginPath();
            ctx.arc(r * 0.6, -r * 0.15, r * 0.06, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#2f3640";
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(r * (0.1 - i * 0.12), 0, r * 0.22, -Math.PI * 0.3, Math.PI * 0.3);
                ctx.stroke();
            }

            ctx.restore();
        }
    </script>
