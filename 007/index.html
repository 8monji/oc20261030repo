<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>マイ・アクア・シューティング</title>
  <style>
    /* 全体スタイルの設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #020813;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      touch-action: none; /* スマホでの画面スクロールを防止 */
    }

    /* ゲームのルートコンテナ（16:9で固定拡大縮小） */
    #game-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 960px;
      height: 540px;
      transform: translate(-50%, -50%);
      background-color: #000;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
      overflow: hidden;
    }

    /* 描画キャンバス */
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* UIオーバーレイ共通 */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(2, 12, 27, 0.85);
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    /* ネオンマリン調のタイトル */
    h1 {
      font-size: 52px;
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff, 0 0 20px #00aaff, 0 0 40px #00aaff;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 2px;
    }

    /* スコア表示 */
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #e0f7fc;
      text-shadow: 0 0 5px #00d2ff;
      z-index: 5;
      pointer-events: none;
    }

    /* バフステータス表示 */
    #buffStatus {
      font-size: 16px;
      margin-top: 4px;
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff;
    }

    /* ボタン類 */
    .btn {
      padding: 12px 36px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #00d2ff, #0055ff);
      border: 2px solid #00f3ff;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
      transition: transform 0.1s, box-shadow 0.1s;
      margin: 10px;
    }
    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 5px rgba(0, 210, 255, 0.8);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid #00f3ff;
      color: #00f3ff;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      font-size: 16px;
      padding: 8px 20px;
    }

    /* 操作説明テキスト */
    .instructions {
      font-size: 16px;
      color: #b0e0e6;
      margin-bottom: 25px;
      text-align: center;
      line-height: 1.6;
    }

    /* スマホ用FIREボタン */
    #fireBtn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(0, 212, 255, 0.4);
      border: 3px solid #00f3ff;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
      z-index: 6;
      touch-action: none;
    }
    #fireBtn:active {
      background: rgba(0, 212, 255, 0.8);
    }

    /* 縦画面警告オーバーレイ */
    #orientation-warning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #020813;
      color: #00f3ff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- ゲーム全体コンテナ -->
  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- プレイ中HUD -->
    <div id="hud">
      TIME: <span id="timeVal">0.0</span>s | HIT: <span id="hitVal">0</span>
      <div id="buffStatus">SHIELD: <span id="shieldVal">ON</span> | 3-WAY: <span id="tripleVal">0.0</span>s</div>
    </div>

    <!-- FIREボタン（スマホ向け） -->
    <div id="fireBtn">FIRE</div>

    <!-- タイトル画面 -->
    <div id="titleScreen" class="overlay">
      <h1 id="titleText">海底シューティング</h1>
      <div class="instructions">
        【操作方法】<br>
        画面ドラッグ：潜水艦の自由移動（全方向）<br>
        FIREボタン または 2本指タップ：魚雷発射<br>
        （PC: 矢印キー/WASDで移動、スペースキーで発射）<br><br>
        🛡️ スタート時から「水流バリア」を標準装備！<br>
        🐠 撃破ドロップ：🛡️バリア再展開 / ⚡3WAY拡散魚雷
      </div>
      <button id="startBtn" class="btn">PLAY GAME</button>
      <button id="fullscreenBtn" class="btn btn-secondary">FULL SCREEN</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameOverScreen" class="overlay hidden">
      <h1 style="color: #ff3366; text-shadow: 0 0 20px #ff3366;">GAME OVER</h1>
      <div class="instructions" style="font-size: 20px; color: #fff;">
        生存時間: <span id="finalTime">0.0</span>秒<br>
        撃破数: <span id="finalHit">0</span>体
      </div>
      <button id="retryBtn" class="btn">RETRY</button>
    </div>
  </div>

  <!-- 縦画面警告メッセージ -->
  <div id="orientation-warning" class="hidden">
    <div>📱 スマホを横にしてね</div>
  </div>

  <script>
    // ==========================================
    // 【設定パラメーター (CONFIG)】
    // ==========================================
    const CONFIG = {
      title: "海底シューティング",
      bgColors: ["#005f73", "#0a2540", "#010a15"],
      playerGradient: ["#ffe600", "#ff6600"],
      enemyGradient:  ["#ff3366", "#990033"],
      bulletGradient: ["#00ffff", "#0088ff"],
      enemyBulletGradient: ["#ff00ff", "#ff0055"],
      enemySpeed: 230,
      spawnInterval: 1.2,
      bulletSpeed: 750,
      enemyBulletSpeed: 400,
      enemyShootInterval: 2.0,
      moveFollowSpeed: 15.0,
      keyboardSpeed: 450, // PCキーボード操作時の移動速度 (px/秒)
      itemDropRate: 0.35,
      itemSpeed: 120,
      tripleShotDuration: 8.0
    };

    // ==========================================
    // ゲームの基本定数と変数
    // ==========================================
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;

    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // DOM要素
    const titleText = document.getElementById('titleText');
    const titleScreen = document.getElementById('titleScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const startBtn = document.getElementById('startBtn');
    const retryBtn = document.getElementById('retryBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fireBtn = document.getElementById('fireBtn');
    const orientationWarning = document.getElementById('orientation-warning');
    const timeVal = document.getElementById('timeVal');
    const hitVal = document.getElementById('hitVal');
    const finalTime = document.getElementById('finalTime');
    const finalHit = document.getElementById('finalHit');
    const shieldVal = document.getElementById('shieldVal');
    const tripleVal = document.getElementById('tripleVal');

    titleText.innerText = CONFIG.title;

    // ゲーム状態
    let gameState = 'TITLE';
    let lastTime = 0;
    let scale = 1;
    let bounds = { left: 0, top: 0 };

    // ゲーム変数（X軸・Y軸ともにターゲット座標を所持）
    let player = {
      x: 90,
      y: 270,
      targetX: 90,
      targetY: 270,
      radius: 22,
      hasShield: true,
      tripleShotTimer: 0
    };
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let items = [];
    let elapsedTime = 0;
    let hitCount = 0;
    let enemySpawnTimer = 0;

    // キーボード入力の状態管理
    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false,
      KeyW: false,
      KeyS: false,
      KeyA: false,
      KeyD: false
    };

    // --- 海底背景・エフェクト用データ ---
    let bgBubbles = [];
    for (let i = 0; i < 60; i++) {
      bgBubbles.push({
        x: Math.random() * GAME_WIDTH,
        y: Math.random() * GAME_HEIGHT,
        radius: Math.random() * 5 + 2,
        speed: Math.random() * 40 + 15,
        wobbleSpeed: Math.random() * 3 + 1,
        wobble: Math.random() * Math.PI * 2
      });
    }

    let actionBubbles = [];

    function createBubbleBurst(x, y, count, minSpeed, maxSpeed) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = minSpeed + Math.random() * (maxSpeed - minSpeed);
        actionBubbles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 20,
          radius: Math.random() * 6 + 2,
          alpha: 1.0,
          decay: Math.random() * 1.5 + 0.8
        });
      }
    }

    let seabedPoints = [];
    const segments = 20;
    for (let i = 0; i <= segments; i++) {
      const x = (GAME_WIDTH / segments) * i;
      const y = GAME_HEIGHT - (35 + Math.sin(i * 0.8) * 15 + Math.random() * 10);
      seabedPoints.push({ x, y });
    }

    let seaweeds = [
      { x: 120, height: 90, phase: 0 },
      { x: 280, height: 130, phase: 1.5 },
      { x: 480, height: 110, phase: 3.0 },
      { x: 680, height: 140, phase: 4.5 },
      { x: 850, height: 100, phase: 2.0 }
    ];

    // ==========================================
    // リサイズ計算
    // ==========================================
    function updateLayout() {
      if (window.innerHeight > window.innerWidth) {
        orientationWarning.classList.remove('hidden');
      } else {
        orientationWarning.classList.add('hidden');
      }

      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      
      scale = Math.min(windowWidth / GAME_WIDTH, windowHeight / GAME_HEIGHT);
      
      container.style.width = `${GAME_WIDTH * scale}px`;
      container.style.height = `${GAME_HEIGHT * scale}px`;

      const rect = container.getBoundingClientRect();
      bounds.left = rect.left;
      bounds.top = rect.top;
    }

    window.addEventListener('resize', updateLayout);
    window.addEventListener('orientationchange', updateLayout);
    updateLayout();

    // X, Y両方のゲーム座標変換
    function getGameCoordinates(clientX, clientY) {
      const touchX = clientX - bounds.left;
      const touchY = clientY - bounds.top;
      const gameX = touchX / scale;
      const gameY = touchY / scale;
      return {
        x: Math.max(player.radius, Math.min(GAME_WIDTH - player.radius, gameX)),
        y: Math.max(player.radius, Math.min(GAME_HEIGHT - player.radius, gameY))
      };
    }

    // ==========================================
    // 入力処理（自由移動・全方向ドラッグ対応）
    // ==========================================
    let activeTouchId = null;

    function handlePointerDown(e) {
      if (gameState !== 'PLAYING') return;
      if (e.target === fireBtn) return;

      if (e.touches) {
        // マルチタッチ対応：移動用のタッチIDを追跡
        if (activeTouchId === null) {
          const touch = e.changedTouches[0];
          activeTouchId = touch.identifier;
          const coords = getGameCoordinates(touch.clientX, touch.clientY);
          player.targetX = coords.x;
          player.targetY = coords.y;
        } else if (e.touches.length > 1) {
          // 2本目の指タップで弾発射
          shootBullet();
        }
      } else {
        const coords = getGameCoordinates(e.clientX, e.clientY);
        player.targetX = coords.x;
        player.targetY = coords.y;
      }
    }

    function handlePointerMove(e) {
      if (gameState !== 'PLAYING') return;
      if (e.touches) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === activeTouchId) {
            const touch = e.changedTouches[i];
            const coords = getGameCoordinates(touch.clientX, touch.clientY);
            player.targetX = coords.x;
            player.targetY = coords.y;
            break;
          }
        }
      } else if (e.buttons === 1 && e.target !== fireBtn) {
        const coords = getGameCoordinates(e.clientX, e.clientY);
        player.targetX = coords.x;
        player.targetY = coords.y;
      }
    }

    function handlePointerEnd(e) {
      if (e.touches) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === activeTouchId) {
            activeTouchId = null;
            break;
          }
        }
      }
    }

    window.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mousemove', handlePointerMove);

    window.addEventListener('touchstart', handlePointerDown, { passive: false });
    window.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerEnd);
    window.addEventListener('touchcancel', handlePointerEnd);

    // FIREボタン（タップしても移動に干渉しない）
    fireBtn.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      e.preventDefault();
      if (gameState === 'PLAYING') shootBullet();
    });
    fireBtn.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      if (gameState === 'PLAYING') shootBullet();
    });

    // キーボード入力処理（移動・発射）
    window.addEventListener('keydown', (e) => {
      if (e.code in keys) {
        keys[e.code] = true;
      }
      if (e.code === 'Space' && gameState === 'PLAYING') {
        shootBullet();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code in keys) {
        keys[e.code] = false;
      }
    });

    function shootBullet() {
      if (player.tripleShotTimer > 0) {
        const angles = [-0.2, 0, 0.2];
        angles.forEach(angle => {
          bullets.push({
            x: player.x + 30,
            y: player.y,
            vx: Math.cos(angle) * CONFIG.bulletSpeed,
            vy: Math.sin(angle) * CONFIG.bulletSpeed,
            radius: 7
          });
        });
      } else {
        bullets.push({
          x: player.x + 30,
          y: player.y,
          vx: CONFIG.bulletSpeed,
          vy: 0,
          radius: 7
        });
      }
      createBubbleBurst(player.x + 30, player.y, 8, 40, 120);
    }

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
          alert(`全画面表示に失敗しました: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    startBtn.addEventListener('click', startGame);
    retryBtn.addEventListener('click', startGame);

    function tryDropItem(x, y) {
      if (Math.random() < CONFIG.itemDropRate) {
        const type = Math.random() < 0.5 ? 'SHIELD' : 'TRIPLE';
        items.push({
          x: x,
          y: y,
          type: type,
          radius: 16,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function takeDamage() {
      if (player.hasShield) {
        player.hasShield = false;
        createBubbleBurst(player.x, player.y, 25, 80, 200);
        return false;
      }
      gameOver();
      return true;
    }

    // ==========================================
    // ゲームルーチン
    // ==========================================
    function startGame() {
      gameState = 'PLAYING';
      elapsedTime = 0;
      hitCount = 0;
      enemySpawnTimer = 0;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      items = [];
      actionBubbles = [];
      player.x = 90;
      player.y = GAME_HEIGHT / 2;
      player.targetX = 90;
      player.targetY = GAME_HEIGHT / 2;
      player.hasShield = true;
      player.tripleShotTimer = 0;

      timeVal.innerText = '0.0';
      hitVal.innerText = '0';
      shieldVal.innerText = 'ON';
      tripleVal.innerText = '0.0';

      titleScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      finalTime.innerText = elapsedTime.toFixed(1);
      finalHit.innerText = hitCount;
      createBubbleBurst(player.x, player.y, 40, 50, 250);
      gameOverScreen.classList.remove('hidden');
    }

    // 主更新処理 (dt: 経過時間 秒)
    function update(dt) {
      bgBubbles.forEach(b => {
        b.y -= b.speed * dt;
        b.wobble += dt * b.wobbleSpeed;
        b.x += Math.sin(b.wobble) * 0.8;
        if (b.y < -15) {
          b.y = GAME_HEIGHT + 15;
          b.x = Math.random() * GAME_WIDTH;
        }
      });

      for (let i = actionBubbles.length - 1; i >= 0; i--) {
        const ab = actionBubbles[i];
        ab.x += ab.vx * dt;
        ab.y += ab.vy * dt;
        ab.alpha -= ab.decay * dt;
        if (ab.alpha <= 0) {
          actionBubbles.splice(i, 1);
        }
      }

      if (gameState !== 'PLAYING') return;

      // タイム加算
      elapsedTime += dt;
      timeVal.innerText = elapsedTime.toFixed(1);

      // バフタイマーの更新
      if (player.tripleShotTimer > 0) {
        player.tripleShotTimer -= dt;
        if (player.tripleShotTimer < 0) player.tripleShotTimer = 0;
      }
      shieldVal.innerText = player.hasShield ? 'ON' : 'OFF';
      shieldVal.style.color = player.hasShield ? '#00ffff' : '#888888';
      tripleVal.innerText = player.tripleShotTimer.toFixed(1);
      tripleVal.style.color = player.tripleShotTimer > 0 ? '#76ff03' : '#888888';

      // --- キーボード操作時のターゲット位置更新 ---
      let kx = 0, ky = 0;
      if (keys.ArrowUp || keys.KeyW) ky -= 1;
      if (keys.ArrowDown || keys.KeyS) ky += 1;
      if (keys.ArrowLeft || keys.KeyA) kx -= 1;
      if (keys.ArrowRight || keys.KeyD) kx += 1;

      if (kx !== 0 || ky !== 0) {
        player.targetX += kx * CONFIG.keyboardSpeed * dt;
        player.targetY += ky * CONFIG.keyboardSpeed * dt;
        player.targetX = Math.max(player.radius, Math.min(GAME_WIDTH - player.radius, player.targetX));
        player.targetY = Math.max(player.radius, Math.min(GAME_HEIGHT - player.radius, player.targetY));
      }

      // --- 自機の2次元（X軸・Y軸）スムーズ追従移動 ---
      player.x += (player.targetX - player.x) * CONFIG.moveFollowSpeed * dt;
      player.y += (player.targetY - player.y) * CONFIG.moveFollowSpeed * dt;

      // 潜水艦スクリュー泡
      if (Math.random() < 0.6) {
        actionBubbles.push({
          x: player.x - 25,
          y: player.y + (Math.random() * 8 - 4),
          vx: -CONFIG.bulletSpeed * 0.15 + (Math.random() * 20 - 10),
          vy: Math.random() * 20 - 10,
          radius: Math.random() * 3 + 1,
          alpha: 0.8,
          decay: 1.5
        });
      }

      // プレイヤー魚雷の移動
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].x += bullets[i].vx * dt;
        bullets[i].y += bullets[i].vy * dt;

        if (Math.random() < 0.5) {
          actionBubbles.push({
            x: bullets[i].x - 8,
            y: bullets[i].y + (Math.random() * 4 - 2),
            vx: -30,
            vy: Math.random() * 20 - 10,
            radius: Math.random() * 2.5 + 1,
            alpha: 0.9,
            decay: 2.0
          });
        }

        if (bullets[i].x > GAME_WIDTH + 20 || bullets[i].y < -20 || bullets[i].y > GAME_HEIGHT + 20) {
          bullets.splice(i, 1);
        }
      }

      // 敵の出現
      enemySpawnTimer += dt;
      if (enemySpawnTimer >= CONFIG.spawnInterval) {
        enemySpawnTimer = 0;
        enemies.push({
          x: GAME_WIDTH + 30,
          y: Math.random() * (GAME_HEIGHT - 130) + 40,
          radius: 20,
          phase: Math.random() * Math.PI * 2,
          shootTimer: Math.random() * CONFIG.enemyShootInterval
        });
      }

      // 敵の移動・攻撃処理
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x -= CONFIG.enemySpeed * dt;
        e.phase += dt * 5;
        e.y += Math.sin(e.phase) * 1.2;

        e.shootTimer += dt;
        if (e.shootTimer >= CONFIG.enemyShootInterval && e.x < GAME_WIDTH - 50 && e.x > 100) {
          e.shootTimer = 0;
          const angle = Math.atan2(player.y - e.y, player.x - e.x);
          enemyBullets.push({
            x: e.x - e.radius,
            y: e.y,
            vx: Math.cos(angle) * CONFIG.enemyBulletSpeed,
            vy: Math.sin(angle) * CONFIG.enemyBulletSpeed,
            radius: 6
          });
          createBubbleBurst(e.x - e.radius, e.y, 5, 20, 60);
        }

        if (e.x < -30) {
          enemies.splice(i, 1);
        }
      }

      // 敵の攻撃弾の移動
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx * dt;
        eb.y += eb.vy * dt;

        if (eb.x < -20 || eb.x > GAME_WIDTH + 20 || eb.y < -20 || eb.y > GAME_HEIGHT + 20) {
          enemyBullets.splice(i, 1);
        }
      }

      // アイテムの移動
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.x -= CONFIG.itemSpeed * dt;
        item.phase += dt * 4;
        item.y += Math.sin(item.phase) * 0.8;

        if (item.x < -30) {
          items.splice(i, 1);
        }
      }

      // 当たり判定：プレイヤー弾 vs 敵
      for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = enemies.length - 1; j >= 0; j--) {
          const b = bullets[i];
          const e = enemies[j];
          if (!b || !e) continue;

          const dist = Math.hypot(b.x - e.x, b.y - e.y);
          if (dist < b.radius + e.radius) {
            createBubbleBurst(e.x, e.y, 20, 60, 180);
            tryDropItem(e.x, e.y);
            bullets.splice(i, 1);
            enemies.splice(j, 1);
            hitCount++;
            hitVal.innerText = hitCount;
            break;
          }
        }
      }

      // 当たり判定：自機 vs アイテム
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        const dist = Math.hypot(player.x - item.x, player.y - item.y);
        if (dist < player.radius + item.radius) {
          if (item.type === 'SHIELD') {
            player.hasShield = true;
          } else if (item.type === 'TRIPLE') {
            player.tripleShotTimer = CONFIG.tripleShotDuration;
          }
          createBubbleBurst(item.x, item.y, 15, 50, 150);
          items.splice(i, 1);
        }
      }

      // 当たり判定：自機 vs 敵本体
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < player.radius + e.radius) {
          enemies.splice(i, 1);
          if (takeDamage()) return;
        }
      }

      // 当たり判定：自機 vs 敵の攻撃弾
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        const dist = Math.hypot(player.x - eb.x, player.y - eb.y);
        if (dist < player.radius + eb.radius) {
          enemyBullets.splice(i, 1);
          if (takeDamage()) return;
        }
      }
    }

    // ==========================================
    // 描画処理
    // ==========================================
    function draw() {
      // 1. 背景グラデーション
      const bgGrad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
      bgGrad.addColorStop(0.0, CONFIG.bgColors[0]);
      bgGrad.addColorStop(0.5, CONFIG.bgColors[1]);
      bgGrad.addColorStop(1.0, CONFIG.bgColors[2]);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // 2. 差し込む光
      ctx.save();
      const rayGrad = ctx.createLinearGradient(0, 0, GAME_WIDTH * 0.8, GAME_HEIGHT);
      rayGrad.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
      rayGrad.addColorStop(0.5, 'rgba(0, 243, 255, 0.05)');
      rayGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = rayGrad;

      ctx.beginPath();
      ctx.moveTo(80, 0);
      ctx.lineTo(240, 0);
      ctx.lineTo(480, GAME_HEIGHT);
      ctx.lineTo(220, GAME_HEIGHT);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(500, 0);
      ctx.lineTo(720, 0);
      ctx.lineTo(940, GAME_HEIGHT);
      ctx.lineTo(680, GAME_HEIGHT);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 3. 海藻
      seaweeds.forEach(sw => {
        const time = Date.now() * 0.002;
        const flex = Math.sin(time + sw.phase) * 15;
        const seaweedGrad = ctx.createLinearGradient(sw.x, GAME_HEIGHT, sw.x + flex * 1.5, GAME_HEIGHT - sw.height);
        seaweedGrad.addColorStop(0, '#004d26');
        seaweedGrad.addColorStop(1, '#00ff88');

        ctx.strokeStyle = seaweedGrad;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sw.x, GAME_HEIGHT - 20);
        ctx.quadraticCurveTo(
          sw.x + flex, GAME_HEIGHT - (sw.height / 2),
          sw.x + flex * 1.5, GAME_HEIGHT - sw.height
        );
        ctx.stroke();
      });

      // 4. 地形
      const seabedGrad = ctx.createLinearGradient(0, GAME_HEIGHT - 60, 0, GAME_HEIGHT);
      seabedGrad.addColorStop(0, '#0c3552');
      seabedGrad.addColorStop(1, '#020b14');
      ctx.fillStyle = seabedGrad;
      ctx.beginPath();
      ctx.moveTo(0, GAME_HEIGHT);
      seabedPoints.forEach(pt => ctx.lineTo(pt.x, pt.y));
      ctx.lineTo(GAME_WIDTH, GAME_HEIGHT);
      ctx.closePath();
      ctx.fill();

      // 5. 環境泡
      bgBubbles.forEach(b => {
        const bubbleGrad = ctx.createRadialGradient(
          b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.1,
          b.x, b.y, b.radius
        );
        bubbleGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
        bubbleGrad.addColorStop(0.4, 'rgba(180, 245, 255, 0.4)');
        bubbleGrad.addColorStop(1, 'rgba(0, 180, 255, 0.1)');

        ctx.fillStyle = bubbleGrad;
        ctx.strokeStyle = 'rgba(200, 250, 255, 0.7)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      // 6. アクション泡
      actionBubbles.forEach(ab => {
        ctx.strokeStyle = `rgba(0, 243, 255, ${ab.alpha * 0.8})`;
        ctx.fillStyle = `rgba(220, 255, 255, ${ab.alpha * 0.4})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(ab.x, ab.y, Math.max(0.1, ab.radius), 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        // 7. ドロップアイテム
        items.forEach(item => {
          ctx.save();
          const isShield = item.type === 'SHIELD';
          const mainColor = isShield ? '#00ffff' : '#76ff03';
          
          ctx.shadowBlur = 15;
          ctx.shadowColor = mainColor;
          
          ctx.fillStyle = 'rgba(2, 12, 27, 0.8)';
          ctx.strokeStyle = mainColor;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 14px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(isShield ? '🛡️' : '⚡', item.x, item.y);
          ctx.restore();
        });

        // 8. プレイヤー魚雷
        bullets.forEach(b => {
          const bulletGrad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius);
          bulletGrad.addColorStop(0, '#ffffff');
          bulletGrad.addColorStop(0.4, CONFIG.bulletGradient[0]);
          bulletGrad.addColorStop(1, CONFIG.bulletGradient[1]);

          ctx.fillStyle = bulletGrad;
          ctx.shadowBlur = 15;
          ctx.shadowColor = CONFIG.bulletGradient[0];
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        // 9. 敵の攻撃弾
        enemyBullets.forEach(eb => {
          const ebGrad = ctx.createRadialGradient(eb.x, eb.y, 0, eb.x, eb.y, eb.radius);
          ebGrad.addColorStop(0, '#ffffff');
          ebGrad.addColorStop(0.4, CONFIG.enemyBulletGradient[0]);
          ebGrad.addColorStop(1, CONFIG.enemyBulletGradient[1]);

          ctx.fillStyle = ebGrad;
          ctx.shadowBlur = 15;
          ctx.shadowColor = CONFIG.enemyBulletGradient[0];
          ctx.beginPath();
          ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        // 10. 敵（深海生物）
        enemies.forEach(e => {
          const enemyGrad = ctx.createLinearGradient(e.x - e.radius, e.y, e.x + e.radius, e.y);
          enemyGrad.addColorStop(0, CONFIG.enemyGradient[0]);
          enemyGrad.addColorStop(1, CONFIG.enemyGradient[1]);

          ctx.fillStyle = enemyGrad;
          ctx.shadowBlur = 12;
          ctx.shadowColor = CONFIG.enemyGradient[0];

          ctx.beginPath();
          ctx.ellipse(e.x, e.y, e.radius, e.radius * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(e.x + e.radius * 0.8, e.y);
          ctx.lineTo(e.x + e.radius * 1.6, e.y - e.radius * 0.6);
          ctx.lineTo(e.x + e.radius * 1.6, e.y + e.radius * 0.6);
          ctx.closePath();
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(e.x - e.radius * 0.4, e.y - e.radius * 0.2, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(e.x - e.radius * 0.4 - 1, e.y - e.radius * 0.2, 1.5, 0, Math.PI * 2);
          ctx.fill();
        });

        // 11. 潜水艦（自機）
        const pGrad = ctx.createLinearGradient(player.x - player.radius, player.y - player.radius, player.x + player.radius, player.y + player.radius);
        pGrad.addColorStop(0, CONFIG.playerGradient[0]);
        pGrad.addColorStop(1, CONFIG.playerGradient[1]);

        ctx.fillStyle = pGrad;
        ctx.shadowBlur = 15;
        ctx.shadowColor = CONFIG.playerGradient[0];

        ctx.beginPath();
        ctx.ellipse(player.x, player.y, player.radius * 1.2, player.radius * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillRect(player.x - 6, player.y - player.radius - 2, 12, 10);

        const windowGrad = ctx.createRadialGradient(player.x + 8, player.y - 2, 0, player.x + 8, player.y - 2, 5);
        windowGrad.addColorStop(0, '#ffffff');
        windowGrad.addColorStop(1, '#00ffff');
        ctx.fillStyle = windowGrad;
        ctx.beginPath();
        ctx.arc(player.x + 8, player.y - 2, 5, 0, Math.PI * 2);
        ctx.fill();

        // バリア（水流シールド）エフェクト描画
        if (player.hasShield) {
          ctx.strokeStyle = '#00ffff';
          ctx.shadowColor = '#00ffff';
          ctx.shadowBlur = 20;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.radius * 1.6, 0, Math.PI * 2);
          ctx.stroke();
        }

        // サーチライト
        const lightGrad = ctx.createLinearGradient(player.x + player.radius, player.y, player.x + player.radius + 150, player.y);
        lightGrad.addColorStop(0, 'rgba(0, 255, 255, 0.4)');
        lightGrad.addColorStop(1, 'rgba(0, 255, 255, 0.0)');

        ctx.shadowBlur = 0;
        ctx.fillStyle = lightGrad;
        ctx.beginPath();
        ctx.moveTo(player.x + player.radius, player.y);
        ctx.lineTo(player.x + player.radius + 150, player.y - 40);
        ctx.lineTo(player.x + player.radius + 150, player.y + 40);
        ctx.closePath();
        ctx.fill();
      }
    }

    // ==========================================
    // メインゲームループ
    // ==========================================
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
