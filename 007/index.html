<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>マイ・アクア・シューティング</title>
  <style>
    /* 全体スタイルの設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #020813;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      touch-action: none; /* スマホでの画面スクロールを防止 */
    }

    /* ゲームのルートコンテナ（16:9で固定拡大縮小） */
    #game-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 960px;
      height: 540px;
      transform: translate(-50%, -50%);
      background-color: #000;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
      overflow: hidden;
    }

    /* 描画キャンバス */
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* UIオーバーレイ共通 */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(2, 12, 27, 0.85);
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    /* ネオンマリン調のタイトル */
    h1 {
      font-size: 52px;
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff, 0 0 20px #00aaff, 0 0 40px #00aaff;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 2px;
    }

    /* スコア表示 */
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #e0f7fc;
      text-shadow: 0 0 5px #00d2ff;
      z-index: 5;
      pointer-events: none;
    }

    /* ボタン類 */
    .btn {
      padding: 12px 36px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #00d2ff, #0055ff);
      border: 2px solid #00f3ff;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
      transition: transform 0.1s, box-shadow 0.1s;
      margin: 10px;
    }
    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 5px rgba(0, 210, 255, 0.8);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid #00f3ff;
      color: #00f3ff;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      font-size: 16px;
      padding: 8px 20px;
    }

    /* 操作説明テキスト */
    .instructions {
      font-size: 16px;
      color: #b0e0e6;
      margin-bottom: 25px;
      text-align: center;
      line-height: 1.6;
    }

    /* スマホ用FIREボタン */
    #fireBtn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(0, 212, 255, 0.4);
      border: 3px solid #00f3ff;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
      z-index: 6;
      touch-action: none;
    }
    #fireBtn:active {
      background: rgba(0, 212, 255, 0.8);
    }

    /* 縦画面警告オーバーレイ */
    #orientation-warning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #020813;
      color: #00f3ff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- ゲーム全体コンテナ -->
  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- プレイ中HUD -->
    <div id="hud">
      TIME: <span id="timeVal">0.0</span>s | HIT: <span id="hitVal">0</span>
    </div>

    <!-- FIREボタン（スマホ向け） -->
    <div id="fireBtn">FIRE</div>

    <!-- タイトル画面 -->
    <div id="titleScreen" class="overlay">
      <h1 id="titleText">海底シューティング</h1>
      <div class="instructions">
        【操作方法】<br>
        上下ドラッグ：潜水艦の移動<br>
        画面タップ または FIREボタン：魚雷発射<br>
        （PC: スペースキーでも発射可能）
      </div>
      <button id="startBtn" class="btn">PLAY GAME</button>
      <button id="fullscreenBtn" class="btn btn-secondary">FULL SCREEN</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameOverScreen" class="overlay hidden">
      <h1 style="color: #ff3366; text-shadow: 0 0 20px #ff3366;">GAME OVER</h1>
      <div class="instructions" style="font-size: 20px; color: #fff;">
        生存時間: <span id="finalTime">0.0</span>秒<br>
        撃破数: <span id="finalHit">0</span>体
      </div>
      <button id="retryBtn" class="btn">RETRY</button>
    </div>
  </div>

  <!-- 縦画面警告メッセージ -->
  <div id="orientation-warning" class="hidden">
    <div>📱 スマホを横にしてね</div>
  </div>

  <script>
    // ==========================================
    // 【設定パラメーター (CONFIG)】
    // 海底世界に合わせてカラー・グラデーション・バランスを調整
    // ==========================================
    const CONFIG = {
      title: "海底シューティング",
      // 背景3段グラデーション色（浅瀬→中層→深海）
      bgColors: ["#005f73", "#0a2540", "#010a15"],
      // オブジェクト用グラデーション設定（[開始色, 終了色]）
      playerGradient: ["#ffe600", "#ff6600"], // 自機：煌めくゴールド〜オレンジ
      enemyGradient:  ["#ff3366", "#990033"], // 敵：深海レッド〜ダークチェリー
      bulletGradient: ["#00ffff", "#0088ff"], // 魚雷：発光シアン〜ブルー
      enemySpeed: 230,              // 敵の移動速度 (px/秒)
      spawnInterval: 1.2,           // 敵の出現間隔 (秒)
      bulletSpeed: 750,             // 弾の飛行速度 (px/秒)
      moveFollowSpeed: 15.0         // 自機の指への追従速度
    };

    // ==========================================
    // ゲームの基本定数と変数
    // ==========================================
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;

    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // DOM要素
    const titleText = document.getElementById('titleText');
    const titleScreen = document.getElementById('titleScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const startBtn = document.getElementById('startBtn');
    const retryBtn = document.getElementById('retryBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fireBtn = document.getElementById('fireBtn');
    const orientationWarning = document.getElementById('orientation-warning');
    const timeVal = document.getElementById('timeVal');
    const hitVal = document.getElementById('hitVal');
    const finalTime = document.getElementById('finalTime');
    const finalHit = document.getElementById('finalHit');

    // CONFIGの適用
    titleText.innerText = CONFIG.title;

    // ゲーム状態
    let gameState = 'TITLE'; // 'TITLE', 'PLAYING', 'GAMEOVER'
    let lastTime = 0;
    let scale = 1;
    let bounds = { left: 0, top: 0 };

    // ゲーム変数
    let player = { x: 90, y: 270, targetY: 270, radius: 22 };
    let bullets = [];
    let enemies = [];
    let elapsedTime = 0;
    let hitCount = 0;
    let enemySpawnTimer = 0;

    // --- 海底背景・エフェクト用データ ---
    // 1. 環境浮遊泡（グラデーションの質感付き）
    let bgBubbles = [];
    for (let i = 0; i < 60; i++) {
      bgBubbles.push({
        x: Math.random() * GAME_WIDTH,
        y: Math.random() * GAME_HEIGHT,
        radius: Math.random() * 5 + 2,
        speed: Math.random() * 40 + 15,
        wobbleSpeed: Math.random() * 3 + 1,
        wobble: Math.random() * Math.PI * 2
      });
    }

    // 2. アクション泡（バースト・軌跡）
    let actionBubbles = [];

    function createBubbleBurst(x, y, count, minSpeed, maxSpeed) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = minSpeed + Math.random() * (maxSpeed - minSpeed);
        actionBubbles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 20,
          radius: Math.random() * 6 + 2,
          alpha: 1.0,
          decay: Math.random() * 1.5 + 0.8
        });
      }
    }

    // 3. 海底地形（グラデーション表示用の砂地・岩場）
    let seabedPoints = [];
    const segments = 20;
    for (let i = 0; i <= segments; i++) {
      const x = (GAME_WIDTH / segments) * i;
      const y = GAME_HEIGHT - (35 + Math.sin(i * 0.8) * 15 + Math.random() * 10);
      seabedPoints.push({ x, y });
    }

    // 4. 海藻のデータ
    let seaweeds = [
      { x: 120, height: 90, phase: 0 },
      { x: 280, height: 130, phase: 1.5 },
      { x: 480, height: 110, phase: 3.0 },
      { x: 680, height: 140, phase: 4.5 },
      { x: 850, height: 100, phase: 2.0 }
    ];

    // ==========================================
    // リサイズ・画面リサイズ計算
    // ==========================================
    function updateLayout() {
      if (window.innerHeight > window.innerWidth) {
        orientationWarning.classList.remove('hidden');
      } else {
        orientationWarning.classList.add('hidden');
      }

      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      
      scale = Math.min(windowWidth / GAME_WIDTH, windowHeight / GAME_HEIGHT);
      
      container.style.width = `${GAME_WIDTH * scale}px`;
      container.style.height = `${GAME_HEIGHT * scale}px`;

      const rect = container.getBoundingClientRect();
      bounds.left = rect.left;
      bounds.top = rect.top;
    }

    window.addEventListener('resize', updateLayout);
    window.addEventListener('orientationchange', updateLayout);
    updateLayout();

    // ==========================================
    // 座標変換 (画面座標 -> 固定ゲーム座標)
    // ==========================================
    function getGameCoordinates(clientY) {
      const touchY = clientY - bounds.top;
      const gameY = touchY / scale;
      return Math.max(player.radius, Math.min(GAME_HEIGHT - player.radius, gameY));
    }

    // ==========================================
    // 入力イベント処理
    // ==========================================
    let isDragging = false;

    function handlePointerDown(e) {
      if (gameState !== 'PLAYING') return;
      if (e.target === fireBtn) return;
      
      isDragging = true;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      player.targetY = getGameCoordinates(clientY);

      shootBullet();
    }

    function handlePointerMove(e) {
      if (!isDragging || gameState !== 'PLAYING') return;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      player.targetY = getGameCoordinates(clientY);
    }

    function handlePointerEnd() {
      isDragging = false;
    }

    window.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerEnd);

    window.addEventListener('touchstart', handlePointerDown, { passive: false });
    window.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerEnd);

    fireBtn.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      e.preventDefault();
      if (gameState === 'PLAYING') shootBullet();
    });
    fireBtn.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      if (gameState === 'PLAYING') shootBullet();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && gameState === 'PLAYING') {
        shootBullet();
      }
    });

    function shootBullet() {
      bullets.push({
        x: player.x + 30,
        y: player.y,
        radius: 7
      });
      createBubbleBurst(player.x + 30, player.y, 8, 40, 120);
    }

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
          alert(`全画面表示に失敗しました: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    startBtn.addEventListener('click', startGame);
    retryBtn.addEventListener('click', startGame);

    // ==========================================
    // ゲームルーチン
    // ==========================================
    function startGame() {
      gameState = 'PLAYING';
      elapsedTime = 0;
      hitCount = 0;
      enemySpawnTimer = 0;
      bullets = [];
      enemies = [];
      actionBubbles = [];
      player.y = GAME_HEIGHT / 2;
      player.targetY = GAME_HEIGHT / 2;

      timeVal.innerText = '0.0';
      hitVal.innerText = '0';

      titleScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      finalTime.innerText = elapsedTime.toFixed(1);
      finalHit.innerText = hitCount;
      createBubbleBurst(player.x, player.y, 40, 50, 250);
      gameOverScreen.classList.remove('hidden');
    }

    // 主更新処理 (dt: 経過時間 秒)
    function update(dt) {
      // 1. 環境泡の上昇と左右ゆらぎ
      bgBubbles.forEach(b => {
        b.y -= b.speed * dt;
        b.wobble += dt * b.wobbleSpeed;
        b.x += Math.sin(b.wobble) * 0.8;
        if (b.y < -15) {
          b.y = GAME_HEIGHT + 15;
          b.x = Math.random() * GAME_WIDTH;
        }
      });

      // 2. アクション泡の更新
      for (let i = actionBubbles.length - 1; i >= 0; i--) {
        const ab = actionBubbles[i];
        ab.x += ab.vx * dt;
        ab.y += ab.vy * dt;
        ab.alpha -= ab.decay * dt;
        if (ab.alpha <= 0) {
          actionBubbles.splice(i, 1);
        }
      }

      if (gameState !== 'PLAYING') return;

      // タイム加算
      elapsedTime += dt;
      timeVal.innerText = elapsedTime.toFixed(1);

      // 潜水艦のスクリューから小さな連続泡
      if (Math.random() < 0.6) {
        actionBubbles.push({
          x: player.x - 25,
          y: player.y + (Math.random() * 8 - 4),
          vx: -CONFIG.bulletSpeed * 0.15 + (Math.random() * 20 - 10),
          vy: Math.random() * 20 - 10,
          radius: Math.random() * 3 + 1,
          alpha: 0.8,
          decay: 1.5
        });
      }

      // 潜水艦のなめらかな追従移動
      player.y += (player.targetY - player.y) * CONFIG.moveFollowSpeed * dt;

      // 魚雷の移動
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].x += CONFIG.bulletSpeed * dt;

        if (Math.random() < 0.5) {
          actionBubbles.push({
            x: bullets[i].x - 8,
            y: bullets[i].y + (Math.random() * 4 - 2),
            vx: -30,
            vy: Math.random() * 20 - 10,
            radius: Math.random() * 2.5 + 1,
            alpha: 0.9,
            decay: 2.0
          });
        }

        if (bullets[i].x > GAME_WIDTH + 20) {
          bullets.splice(i, 1);
        }
      }

      // 敵の出現
      enemySpawnTimer += dt;
      if (enemySpawnTimer >= CONFIG.spawnInterval) {
        enemySpawnTimer = 0;
        enemies.push({
          x: GAME_WIDTH + 30,
          y: Math.random() * (GAME_HEIGHT - 130) + 40,
          radius: 20,
          phase: Math.random() * Math.PI * 2
        });
      }

      // 敵の移動
      for (let i = enemies.length - 1; i >= 0; i--) {
        enemies[i].x -= CONFIG.enemySpeed * dt;
        enemies[i].phase += dt * 5;
        enemies[i].y += Math.sin(enemies[i].phase) * 1.2;

        if (enemies[i].x < -30) {
          enemies.splice(i, 1);
        }
      }

      // 当たり判定：弾 vs 敵
      for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = enemies.length - 1; j >= 0; j--) {
          const b = bullets[i];
          const e = enemies[j];
          if (!b || !e) continue;

          const dist = Math.hypot(b.x - e.x, b.y - e.y);
          if (dist < b.radius + e.radius) {
            createBubbleBurst(e.x, e.y, 20, 60, 180);
            bullets.splice(i, 1);
            enemies.splice(j, 1);
            hitCount++;
            hitVal.innerText = hitCount;
            break;
          }
        }
      }

      // 当たり判定：自機 vs 敵
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < player.radius + e.radius) {
          gameOver();
          break;
        }
      }
    }

    // ==========================================
    // 描画処理 (豊かなグラデーション描写)
    // ==========================================
    function draw() {
      // 1. 背景：3段マルチカラーストップ縦グラデーション（浅瀬→深海）
      const bgGrad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
      bgGrad.addColorStop(0.0, CONFIG.bgColors[0]);
      bgGrad.addColorStop(0.5, CONFIG.bgColors[1]);
      bgGrad.addColorStop(1.0, CONFIG.bgColors[2]);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // 2. 差し込む光の筋（淡いグラデーション光線）
      ctx.save();
      const rayGrad = ctx.createLinearGradient(0, 0, GAME_WIDTH * 0.8, GAME_HEIGHT);
      rayGrad.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
      rayGrad.addColorStop(0.5, 'rgba(0, 243, 255, 0.05)');
      rayGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = rayGrad;

      ctx.beginPath();
      ctx.moveTo(80, 0);
      ctx.lineTo(240, 0);
      ctx.lineTo(480, GAME_HEIGHT);
      ctx.lineTo(220, GAME_HEIGHT);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(500, 0);
      ctx.lineTo(720, 0);
      ctx.lineTo(940, GAME_HEIGHT);
      ctx.lineTo(680, GAME_HEIGHT);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 3. 海底の海藻描画（根元〜穂先のグラデーション）
      seaweeds.forEach(sw => {
        const time = Date.now() * 0.002;
        const flex = Math.sin(time + sw.phase) * 15;
        const seaweedGrad = ctx.createLinearGradient(sw.x, GAME_HEIGHT, sw.x + flex * 1.5, GAME_HEIGHT - sw.height);
        seaweedGrad.addColorStop(0, '#004d26');
        seaweedGrad.addColorStop(1, '#00ff88');

        ctx.strokeStyle = seaweedGrad;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sw.x, GAME_HEIGHT - 20);
        ctx.quadraticCurveTo(
          sw.x + flex, GAME_HEIGHT - (sw.height / 2),
          sw.x + flex * 1.5, GAME_HEIGHT - sw.height
        );
        ctx.stroke();
      });

      // 4. 海底の岩場・砂地（深海グラデーション）
      const seabedGrad = ctx.createLinearGradient(0, GAME_HEIGHT - 60, 0, GAME_HEIGHT);
      seabedGrad.addColorStop(0, '#0c3552');
      seabedGrad.addColorStop(1, '#020b14');
      ctx.fillStyle = seabedGrad;
      ctx.beginPath();
      ctx.moveTo(0, GAME_HEIGHT);
      seabedPoints.forEach(pt => ctx.lineTo(pt.x, pt.y));
      ctx.lineTo(GAME_WIDTH, GAME_HEIGHT);
      ctx.closePath();
      ctx.fill();

      // 5. 環境泡（ラジアルグラデーションで立体感と輝き）
      bgBubbles.forEach(b => {
        const bubbleGrad = ctx.createRadialGradient(
          b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.1,
          b.x, b.y, b.radius
        );
        bubbleGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
        bubbleGrad.addColorStop(0.4, 'rgba(180, 245, 255, 0.4)');
        bubbleGrad.addColorStop(1, 'rgba(0, 180, 255, 0.1)');

        ctx.fillStyle = bubbleGrad;
        ctx.strokeStyle = 'rgba(200, 250, 255, 0.7)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      // 6. アクション泡の描画
      actionBubbles.forEach(ab => {
        ctx.strokeStyle = `rgba(0, 243, 255, ${ab.alpha * 0.8})`;
        ctx.fillStyle = `rgba(220, 255, 255, ${ab.alpha * 0.4})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(ab.x, ab.y, Math.max(0.1, ab.radius), 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        // 7. 魚雷（バブル＆エネルギー発光グラデーション）
        bullets.forEach(b => {
          const bulletGrad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius);
          bulletGrad.addColorStop(0, '#ffffff');
          bulletGrad.addColorStop(0.4, CONFIG.bulletGradient[0]);
          bulletGrad.addColorStop(1, CONFIG.bulletGradient[1]);

          ctx.fillStyle = bulletGrad;
          ctx.shadowBlur = 15;
          ctx.shadowColor = CONFIG.bulletGradient[0];
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        // 8. 敵（深海生物：線形グラデーション＋発光）
        enemies.forEach(e => {
          const enemyGrad = ctx.createLinearGradient(e.x - e.radius, e.y, e.x + e.radius, e.y);
          enemyGrad.addColorStop(0, CONFIG.enemyGradient[0]);
          enemyGrad.addColorStop(1, CONFIG.enemyGradient[1]);

          ctx.fillStyle = enemyGrad;
          ctx.shadowBlur = 12;
          ctx.shadowColor = CONFIG.enemyGradient[0];

          // 魚の体
          ctx.beginPath();
          ctx.ellipse(e.x, e.y, e.radius, e.radius * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();
          // 尾びれ
          ctx.beginPath();
          ctx.moveTo(e.x + e.radius * 0.8, e.y);
          ctx.lineTo(e.x + e.radius * 1.6, e.y - e.radius * 0.6);
          ctx.lineTo(e.x + e.radius * 1.6, e.y + e.radius * 0.6);
          ctx.closePath();
          ctx.fill();
          // つぶらな目（ハイライト付き）
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(e.x - e.radius * 0.4, e.y - e.radius * 0.2, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(e.x - e.radius * 0.4 - 1, e.y - e.radius * 0.2, 1.5, 0, Math.PI * 2);
          ctx.fill();
        });

        // 9. 潜水艦（自機：金属質感グラデーション＆サーチライト）
        const pGrad = ctx.createLinearGradient(player.x - player.radius, player.y - player.radius, player.x + player.radius, player.y + player.radius);
        pGrad.addColorStop(0, CONFIG.playerGradient[0]);
        pGrad.addColorStop(1, CONFIG.playerGradient[1]);

        ctx.fillStyle = pGrad;
        ctx.shadowBlur = 15;
        ctx.shadowColor = CONFIG.playerGradient[0];

        // 潜水艦本体
        ctx.beginPath();
        ctx.ellipse(player.x, player.y, player.radius * 1.2, player.radius * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();

        // 潜望鏡
        ctx.fillRect(player.x - 6, player.y - player.radius - 2, 12, 10);

        // 窓（グラデーション発光）
        const windowGrad = ctx.createRadialGradient(player.x + 8, player.y - 2, 0, player.x + 8, player.y - 2, 5);
        windowGrad.addColorStop(0, '#ffffff');
        windowGrad.addColorStop(1, '#00ffff');
        ctx.fillStyle = windowGrad;
        ctx.beginPath();
        ctx.arc(player.x + 8, player.y - 2, 5, 0, Math.PI * 2);
        ctx.fill();

        // 前方サーチライトの照射光（円錐グラデーション）
        const lightGrad = ctx.createLinearGradient(player.x + player.radius, player.y, player.x + player.radius + 150, player.y);
        lightGrad.addColorStop(0, 'rgba(0, 255, 255, 0.4)');
        lightGrad.addColorStop(1, 'rgba(0, 255, 255, 0.0)');

        ctx.shadowBlur = 0;
        ctx.fillStyle = lightGrad;
        ctx.beginPath();
        ctx.moveTo(player.x + player.radius, player.y);
        ctx.lineTo(player.x + player.radius + 150, player.y - 40);
        ctx.lineTo(player.x + player.radius + 150, player.y + 40);
        ctx.closePath();
        ctx.fill();
      }
    }

    // ==========================================
    // メインゲームループ
    // ==========================================
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    // ループ開始
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
