<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>東方風・参道弾幕絵巻</title>
  <style>
    /* =========================================================
       基本スタイル & レスポンシブ設定 (和風アニメテイスト)
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #080312;
      color: #fff;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', '游明朝', serif;
      overflow: hidden;
      touch-action: none; /* スマホでのブラウザスクロールや拡大を防止 */
    }

    /* 全体を画面中央に配置するラッパー */
    #game-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: radial-gradient(circle, #180829 0%, #030108 100%);
    }

    /* 960x540 の固定ゲームワールドコンテナ */
    #game-container {
      width: 960px;
      height: 540px;
      position: relative;
      overflow: hidden;
      background-color: #120826;
      box-shadow: 0 0 50px rgba(255, 75, 92, 0.4), 0 0 100px rgba(18, 8, 38, 0.9);
      border-radius: 12px;
      border: 2px solid rgba(255, 215, 0, 0.4);
      transform-origin: center center;
    }

    /* Canvas 描画領域 */
    #gameCanvas {
      width: 960px;
      height: 540px;
      display: block;
    }

    /* =========================================================
       UI レイヤー (タイトル、HUD、ゲームオーバー等)
       ========================================================= */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .interactive {
      pointer-events: auto;
    }

    /* 和風アニメ風タイトルデザイン */
    .shrine-title {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 
        0 0 8px #fff,
        0 0 18px #ff2a5f,
        0 0 35px #ff2a5f,
        0 0 60px #ff0055;
      margin-bottom: 8px;
    }

    .shrine-subtitle {
      font-size: 20px;
      font-weight: bold;
      color: #ffe600;
      text-shadow: 0 0 12px rgba(255, 230, 0, 0.9), 2px 2px 4px #000;
      margin-bottom: 30px;
    }

    /* 和風ネオン風ボタン */
    .btn {
      background: linear-gradient(135deg, #d62828 0%, #800f2f 100%);
      border: 2px solid #ffe600;
      color: #ffffff;
      padding: 14px 42px;
      font-size: 22px;
      font-weight: bold;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 75, 92, 0.6), inset 0 0 10px rgba(255, 230, 0, 0.4);
      transition: all 0.25s ease;
      margin: 8px;
      outline: none;
      text-shadow: 1px 1px 3px #000;
    }

    .btn:hover, .btn:active {
      background: linear-gradient(135deg, #ff4b5c 0%, #c9184a 100%);
      box-shadow: 0 0 30px rgba(255, 230, 0, 0.9), inset 0 0 15px #fff;
      transform: scale(1.06);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #2b1e3a 0%, #150d2a 100%);
      border-color: #ff4b5c;
      box-shadow: 0 0 15px rgba(255, 75, 92, 0.4);
      font-size: 16px;
      padding: 10px 28px;
    }

    /* HUD (ゲーム画面上の情報表示) */
    #hud {
      position: absolute;
      top: 18px;
      left: 25px;
      right: 25px;
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: bold;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      color: #ffffff;
      text-shadow: 0 0 10px #ff4b5c, 2px 2px 4px #000;
      z-index: 15;
    }

    .hud-box {
      background: rgba(18, 8, 38, 0.7);
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 230, 0, 0.5);
    }

    /* 右下 FIRE ボタン (祓霊符風) */
    #fire-btn {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff4b5c 0%, #800f2f 75%);
      border: 3px solid #ffe600;
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(255, 75, 92, 0.8), inset 0 0 12px rgba(255, 230, 0, 0.6);
      z-index: 20;
      user-select: none;
      touch-action: none;
      text-shadow: 0 0 8px #000;
    }

    #fire-btn:active {
      background: radial-gradient(circle, #ffe600 0%, #ff4b5c 80%);
      color: #800f2f;
      transform: scale(0.92);
      box-shadow: 0 0 35px #ffe600;
    }

    /* 操作ガイド */
    .controls-hint {
      font-size: 14px;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      color: #d1c4e9;
      margin-top: 15px;
      text-align: center;
      line-height: 1.7;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* 縦画面警告オーバーレイ */
    #portrait-warning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0c0517;
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      color: #fff;
    }

    #portrait-warning .icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: rotate-hint 2.5s infinite ease-in-out;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
  </style>
</head>
<body>

  <!-- スマホ縦画面時の警告 -->
  <div id="portrait-warning">
    <div class="icon">⛩️↻</div>
    <h2 style="font-size: 26px; color: #ffe600;">画面を横にしてね</h2>
    <p style="margin-top: 12px; color: #b3a2c7;">スマートフォンを横向きにすると参道が開きます</p>
  </div>

  <!-- ゲーム全体ラッパー -->
  <div id="game-wrapper">
    <!-- 960x540 ゲーム本体コンテナ -->
    <div id="game-container">
      
      <!-- Canvas 描画スクリーン -->
      <canvas id="gameCanvas" width="960" height="540"></canvas>

      <!-- プレイ中の HUD -->
      <div id="hud" style="display: none;">
        <div class="hud-box">TIME: <span id="time-val" style="color: #ffe600;">0.0</span>s</div>
        <div class="hud-box">HIT: <span id="score-val" style="color: #ff4b5c;">0</span></div>
      </div>

      <!-- タッチ用 FIRE ボタン -->
      <div id="fire-btn" class="interactive" style="display: none;">祓霊</div>

      <!-- タイトル画面 UI -->
      <div id="ui-title" class="ui-layer">
        <h1 class="shrine-title" id="title-text">東方風・参道弾幕絵巻</h1>
        <p class="shrine-subtitle" id="subtitle-text">〜 絢爛たる妖弾を避け祓え！本格和風弾幕戦 〜</p>
        
        <button id="start-btn" class="btn interactive">参拝開始 (PLAY)</button>
        <button id="fullscreen-btn" class="btn btn-secondary interactive">FULL SCREEN</button>

        <div class="controls-hint">
          【操作方法】<br>
          自機移動：上下ドラッグ / 指でスライド / 矢印キー / [W][S]<br>
          破魔弾発射：画面タップ / [祓霊]ボタン / [SPACE]キー<br>
          <span style="color: #ffe600;">※自機中心の赤い点（判定）に弾が当たると判定されます</span>
        </div>
      </div>

      <!-- ゲームオーバー画面 UI -->
      <div id="ui-gameover" class="ui-layer" style="display: none;">
        <h1 class="shrine-title" style="color: #ff4b5c; text-shadow: 0 0 25px #ff0055;">妖弾被弾...</h1>
        <p style="font-size: 24px; margin-bottom: 10px; color: #fff;">妖怪撃破数 (HIT): <span id="final-score" style="color: #ffe600; font-weight: bold;">0</span> 匹</p>
        <p style="font-size: 24px; margin-bottom: 30px; color: #fff;">生存時間 (TIME): <span id="final-time" style="color: #ff4b5c; font-weight: bold;">0.0</span> 秒</p>
        <button id="retry-btn" class="btn interactive">再挑戦 (RETRY)</button>
      </div>

    </div>
  </div>

  <script>
    /* =========================================================
       ★ 体験授業用 CONFIG オブジェクト (弾幕カスタマイズ) ★
       ========================================================= */
    const CONFIG = {
      // --- 基本テキスト ---
      TITLE: '東方風・参道弾幕絵巻',
      SUBTITLE: '〜 絢爛たる妖弾を避け祓え！本格和風弾幕戦 〜',

      // --- テーマカラー ---
      BG_COLOR: '#120826',        // 夜の参道・背景ベース色
      PLAYER_COLOR: '#ff4b5c',    // 自機（式神のお札・朱色）
      ENEMY_COLOR: '#00f0ff',     // 敵（鬼火・青緑の妖火）
      BULLET_COLOR: '#ffe600',    // 自機破魔弾（輝く黄色）

      // --- 弾幕・難易度設定 ---
      ENEMY_SPEED: 2.2,           // 敵の出現移動スピード
      SPAWN_INTERVAL: 1400,       // 敵の出現間隔 (ミリ秒)
      BULLET_SPEED: 14,           // 自機破魔弾の飛行速度
      FOLLOW_SPEED: 0.22,         // 自機の指/キー追従速度
      
      // 敵弾幕設定
      ENEMY_BULLET_SPEED: 3.2,    // 敵弾の飛行速度
      ENEMY_SHOOT_INTERVAL: 45,   // 敵の発射クールダウン(フレーム数)
      BULLET_HELL_MODE: 1.0       // 弾幕密度係数
    };

    /* =========================================================
       ゲームエンジン & システム変数
       ========================================================= */

    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;

    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const uiTitle = document.getElementById('ui-title');
    const uiGameOver = document.getElementById('ui-gameover');
    const hud = document.getElementById('hud');
    const fireBtn = document.getElementById('fire-btn');
    const scoreVal = document.getElementById('score-val');
    const timeVal = document.getElementById('time-val');
    const finalScore = document.getElementById('final-score');
    const finalTime = document.getElementById('final-time');

    // ゲーム状態
    let gameState = 'TITLE'; // 'TITLE', 'PLAYING', 'GAMEOVER'
    let currentScale = 1;
    let score = 0;
    let startTime = 0;
    let elapsedTime = 0;
    let lastSpawnTime = 0;
    let isPaused = false;
    let frameCount = 0;

    // 自機（喰らい判定は半径 5px と極小にして避けやすくする）
    let player = { 
      x: 120, 
      y: 270, 
      targetY: 270, 
      visualRadius: 22,
      hitRadius: 5 // 弾幕ゲー特有の極小判定
    };

    // 配列管理
    let playerBullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let petals = [];
    let toriiGates = [];
    let lanterns = [];

    // 操作状態
    let isFiring = false;
    let fireCooldown = 0;
    let keys = {};

    document.getElementById('title-text').textContent = CONFIG.TITLE;
    document.getElementById('subtitle-text').textContent = CONFIG.SUBTITLE;

    /* ---------------------------------------------------------
       1. 画面リサイズ ＆ 座標系変換
       --------------------------------------------------------- */
    function fitScreen() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      const isPortrait = windowHeight > windowWidth;
      document.getElementById('portrait-warning').style.display = isPortrait ? 'flex' : 'none';
      isPaused = isPortrait;

      const scaleX = windowWidth / GAME_WIDTH;
      const scaleY = windowHeight / GAME_HEIGHT;
      currentScale = Math.min(scaleX, scaleY);

      container.style.transform = `scale(${currentScale})`;
    }

    window.addEventListener('resize', fitScreen);
    window.addEventListener('orientationchange', fitScreen);
    fitScreen();

    function getGameCoordinates(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (GAME_WIDTH / rect.width),
        y: (clientY - rect.top) * (GAME_HEIGHT / rect.height)
      };
    }

    /* ---------------------------------------------------------
       2. 背景描画 (アニメ調・参道・神社・舞い散る桜)
       --------------------------------------------------------- */
    function initBackgroundElements() {
      petals = [];
      for (let i = 0; i < 50; i++) {
        petals.push({
          x: Math.random() * GAME_WIDTH,
          y: Math.random() * GAME_HEIGHT,
          size: Math.random() * 5 + 4,
          speedX: -(Math.random() * 2 + 1.5),
          speedY: Math.random() * 1.2 + 0.6,
          angle: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.05
        });
      }

      toriiGates = [];
      for (let i = 0; i < 5; i++) {
        toriiGates.push({ x: 200 + i * 220 });
      }

      lanterns = [];
      for (let i = 0; i < 7; i++) {
        lanterns.push({ x: 100 + i * 160 });
      }
    }

    function drawBackground() {
      // 空のグラデーション
      const skyGradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
      skyGradient.addColorStop(0.0, '#0a0318');
      skyGradient.addColorStop(0.4, '#240a35');
      skyGradient.addColorStop(0.7, '#571336');
      skyGradient.addColorStop(0.88, '#9c2f42');
      skyGradient.addColorStop(1.0, '#120826');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // 満月
      ctx.save();
      const moonX = 780;
      const moonY = 110;
      const moonGlow = ctx.createRadialGradient(moonX, moonY, 15, moonX, moonY, 110);
      moonGlow.addColorStop(0, 'rgba(255, 255, 220, 0.9)');
      moonGlow.addColorStop(0.3, 'rgba(255, 200, 140, 0.4)');
      moonGlow.addColorStop(1, 'rgba(255, 180, 100, 0)');
      ctx.fillStyle = moonGlow;
      ctx.beginPath();
      ctx.arc(moonX, moonY, 110, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fffae6';
      ctx.beginPath();
      ctx.arc(moonX, moonY, 38, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 遠景の山脈＆五重塔
      ctx.save();
      ctx.fillStyle = '#180828';
      ctx.beginPath();
      ctx.moveTo(0, 420);
      ctx.quadraticCurveTo(180, 330, 360, 390);
      ctx.quadraticCurveTo(540, 310, 720, 380);
      ctx.quadraticCurveTo(840, 340, 960, 410);
      ctx.lineTo(960, 540);
      ctx.lineTo(0, 540);
      ctx.closePath();
      ctx.fill();

      const pagX = 700;
      const pagY = 325;
      ctx.fillStyle = '#10041d';
      for (let i = 0; i < 5; i++) {
        const w = 36 - i * 5;
        const h = 12;
        const y = pagY - i * 16;
        ctx.fillRect(pagX - w / 2, y, w, h);
        ctx.beginPath();
        ctx.moveTo(pagX - w / 2 - 8, y + 2);
        ctx.lineTo(pagX + w / 2 + 8, y + 2);
        ctx.lineTo(pagX, y - 4);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillRect(pagX - 2, pagY - 88, 4, 18);
      ctx.restore();

      // 参道床
      const groundY = 460;
      ctx.fillStyle = '#1c0e31';
      ctx.fillRect(0, groundY, GAME_WIDTH, GAME_HEIGHT - groundY);

      ctx.strokeStyle = 'rgba(255, 215, 0, 0.18)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(GAME_WIDTH, groundY);
      ctx.stroke();

      // 鳥居
      const speed = (gameState === 'PLAYING' && !isPaused) ? 1.8 : 0.4;
      toriiGates.forEach(gate => {
        if (gameState === 'PLAYING' && !isPaused) {
          gate.x -= speed;
          if (gate.x < -80) gate.x = GAME_WIDTH + 60;
        }

        ctx.save();
        ctx.translate(gate.x, groundY);
        ctx.fillStyle = '#c92a2a';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff4b5c';
        ctx.fillRect(-28, -130, 8, 130);
        ctx.fillRect(20, -130, 8, 130);
        ctx.fillRect(-34, -100, 68, 7);
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-38, -138, 76, 10);
        ctx.fillStyle = '#d62828';
        ctx.fillRect(-35, -132, 70, 6);
        ctx.fillStyle = '#111';
        ctx.fillRect(-4, -130, 8, 22);
        ctx.restore();
      });

      // 石灯籠
      lanterns.forEach(lan => {
        if (gameState === 'PLAYING' && !isPaused) {
          lan.x -= speed * 1.2;
          if (lan.x < -40) lan.x = GAME_WIDTH + 40;
        }

        ctx.save();
        ctx.translate(lan.x, groundY + 10);
        ctx.fillStyle = '#292336';
        ctx.fillRect(-8, -25, 16, 25);
        ctx.fillRect(-12, -30, 24, 6);
        ctx.fillStyle = '#ffe600';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffe600';
        ctx.fillRect(-7, -42, 14, 12);
        ctx.fillStyle = '#1a1624';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(-16, -42);
        ctx.lineTo(16, -42);
        ctx.lineTo(0, -52);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // 舞い散る桜
      petals.forEach(p => {
        if (gameState === 'PLAYING' && !isPaused) {
          p.x += p.speedX;
          p.y += p.speedY;
          p.angle += p.rotSpeed;

          if (p.x < -10) p.x = GAME_WIDTH + 10;
          if (p.y > GAME_HEIGHT + 10) p.y = -10;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = '#ffb7c5';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff4b5c';
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.quadraticCurveTo(p.size, -p.size / 2, p.size / 2, p.size);
        ctx.quadraticCurveTo(0, p.size / 2, -p.size / 2, p.size);
        ctx.quadraticCurveTo(-p.size, -p.size / 2, 0, -p.size);
        ctx.fill();
        ctx.restore();
      });
    }

    /* ---------------------------------------------------------
       3. パーティクル (爆発・消滅)
       --------------------------------------------------------- */
    function createExplosion(x, y, color, count = 22) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 4 + 2,
          alpha: 1.0,
          color: color || CONFIG.ENEMY_COLOR
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.035;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    /* ---------------------------------------------------------
       4. 入力ハンドラー
       --------------------------------------------------------- */
    function handlePointerMove(e) {
      if (gameState !== 'PLAYING' || isPaused) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const coords = getGameCoordinates(clientX, clientY);
      player.targetY = Math.max(35, Math.min(GAME_HEIGHT - 35, coords.y));
    }

    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', (e) => {
      handlePointerMove(e);
      e.preventDefault();
    }, { passive: false });

    function handlePointerDown(e) {
      if (gameState !== 'PLAYING' || isPaused) return;
      if (e.target !== fireBtn) {
        handlePointerMove(e);
        shootPlayerBullet();
      }
    }

    window.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('touchstart', (e) => {
      handlePointerDown(e);
    }, { passive: false });

    fireBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      isFiring = true;
      shootPlayerBullet();
    });
    fireBtn.addEventListener('pointerup', () => { isFiring = false; });
    fireBtn.addEventListener('pointerleave', () => { isFiring = false; });

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && gameState === 'PLAYING') {
        shootPlayerBullet();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function shootPlayerBullet() {
      if (fireCooldown <= 0) {
        // 自機ショット：メイン弾2発＋上下拡散
        playerBullets.push({ x: player.x + 25, y: player.y - 8, vx: CONFIG.BULLET_SPEED, vy: 0, radius: 6 });
        playerBullets.push({ x: player.x + 25, y: player.y + 8, vx: CONFIG.BULLET_SPEED, vy: 0, radius: 6 });
        playerBullets.push({ x: player.x + 20, y: player.y - 12, vx: CONFIG.BULLET_SPEED * 0.9, vy: -1.8, radius: 5 });
        playerBullets.push({ x: player.x + 20, y: player.y + 12, vx: CONFIG.BULLET_SPEED * 0.9, vy: 1.8, radius: 5 });
        
        fireCooldown = 7; // 連射間隔
      }
    }

    /* ---------------------------------------------------------
       5. 弾幕生成ロジック (多種多様な高密度妖弾)
       --------------------------------------------------------- */
    function spawnEnemyBulletPattern(enemy) {
      const spd = CONFIG.ENEMY_BULLET_SPEED;
      const ex = enemy.x;
      const ey = enemy.y + Math.sin(enemy.floatOffset) * 12;

      // 弾幕パターン種別 (敵の種類ごとに決定)
      switch (enemy.patternType) {
        case 0: {
          // ★ パターン1: 扇状5WAY〜7WAY 弾幕
          const wayCount = 7;
          const spreadAngle = Math.PI / 3.5; // 広がり角
          const baseAngle = Math.atan2(player.y - ey, player.x - ex); // 自機方向

          for (let i = 0; i < wayCount; i++) {
            const angle = baseAngle - spreadAngle / 2 + (spreadAngle / (wayCount - 1)) * i;
            enemyBullets.push({
              x: ex,
              y: ey,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd,
              radius: 6,
              color: '#ff2a5f',
              glow: '#ff0055'
            });
          }
          break;
        }

        case 1: {
          // ★ パターン2: 全方位12連サークルリング弾
          const ringCount = 12;
          for (let i = 0; i < ringCount; i++) {
            const angle = (Math.PI * 2 / ringCount) * i + (enemy.shootCount * 0.2);
            enemyBullets.push({
              x: ex,
              y: ey,
              vx: Math.cos(angle) * (spd * 0.85),
              vy: Math.sin(angle) * (spd * 0.85),
              radius: 5,
              color: '#00f0ff',
              glow: '#00aaff'
            });
          }
          break;
        }

        case 2: {
          // ★ パターン3: 旋回スパイラル螺旋弾幕 (高頻度連写)
          const angle = (enemy.shootCount * 0.35);
          enemyBullets.push({
            x: ex,
            y: ey,
            vx: Math.cos(angle) * spd * 1.1,
            vy: Math.sin(angle) * spd * 1.1,
            radius: 7,
            color: '#ffe600',
            glow: '#ff9900'
          });
          enemyBullets.push({
            x: ex,
            y: ey,
            vx: Math.cos(angle + Math.PI) * spd * 1.1,
            vy: Math.sin(angle + Math.PI) * spd * 1.1,
            radius: 7,
            color: '#ffe600',
            glow: '#ff9900'
          });
          break;
        }

        case 3: {
          // ★ パターン4: 3連高速自機狙い狙撃弾
          const baseAngle = Math.atan2(player.y - ey, player.x - ex);
          for (let i = -1; i <= 1; i++) {
            const angle = baseAngle + (i * 0.12);
            enemyBullets.push({
              x: ex,
              y: ey,
              vx: Math.cos(angle) * (spd * 1.3),
              vy: Math.sin(angle) * (spd * 1.3),
              radius: 8,
              color: '#a000ff',
              glow: '#d000ff'
            });
          }
          break;
        }
      }

      enemy.shootCount++;
    }

    /* ---------------------------------------------------------
       6. ゲーム更新 ＆ 当たり判定
       --------------------------------------------------------- */
    function resetGame() {
      score = 0;
      startTime = Date.now();
      lastSpawnTime = Date.now();
      elapsedTime = 0;
      fireCooldown = 0;
      frameCount = 0;

      player.x = 120;
      player.y = GAME_HEIGHT / 2;
      player.targetY = GAME_HEIGHT / 2;

      playerBullets = [];
      enemyBullets = [];
      enemies = [];
      particles = [];

      scoreVal.textContent = "0";
      timeVal.textContent = "0.0";
    }

    function startGame() {
      resetGame();
      gameState = 'PLAYING';
      uiTitle.style.display = 'none';
      uiGameOver.style.display = 'none';
      hud.style.display = 'flex';
      fireBtn.style.display = 'flex';
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      hud.style.display = 'none';
      fireBtn.style.display = 'none';

      finalScore.textContent = score;
      finalTime.textContent = elapsedTime.toFixed(1);
      uiGameOver.style.display = 'flex';
    }

    function spawnEnemy() {
      const radius = Math.random() * 8 + 20;
      enemies.push({
        x: GAME_WIDTH + radius + 20,
        y: Math.random() * (GAME_HEIGHT - 140) + 50,
        radius: radius,
        speed: CONFIG.ENEMY_SPEED + (Math.random() * 1.0 - 0.3),
        floatOffset: Math.random() * Math.PI * 2,
        floatSpeed: Math.random() * 0.05 + 0.03,
        patternType: Math.floor(Math.random() * 4), // 弾幕パターンの決定
        shootTimer: Math.floor(Math.random() * 20),
        shootCount: 0,
        hp: 3 // 少し硬くして弾幕を出させる
      });
    }

    function update() {
      if (gameState !== 'PLAYING' || isPaused) return;

      frameCount++;
      elapsedTime = (Date.now() - startTime) / 1000;
      timeVal.textContent = elapsedTime.toFixed(1);

      // キーボード移動
      const kbSpeed = 8;
      if (keys['ArrowUp'] || keys['KeyW']) player.targetY -= kbSpeed;
      if (keys['ArrowDown'] || keys['KeyS']) player.targetY += kbSpeed;
      player.targetY = Math.max(35, Math.min(GAME_HEIGHT - 35, player.targetY));

      // 自機スムーズ移動
      player.y += (player.targetY - player.y) * CONFIG.FOLLOW_SPEED;

      // 自機連射
      if (fireCooldown > 0) fireCooldown--;
      if ((isFiring || keys['Space']) && fireCooldown <= 0) {
        shootPlayerBullet();
      }

      // 1. 自機弾の更新
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x > GAME_WIDTH + 30 || b.y < -20 || b.y > GAME_HEIGHT + 20) {
          playerBullets.splice(i, 1);
        }
      }

      // 2. 敵の出現管理
      if (Date.now() - lastSpawnTime > CONFIG.SPAWN_INTERVAL) {
        spawnEnemy();
        lastSpawnTime = Date.now();
      }

      // 3. 敵（妖怪）の動作 ＆ 弾幕発射処理
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x -= e.speed;
        e.floatOffset += e.floatSpeed;
        const currentY = e.y + Math.sin(e.floatOffset) * 12;

        // 画面内での弾幕発射カウントダウン
        if (e.x < GAME_WIDTH - 20 && e.x > 80) {
          e.shootTimer++;
          
          // 弾幕発射頻度 (CONFIGのENEMY_SHOOT_INTERVAL)
          const interval = (e.patternType === 2) ? 12 : CONFIG.ENEMY_SHOOT_INTERVAL;
          if (e.shootTimer >= interval) {
            spawnEnemyBulletPattern(e);
            e.shootTimer = 0;
          }
        }

        // 画面外脱出
        if (e.x < -e.radius - 40) {
          enemies.splice(i, 1);
          continue;
        }

        // 自機と敵本体の直接衝突判定
        const distToPlayer = Math.hypot(e.x - player.x, currentY - player.y);
        if (distToPlayer < e.radius + player.hitRadius) {
          createExplosion(player.x, player.y, CONFIG.PLAYER_COLOR, 35);
          createExplosion(e.x, currentY, CONFIG.ENEMY_COLOR, 35);
          gameOver();
          return;
        }

        // 自機弾 vs 敵の衝突判定
        for (let j = playerBullets.length - 1; j >= 0; j--) {
          const pb = playerBullets[j];
          const distToBullet = Math.hypot(e.x - pb.x, currentY - pb.y);

          if (distToBullet < e.radius + pb.radius) {
            createExplosion(pb.x, pb.y, '#ffe600', 6);
            playerBullets.splice(j, 1);
            
            e.hp--;
            if (e.hp <= 0) {
              createExplosion(e.x, currentY, CONFIG.ENEMY_COLOR, 30);
              createExplosion(e.x, currentY, '#ffe600', 15);
              enemies.splice(i, 1);
              score++;
              scoreVal.textContent = score;
              break;
            }
          }
        }
      }

      // 4. 敵弾（弾幕）の更新 ＆ 自機との当たり判定
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        // 画面外消去
        if (eb.x < -30 || eb.x > GAME_WIDTH + 30 || eb.y < -30 || eb.y > GAME_HEIGHT + 30) {
          enemyBullets.splice(i, 1);
          continue;
        }

        // ★ 弾幕判定: 敵弾 vs 自機判定点 (player.hitRadius) ★
        const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
        if (dist < eb.radius + player.hitRadius) {
          // 被弾・爆発・ゲームオーバー
          createExplosion(player.x, player.y, '#ff0055', 40);
          createExplosion(player.x, player.y, '#ffe600', 25);
          gameOver();
          return;
        }
      }
    }

    /* ---------------------------------------------------------
       7. 描画処理 (弾幕・自機・判定表示)
       --------------------------------------------------------- */
    function draw() {
      drawBackground();
      updateAndDrawParticles();

      if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        
        // A. 自機ショット描画
        playerBullets.forEach(b => {
          ctx.save();
          ctx.shadowBlur = 12;
          ctx.shadowColor = CONFIG.BULLET_COLOR;
          ctx.fillStyle = CONFIG.BULLET_COLOR;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // B. 敵（鬼火・妖魔）描画
        enemies.forEach(e => {
          const currentY = e.y + Math.sin(e.floatOffset) * 12;

          ctx.save();
          ctx.translate(e.x, currentY);

          ctx.shadowBlur = 22;
          ctx.shadowColor = CONFIG.ENEMY_COLOR;

          const flameGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, e.radius);
          flameGrad.addColorStop(0, '#ffffff');
          flameGrad.addColorStop(0.4, CONFIG.ENEMY_COLOR);
          flameGrad.addColorStop(1, 'rgba(0, 50, 150, 0)');
          
          ctx.fillStyle = flameGrad;
          ctx.beginPath();
          ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
          ctx.fill();

          // 妖火のメラメラした尾
          ctx.fillStyle = CONFIG.ENEMY_COLOR;
          ctx.beginPath();
          ctx.moveTo(0, -e.radius * 0.7);
          ctx.quadraticCurveTo(e.radius * 1.5, 0, e.radius * 0.8, e.radius * 0.7);
          ctx.quadraticCurveTo(0, e.radius * 0.3, 0, -e.radius * 0.7);
          ctx.fill();

          ctx.restore();
        });

        // C. 敵弾幕（高輝度ネオン妖弾）描画
        enemyBullets.forEach(eb => {
          ctx.save();
          ctx.translate(eb.x, eb.y);

          ctx.shadowBlur = 14;
          ctx.shadowColor = eb.glow || '#ff0055';

          // 弾の外枠・オーラ
          ctx.fillStyle = eb.color || '#ff2a5f';
          ctx.beginPath();
          ctx.arc(0, 0, eb.radius, 0, Math.PI * 2);
          ctx.fill();

          // 弾の中心（白く光る核）
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, eb.radius * 0.45, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        });

        // D. 自機（式神・お札）＆ 喰らい判定表示
        if (gameState === 'PLAYING') {
          ctx.save();
          ctx.translate(player.x, player.y);

          // 式神の霊力オーラ
          ctx.shadowBlur = 18;
          ctx.shadowColor = CONFIG.PLAYER_COLOR;
          
          const tailGrad = ctx.createLinearGradient(0, 0, -45, 0);
          tailGrad.addColorStop(0, CONFIG.PLAYER_COLOR);
          tailGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = tailGrad;
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.lineTo(-45, 0);
          ctx.lineTo(0, 10);
          ctx.closePath();
          ctx.fill();

          // お札本体
          ctx.rotate(0.08);
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = CONFIG.PLAYER_COLOR;
          ctx.lineWidth = 2.5;
          ctx.fillRect(-14, -22, 28, 44);
          ctx.strokeRect(-14, -22, 28, 44);

          // 呪印
          ctx.fillStyle = CONFIG.PLAYER_COLOR;
          ctx.fillRect(-6, -16, 12, 5);
          ctx.fillRect(-3, -8, 6, 18);
          ctx.fillRect(-8, 2, 16, 3);
          ctx.fillRect(-8, 10, 16, 3);

          ctx.restore();

          // ★ 弾幕ゲー必須：自機の喰らい判定ポイント描画（中央に赤く輝く点） ★
          ctx.save();
          ctx.translate(player.x, player.y);
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#ff0000';
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#ff0055';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, player.hitRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    /* ---------------------------------------------------------
       8. 主ループ
       --------------------------------------------------------- */
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    initBackgroundElements();
    requestAnimationFrame(gameLoop);

    /* ---------------------------------------------------------
       9. ボタンイベントハンドラ
       --------------------------------------------------------- */
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('retry-btn').addEventListener('click', startGame);

    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      const target = document.documentElement;
      if (!document.fullscreenElement) {
        if (target.requestFullscreen) {
          target.requestFullscreen();
        } else if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });
  </script>
