<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>クリスマス・スペシャルシューティング</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #030814;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        #game-viewport {
            position: relative;
            width: 960px;
            height: 540px;
            background-color: #081226;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(8, 18, 38, 0.9);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 48px;
            color: #ff3344;
            text-shadow: 0 0 10px #ff3344, 0 0 20px #22aa33, 0 0 30px #ffd700;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
        }

        .instruction {
            font-size: 15px;
            color: #e0f2fe;
            margin-bottom: 25px;
            text-align: left;
            line-height: 1.7;
            background: rgba(255, 255, 255, 0.08);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            max-width: 600px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 32px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #d32f2f, #2e7d32);
            border: 2px solid #ffd700;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #37474f, #546e7a);
            border-color: #aaa;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            z-index: 5;
        }

        #item-status {
            position: absolute;
            top: 48px;
            left: 20px;
            font-size: 16px;
            color: #76ff03;
            font-weight: bold;
            text-shadow: 0 0 8px #000;
            pointer-events: none;
            z-index: 5;
        }

        #fire-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff5252 0%, #b71c1c 100%);
            border: 3px solid #ffd700;
            color: white;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 82, 82, 0.7);
            z-index: 6;
            touch-action: none;
        }

        #fire-btn:active {
            transform: scale(0.92);
        }

        #rotate-notice {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #030814;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="rotate-notice" class="hidden">
        <div style="font-size:60px; margin-bottom:20px;">🎄📱</div>
        <h2>画面を横向きにしてください</h2>
    </div>

    <div id="game-container">
        <div id="game-viewport">
            <canvas id="gameCanvas" width="960" height="540"></canvas>

            <div id="hud">
                <div id="time-display">TIME: 0.0s</div>
                <div id="hit-display">HIT: 0</div>
            </div>
            <div id="item-status"></div>

            <div id="fire-btn">FIRE</div>

            <div id="title-screen" class="overlay">
                <h1 id="title-text">XMAS PARTY SHOOTER</h1>
                <div class="instruction">
                    🎄 <b>クリスマスアイテム一覧</b><br>
                    🎁 <b>プレゼント</b>: 3方向ショット発射！<br>
                    🔔 <b>ベル</b>: 1回攻撃を防ぐバリア装着！<br>
                    🍰 <b>ケーキ</b>: 敵全体を5秒間フリーズ＆減速！<br>
                    🌟 <b>スター</b>: 画面の敵を一斉撃破（ボム効果）！<br><br>
                    ・操作: 上下ドラッグ移動 / Tap, FIRE, Spaceで発射
                </div>
                <div class="btn-group">
                    <button id="start-btn">PLAY</button>
                    <button id="fullscreen-btn" class="btn-secondary">FULL SCREEN</button>
                </div>
            </div>

            <div id="gameover-screen" class="overlay hidden">
                <h1 style="color: #ff5252;">MERRY CHRISTMAS!</h1>
                <div class="instruction" id="result-text" style="text-align:center;"></div>
                <button id="retry-btn">RETRY</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIG (体験授業用パラメータ)
        // ==========================================
        const CONFIG = {
            title: "XMAS PARTY SHOOTER",
            bgColor: "#081226",
            playerColor: "#ff3344",     // サンタレッド
            enemyColor: "#2e7d32",      // ツリーグリーン
            bulletColor: "#ffd700",     // ゴールド
            enemySpeed: 240,
            spawnInterval: 0.85,
            itemInterval: 3.5,          // アイテムの流れてくる間隔(秒)
            bulletSpeed: 750,
            followSpeed: 16.0
        };

        const GAME_WIDTH = 960;
        const GAME_HEIGHT = 540;

        const container = document.getElementById('game-container');
        const viewport = document.getElementById('game-viewport');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const titleScreen = document.getElementById('title-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const rotateNotice = document.getElementById('rotate-notice');
        const titleText = document.getElementById('title-text');
        
        const startBtn = document.getElementById('start-btn');
        const retryBtn = document.getElementById('retry-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const fireBtn = document.getElementById('fire-btn');

        const timeDisplay = document.getElementById('time-display');
        const hitDisplay = document.getElementById('hit-display');
        const resultText = document.getElementById('result-text');
        const itemStatus = document.getElementById('item-status');

        let gameState = 'TITLE';
        let lastTime = 0;
        let scale = 1;
        let viewportRect = { top: 0, left: 0 };

        let player = { x: 100, y: GAME_HEIGHT / 2, targetY: GAME_HEIGHT / 2, radius: 22 };
        let bullets = [];
        let enemies = [];
        let items = [];
        let snowFlakes = [];
        let particles = [];

        let spawnTimer = 0;
        let itemTimer = 0;
        let elapsedTime = 0;
        let hitCount = 0;
        let isDragging = false;

        // アイテム効果ステータス
        let tripleShotTimer = 0;
        let slowTimer = 0;
        let hasShield = false;
        let flashEffect = 0; // スター獲得時の画面フラッシュ

        function init() {
            titleText.textContent = CONFIG.title;
            
            // 背景の背景降雪粒子
            for(let i = 0; i < 70; i++) {
                snowFlakes.push({
                    x: Math.random() * GAME_WIDTH,
                    y: Math.random() * GAME_HEIGHT,
                    radius: Math.random() * 3 + 1,
                    speed: Math.random() * 40 + 20
                });
            }

            window.addEventListener('resize', handleResize);
            handleResize();

            startBtn.addEventListener('click', startGame);
            retryBtn.addEventListener('click', startGame);
            fullscreenBtn.addEventListener('click', toggleFullScreen);

            setupInputHandlers();
            requestAnimationFrame(gameLoop);
        }

        function handleResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            if (h > w) rotateNotice.classList.remove('hidden');
            else rotateNotice.classList.add('hidden');

            scale = Math.min(w / GAME_WIDTH, h / GAME_HEIGHT);
            viewport.style.width = `${GAME_WIDTH * scale}px`;
            viewport.style.height = `${GAME_HEIGHT * scale}px`;
            viewportRect = viewport.getBoundingClientRect();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        function setupInputHandlers() {
            function updateTargetY(clientY) {
                const gameY = (clientY - viewportRect.top) / scale;
                player.targetY = Math.max(player.radius, Math.min(GAME_HEIGHT - player.radius, gameY));
            }

            window.addEventListener('pointerdown', (e) => {
                if (gameState !== 'PLAYING' || e.target === fireBtn) return;
                isDragging = true;
                updateTargetY(e.clientY);
                shootBullet();
            });

            window.addEventListener('pointermove', (e) => {
                if (gameState === 'PLAYING' && isDragging) updateTargetY(e.clientY);
            });

            window.addEventListener('pointerup', () => isDragging = false);
            fireBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (gameState === 'PLAYING') shootBullet();
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && gameState === 'PLAYING') shootBullet();
            });
        }

        function startGame() {
            gameState = 'PLAYING';
            elapsedTime = 0;
            hitCount = 0;
            spawnTimer = 0;
            itemTimer = 0;
            tripleShotTimer = 0;
            slowTimer = 0;
            hasShield = false;
            flashEffect = 0;

            bullets = [];
            enemies = [];
            items = [];
            particles = [];

            player.y = GAME_HEIGHT / 2;
            player.targetY = GAME_HEIGHT / 2;

            timeDisplay.textContent = 'TIME: 0.0s';
            hitDisplay.textContent = 'HIT: 0';

            titleScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
        }

        function shootBullet() {
            if (tripleShotTimer > 0) {
                bullets.push({ x: player.x + 20, y: player.y, vx: CONFIG.bulletSpeed, vy: 0, radius: 6 });
                bullets.push({ x: player.x + 20, y: player.y, vx: CONFIG.bulletSpeed, vy: -180, radius: 6 });
                bullets.push({ x: player.x + 20, y: player.y, vx: CONFIG.bulletSpeed, vy: 180, radius: 6 });
            } else {
                bullets.push({ x: player.x + 20, y: player.y, vx: CONFIG.bulletSpeed, vy: 0, radius: 6 });
            }
        }

        function spawnEnemy() {
            const r = 20;
            enemies.push({
                x: GAME_WIDTH + r,
                y: Math.random() * (GAME_HEIGHT - r * 2) + r,
                radius: r
            });
        }

        function spawnItem() {
            const types = ['present', 'bell', 'cake', 'star'];
            const type = types[Math.floor(Math.random() * types.length)];
            items.push({
                x: GAME_WIDTH + 20,
                y: Math.random() * (GAME_HEIGHT - 80) + 40,
                radius: 18,
                type: type
            });
        }

        // 爆発・キラキラ粒子エフェクト
        function addParticles(x, y, color, count = 10) {
            for(let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 150 + 50;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 2,
                    color: color,
                    life: 0.4
                });
            }
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            // 背景雪の更新
            snowFlakes.forEach(s => {
                s.x -= s.speed * dt;
                s.y += s.speed * 0.2 * dt;
                if (s.x < 0) s.x = GAME_WIDTH;
                if (s.y > GAME_HEIGHT) s.y = 0;
            });

            if (gameState === 'PLAYING') update(dt);

            render();
            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            elapsedTime += dt;
            timeDisplay.textContent = `TIME: ${elapsedTime.toFixed(1)}s`;

            // フラッシュ減衰
            if (flashEffect > 0) flashEffect -= dt * 3;

            // タイマー管理
            if (tripleShotTimer > 0) tripleShotTimer -= dt;
            if (slowTimer > 0) slowTimer -= dt;

            // HUDステータス更新
            let statusText = [];
            if (tripleShotTimer > 0) statusText.push(`🎁 3WAY: ${Math.ceil(tripleShotTimer)}s`);
            if (hasShield) statusText.push(`🔔 BARRIER OK`);
            if (slowTimer > 0) statusText.push(`🍰 FREEZE: ${Math.ceil(slowTimer)}s`);
            itemStatus.textContent = statusText.join(' | ');

            player.y += (player.targetY - player.y) * CONFIG.followSpeed * dt;

            // パーティクル更新
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // 弾の更新
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].vx * dt;
                bullets[i].y += bullets[i].vy * dt;
                if (bullets[i].x > GAME_WIDTH + 20 || bullets[i].y < -10 || bullets[i].y > GAME_HEIGHT + 10) {
                    bullets.splice(i, 1);
                }
            }

            // 敵出現
            spawnTimer += dt;
            if (spawnTimer >= CONFIG.spawnInterval) {
                spawnEnemy();
                spawnTimer = 0;
            }

            // アイテム出現
            itemTimer += dt;
            if (itemTimer >= CONFIG.itemInterval) {
                spawnItem();
                itemTimer = 0;
            }

            // アイテム処理
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.x -= 140 * dt;

                if (item.x < -item.radius) {
                    items.splice(i, 1);
                    continue;
                }

                // アイテムゲット判定
                if (Math.hypot(player.x - item.x, player.y - item.y) < player.radius + item.radius) {
                    addParticles(item.x, item.y, "#ffd700", 15);

                    if (item.type === 'present') {
                        tripleShotTimer = 6.0;
                    } else if (item.type === 'bell') {
                        hasShield = true;
                    } else if (item.type === 'cake') {
                        slowTimer = 5.0;
                    } else if (item.type === 'star') {
                        // 画面内の全敵破壊（スターボム）
                        flashEffect = 1.0;
                        hitCount += enemies.length;
                        enemies.forEach(e => addParticles(e.x, e.y, "#ff3344", 10));
                        enemies = [];
                        hitDisplay.textContent = `HIT: ${hitCount}`;
                    }
                    items.splice(i, 1);
                }
            }

            // 敵の処理
            const currentEnemySpeed = slowTimer > 0 ? CONFIG.enemySpeed * 0.35 : CONFIG.enemySpeed;

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.x -= currentEnemySpeed * dt;

                if (enemy.x < -enemy.radius) {
                    enemies.splice(i, 1);
                    continue;
                }

                // 自機衝突判定
                if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < player.radius + enemy.radius) {
                    if (hasShield) {
                        // バリアで1回防ぐ
                        hasShield = false;
                        addParticles(player.x, player.y, "#00ffff", 20);
                        enemies.splice(i, 1);
                    } else {
                        gameOver();
                        return;
                    }
                }

                // 弾との衝突判定
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bullet = bullets[j];
                    if (Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) < bullet.radius + enemy.radius) {
                        addParticles(enemy.x, enemy.y, "#ff4d4d", 12);
                        bullets.splice(j, 1);
                        enemies.splice(i, 1);
                        hitCount++;
                        hitDisplay.textContent = `HIT: ${hitCount}`;
                        break;
                    }
                }
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            resultText.innerHTML = `TIME: ${elapsedTime.toFixed(1)}s<br>TOTAL HIT: ${hitCount}`;
            gameoverScreen.classList.remove('hidden');
        }

        function render() {
            // 背景
            ctx.fillStyle = CONFIG.bgColor;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 背景の雪
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            snowFlakes.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            if (gameState === 'TITLE') return;

            // スター発動時のフラッシュ効果
            if (flashEffect > 0) {
                ctx.fillStyle = `rgba(255, 255, 200, ${Math.max(0, flashEffect)})`;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            }

            // 弾描画
            ctx.fillStyle = CONFIG.bulletColor;
            ctx.shadowBlur = 8;
            ctx.shadowColor = CONFIG.bulletColor;
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // パーティクル描画
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // アイテム描画（Canvas図形描画）
            items.forEach(it => {
                ctx.save();
                ctx.translate(it.x, it.y);

                if (it.type === 'present') {
                    // 🎁 プレゼント
                    ctx.fillStyle = "#ff1744";
                    ctx.fillRect(-14, -14, 28, 28);
                    ctx.fillStyle = "#ffd700";
                    ctx.fillRect(-4, -14, 8, 28);
                    ctx.fillRect(-14, -4, 28, 8);
                } else if (it.type === 'bell') {
                    // 🔔 ベル
                    ctx.fillStyle = "#ffeb3b";
                    ctx.beginPath();
                    ctx.arc(0, -2, 12, Math.PI, 0);
                    ctx.lineTo(14, 10);
                    ctx.lineTo(-14, 10);
                    ctx.closePath();
                    ctx.fill();
                } else if (it.type === 'cake') {
                    // 🍰 ケーキ
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(-12, -10, 24, 20);
                    ctx.fillStyle = "#ff5252";
                    ctx.beginPath();
                    ctx.arc(0, -10, 5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (it.type === 'star') {
                    // 🌟 スター
                    ctx.fillStyle = "#ffea00";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ffea00";
                    ctx.beginPath();
                    ctx.arc(0, 0, 14, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });

            // 敵描画 (ツリー風)
            ctx.fillStyle = slowTimer > 0 ? "#80deea" : CONFIG.enemyColor; // フリーズ時は水色
            ctx.shadowColor = CONFIG.enemyColor;
            ctx.shadowBlur = 6;
            enemies.forEach(e => {
                ctx.beginPath();
                ctx.moveTo(e.x - e.radius, e.y - e.radius);
                ctx.lineTo(e.x + e.radius, e.y);
                ctx.lineTo(e.x - e.radius, e.y + e.radius);
                ctx.closePath();
                ctx.fill();
            });

            // バリアシールド描画
            if (hasShield) {
                ctx.strokeStyle = "#00ffff";
                ctx.lineWidth = 3;
                ctx.shadowColor = "#00ffff";
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(player.x + 5, player.y, player.radius + 10, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 自機描画 (サンタソリ風)
            ctx.fillStyle = CONFIG.playerColor;
            ctx.shadowColor = CONFIG.playerColor;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(player.x + 25, player.y);
            ctx.lineTo(player.x - 15, player.y - 18);
            ctx.lineTo(player.x - 5, player.y);
            ctx.lineTo(player.x - 15, player.y + 18);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
