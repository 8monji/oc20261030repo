<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAGIC SHOT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050410;
      overflow: hidden;
      font-family: 'Georgia', 'Segoe UI', Roboto, sans-serif;
    }

    /* アプリ全体コンテナ */
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1f0c38 0%, #050410 100%);
    }

    /* 960x540 (16:9) 固定アスペクト比スクリーン */
    #game-screen {
      position: relative;
      width: 960px;
      height: 540px;
      background-color: #0c0a20;
      box-shadow: 0 0 40px rgba(224, 64, 251, 0.35);
      border: 1px solid rgba(225, 190, 231, 0.4);
      border-radius: 8px;
      overflow: hidden;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* オーバーレイ画面共通 */
    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(12, 10, 32, 0.82);
      backdrop-filter: blur(6px);
      z-index: 10;
      transition: opacity 0.2s ease;
    }

    .screen-overlay.hidden {
      display: none !important;
    }

    /* タイトル画面 */
    .game-title {
      font-size: 54px;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 10px #ff7700, 0 0 20px #e040fb, 0 0 40px #ab47bc;
      margin-bottom: 18px;
      letter-spacing: 5px;
      text-align: center;
      font-family: 'Georgia', serif;
    }

    .instruction-card {
      background: rgba(171, 71, 188, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-radius: 12px;
      padding: 18px 32px;
      margin-bottom: 28px;
      color: #f3e5f5;
      font-size: 15px;
      line-height: 1.8;
      text-align: left;
      box-shadow: inset 0 0 20px rgba(171, 71, 188, 0.15);
    }

    .btn-group {
      display: flex;
      gap: 20px;
    }

    .neon-btn {
      padding: 14px 34px;
      font-size: 18px;
      font-weight: bold;
      color: #ffd700;
      background: rgba(171, 71, 188, 0.25);
      border: 2px solid #ffd700;
      border-radius: 30px;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.4);
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      pointer-events: auto;
    }

    .neon-btn:hover, .neon-btn:active {
      background: #ffd700;
      color: #1a0b2e;
      box-shadow: 0 0 35px #ffd700;
      transform: translateY(-2px);
    }

    /* HUD */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 30px;
    }

    .hud-overlay.hidden {
      display: none !important;
    }

    .hud-stats {
      display: flex;
      gap: 40px;
      font-family: 'Georgia', serif;
      font-size: 24px;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 10px #ea80fc;
    }

    .fire-btn {
      pointer-events: auto;
      position: absolute;
      right: 25px;
      bottom: 25px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff80ab 0%, #aa00ff 70%, #4a148c 100%);
      border: 3px solid #ffd700;
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(234, 128, 252, 0.7);
      cursor: pointer;
      outline: none;
      display: flex;
      justify-content: center;
      align-items: center;
      text-shadow: 0 0 6px #000;
    }

    .fire-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
    }

    /* ゲームオーバー */
    .gameover-title {
      font-size: 52px;
      font-weight: 900;
      color: #ff5252;
      text-shadow: 0 0 12px #ff5252, 0 0 28px #ff1744;
      margin-bottom: 20px;
      font-family: 'Georgia', serif;
    }

    .result-card {
      background: rgba(255, 23, 68, 0.12);
      border: 1px solid rgba(255, 82, 82, 0.4);
      border-radius: 12px;
      padding: 20px 40px;
      margin-bottom: 30px;
      text-align: center;
      font-family: 'Georgia', serif;
      font-size: 22px;
      color: #fff;
      line-height: 1.8;
    }

    /* 縦画面警告 */
    .portrait-warning {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0c0a20;
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #e040fb;
      text-align: center;
    }

    .phone-icon {
      font-size: 56px;
      margin-bottom: 16px;
      animation: rotateAnim 2s infinite ease-in-out;
    }

    @keyframes rotateAnim {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
      100% { transform: rotate(-90deg); }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="game-screen">
      <!-- 描画用 Canvas (固定解像度 960x540) -->
      <canvas id="gameCanvas" width="960" height="540"></canvas>

      <!-- タイトル画面 -->
      <div id="screen-title" class="screen-overlay">
        <h1 id="title-text" class="game-title">MAGIC SHOT</h1>
        <div class="instruction-card">
          <p>【操作方法】</p>
          <p>・画面上下ドラッグ：魔法使いの移動</p>
          <p>・FIREボタン / 画面タップ：3方向の魔法弾を発射</p>
          <p>・PC操作：[Space]キーで魔法弾発射 / [↑][↓]キーで移動</p>
        </div>
        <div class="btn-group">
          <button id="btn-start" class="neon-btn">PLAY GAME</button>
          <button id="btn-fullscreen" class="neon-btn">FULL SCREEN</button>
        </div>
      </div>

      <!-- プレイ中 HUD -->
      <div id="hud" class="hud-overlay hidden">
        <div class="hud-stats">
          <span>TIME: <span id="hud-time">0.0</span>s</span>
          <span>HIT: <span id="hud-hit">0</span></span>
        </div>
        <button id="btn-fire" class="fire-btn">FIRE</button>
      </div>

      <!-- ゲームオーバー画面 -->
      <div id="screen-gameover" class="screen-overlay hidden">
        <h2 class="gameover-title">GAME OVER</h2>
        <div class="result-card">
          <p>TIME : <span id="res-time">0.0</span> 秒</p>
          <p>HIT  : <span id="res-hit">0</span> 匹のゴーストを退治</p>
        </div>
        <button id="btn-retry" class="neon-btn">RETRY</button>
      </div>
    </div>

    <!-- 縦画面警告オーバーレイ -->
    <div id="portrait-warning" class="portrait-warning">
      <div class="phone-icon">📱↻</div>
      <p style="font-size: 20px; font-weight: bold; letter-spacing: 1px;">スマホを横にしてね</p>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIG: ゲームパラメータ設定
    // ============================================================
    const CONFIG = {
      title: "MAGIC SHOT",            // タイトル名
      bgColor: "#0c0a20",             // 夜空の基本背景色
      playerColor: "#ff80ab",         // キャラクターのカラー
      enemyColor: "#ea80fc",          // ゴーストの色
      enemySpeed: 210,                // ゴーストの移動速度 (px/秒)
      enemySpawnInterval: 1.0,       // ゴーストの出現間隔 (秒)
      bulletSpeed: 750,               // 魔法弾の速度 (px/秒)
      bulletAngle: 15 * (Math.PI / 180), // 3方向ショットの拡散角度（15度）
      playerSpeed: 14,                // 移動の追従レスポンス速度
      canvasWidth: 960,               // ゲーム世界の横幅
      canvasHeight: 540               // ゲーム世界の高さ
    };

    // ============================================================
    // 変数定義
    // ============================================================
    const appContainer = document.getElementById('app-container');
    const gameScreen = document.getElementById('game-screen');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // システム状態
    let gameState = 'TITLE'; // 'TITLE', 'PLAYING', 'GAMEOVER'
    let isPausedForPortrait = false;
    let scale = 1;

    // ゲームオブジェクト
    let player = { x: 90, y: 270, width: 44, height: 36 };
    let targetPlayerY = 270;
    let bullets = [];
    let enemies = [];
    let particles = [];
    let bgStars = [];
    let sparkles = [];

    // スコア・タイマー
    let scoreHit = 0;
    let timeSurvived = 0;
    let enemySpawnTimer = 0;
    let lastTime = 0;

    // PCキー入力フラグ
    let keyUp = false;
    let keyDown = false;
    let isPointerDown = false;

    // ============================================================
    // 初期化 & レイアウト調整
    // ============================================================
    function init() {
      document.getElementById('title-text').textContent = CONFIG.title;
      initStarsAndSparkles();
      updateLayout();
      window.addEventListener('resize', updateLayout);
      window.addEventListener('orientationchange', updateLayout);
      setupControls();
      requestAnimationFrame(gameLoop);
    }

    // 画面スケーリングと縦横判定
    function updateLayout() {
      const windowW = window.innerWidth;
      const windowH = window.innerHeight;

      const portraitWarning = document.getElementById('portrait-warning');
      if (windowW < windowH) {
        portraitWarning.style.display = 'flex';
        isPausedForPortrait = true;
      } else {
        portraitWarning.style.display = 'none';
        isPausedForPortrait = false;
      }

      const targetRatio = CONFIG.canvasWidth / CONFIG.canvasHeight;
      const currentRatio = windowW / windowH;

      let displayW, displayH;
      if (currentRatio > targetRatio) {
        displayH = windowH;
        displayW = windowH * targetRatio;
      } else {
        displayW = windowW;
        displayH = windowW / targetRatio;
      }

      gameScreen.style.width = displayW + 'px';
      gameScreen.style.height = displayH + 'px';
      scale = displayW / CONFIG.canvasWidth;
    }

    // 夜空の星とキラキラ背景粒子の初期化
    function initStarsAndSparkles() {
      bgStars = [];
      for (let i = 0; i < 70; i++) {
        bgStars.push({
          x: Math.random() * CONFIG.canvasWidth,
          y: Math.random() * CONFIG.canvasHeight,
          size: Math.random() * 2 + 1,
          speed: Math.random() * 50 + 20
        });
      }

      sparkles = [];
      for (let i = 0; i < 20; i++) {
        sparkles.push({
          x: Math.random() * CONFIG.canvasWidth,
          y: Math.random() * CONFIG.canvasHeight,
          size: Math.random() * 6 + 4,
          speed: Math.random() * 80 + 30,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    // ============================================================
    // 操作イベント登録
    // ============================================================
    function setupControls() {
      gameScreen.addEventListener('pointerdown', (e) => {
        if (gameState !== 'PLAYING') return;
        if (e.target && e.target.closest('#btn-fire')) return;

        isPointerDown = true;
        updateTargetY(e);
        shootBullet();
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown || gameState !== 'PLAYING') return;
        updateTargetY(e);
      });

      window.addEventListener('pointerup', () => { isPointerDown = false; });
      window.addEventListener('pointercancel', () => { isPointerDown = false; });

      const fireBtn = document.getElementById('btn-fire');
      fireBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        e.preventDefault();
        if (gameState === 'PLAYING') shootBullet();
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          if (gameState === 'PLAYING' && !e.repeat) shootBullet();
        }
        if (e.code === 'ArrowUp') keyUp = true;
        if (e.code === 'ArrowDown') keyDown = true;
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowUp') keyUp = false;
        if (e.code === 'ArrowDown') keyDown = false;
      });

      document.getElementById('btn-start').addEventListener('click', startGame);
      document.getElementById('btn-retry').addEventListener('click', startGame);
      
      document.getElementById('btn-fullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (appContainer.requestFullscreen) appContainer.requestFullscreen();
          else if (appContainer.webkitRequestFullscreen) appContainer.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
      });
    }

    function updateTargetY(e) {
      const rect = gameScreen.getBoundingClientRect();
      const gameY = (e.clientY - rect.top) / scale;
      targetPlayerY = Math.max(25, Math.min(CONFIG.canvasHeight - 25, gameY));
    }

    // 3方向魔法弾の発射
    function shootBullet() {
      const speed = CONFIG.bulletSpeed;
      const angle = CONFIG.bulletAngle;
      const angles = [0, -angle, angle];

      angles.forEach(a => {
        bullets.push({
          x: player.x + 25,
          y: player.y - 2,
          vx: speed * Math.cos(a),
          vy: speed * Math.sin(a),
          radius: 7
        });
      });

      createMagicTrail(player.x + 25, player.y - 2, '#ffd700', 6);
    }

    // ============================================================
    // ゲーム進行管理
    // ============================================================
    function startGame() {
      gameState = 'PLAYING';
      scoreHit = 0;
      timeSurvived = 0;
      enemySpawnTimer = 0;
      bullets = [];
      enemies = [];
      particles = [];
      player.y = CONFIG.canvasHeight / 2;
      targetPlayerY = CONFIG.canvasHeight / 2;

      document.getElementById('hud-time').textContent = '0.0';
      document.getElementById('hud-hit').textContent = '0';

      document.getElementById('screen-title').classList.add('hidden');
      document.getElementById('screen-gameover').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      document.getElementById('res-time').textContent = timeSurvived.toFixed(1);
      document.getElementById('res-hit').textContent = scoreHit;

      document.getElementById('hud').classList.add('hidden');
      document.getElementById('screen-gameover').classList.remove('hidden');
    }

    // 魔法のパーティクル作成
    function createMagicTrail(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 30 + Math.random() * 120;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2 + Math.random() * 4,
          color: color,
          alpha: 1,
          life: 0.3 + Math.random() * 0.4
        });
      }
    }

    // 4点星（キラキラ）を描く補助関数
    function drawStar4(ctx, x, y, size) {
      ctx.beginPath();
      ctx.moveTo(x, y - size);
      ctx.quadraticCurveTo(x, y, x + size, y);
      ctx.quadraticCurveTo(x, y, x, y + size);
      ctx.quadraticCurveTo(x, y, x - size, y);
      ctx.quadraticCurveTo(x, y, x, y - size);
      ctx.closePath();
      ctx.fill();
    }

    // ============================================================
    // 更新 & 判定処理
    // ============================================================
    function updateGame(dt) {
      timeSurvived += dt;
      document.getElementById('hud-time').textContent = timeSurvived.toFixed(1);

      // 自機移動
      if (keyUp) targetPlayerY -= 380 * dt;
      if (keyDown) targetPlayerY += 380 * dt;
      targetPlayerY = Math.max(25, Math.min(CONFIG.canvasHeight - 25, targetPlayerY));
      
      player.y += (targetPlayerY - player.y) * Math.min(1, CONFIG.playerSpeed * dt);

      // ほうきの後ろから魔法の粒子を自動発生
      if (Math.random() < 0.6) {
        particles.push({
          x: player.x - 30,
          y: player.y + 2 + (Math.random() - 0.5) * 8,
          vx: -60 - Math.random() * 40,
          vy: (Math.random() - 0.5) * 30,
          size: 2 + Math.random() * 3,
          color: Math.random() < 0.5 ? '#ffd700' : '#ea80fc',
          alpha: 1,
          life: 0.4
        });
      }

      // 星とキラキラのスクロール
      bgStars.forEach(s => {
        s.x -= s.speed * dt;
        if (s.x < 0) s.x = CONFIG.canvasWidth;
      });

      sparkles.forEach(sp => {
        sp.x -= sp.speed * dt;
        sp.phase += dt * 3;
        if (sp.x < 0) sp.x = CONFIG.canvasWidth;
      });

      // 弾の移動 & 画面外判定
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        if (
          b.x > CONFIG.canvasWidth + 20 ||
          b.x < -20 ||
          b.y < -20 ||
          b.y > CONFIG.canvasHeight + 20
        ) {
          bullets.splice(i, 1);
        }
      }

      // ゴースト（敵）の生成
      enemySpawnTimer += dt;
      const spawnInterval = Math.max(0.35, CONFIG.enemySpawnInterval - timeSurvived * 0.008);
      if (enemySpawnTimer >= spawnInterval) {
        enemySpawnTimer = 0;
        const radius = 18 + Math.random() * 8;
        enemies.push({
          x: CONFIG.canvasWidth + radius * 2,
          y: radius * 1.5 + Math.random() * (CONFIG.canvasHeight - radius * 3),
          radius: radius,
          speed: CONFIG.enemySpeed * (0.85 + Math.random() * 0.35),
          floatPhase: Math.random() * Math.PI * 2
        });
      }

      // ゴーストの移動
      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.x -= e.speed * dt;
        e.floatPhase += dt * 4;
        if (e.x < -e.radius * 2) enemies.splice(i, 1);
      }

      // 当たり判定：魔法弾 vs ゴースト
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        for (let j = enemies.length - 1; j >= 0; j--) {
          let e = enemies[j];
          const dist = Math.hypot(b.x - e.x, b.y - e.y);
          if (dist < e.radius + b.radius) {
            createMagicTrail(e.x, e.y, '#ea80fc', 18);
            createMagicTrail(e.x, e.y, '#ffd700', 8);
            bullets.splice(i, 1);
            enemies.splice(j, 1);
            scoreHit++;
            document.getElementById('hud-hit').textContent = scoreHit;
            break;
          }
        }
      }

      // 当たり判定：魔法使い vs ゴースト
      for (let i = 0; i < enemies.length; i++) {
        let e = enemies[i];
        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < e.radius + 16) {
          createMagicTrail(player.x, player.y, '#ff5252', 25);
          createMagicTrail(player.x, player.y, '#ffd700', 15);
          gameOver();
          break;
        }
      }

      // パーティクル更新
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= dt / p.life;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    // ============================================================
    // 描画処理
    // ============================================================
    function renderGame() {
      // 1. 夜空背景
      const bgGrad = ctx.createLinearGradient(0, 0, 0, CONFIG.canvasHeight);
      bgGrad.addColorStop(0, '#0a081a');
      bgGrad.addColorStop(0.5, '#160d2e');
      bgGrad.addColorStop(1, '#080514');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

      // 2. 三日月
      ctx.save();
      ctx.beginPath();
      ctx.arc(810, 95, 42, -Math.PI * 0.3, Math.PI * 0.6, false);
      ctx.arc(830, 85, 38, Math.PI * 0.6, -Math.PI * 0.3, true);
      ctx.closePath();
      ctx.fillStyle = '#fff59d';
      ctx.shadowColor = '#ffe082';
      ctx.shadowBlur = 25;
      ctx.fill();
      ctx.restore();

      // 3. 背景の星
      ctx.fillStyle = '#ffffff';
      bgStars.forEach(s => {
        ctx.globalAlpha = s.size / 3;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1.0;

      // 4. キラキラ演出
      sparkles.forEach(sp => {
        ctx.save();
        const alpha = 0.4 + Math.sin(sp.phase) * 0.35;
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = '#ea80fc';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 8;
        drawStar4(ctx, sp.x, sp.y, sp.size);
        ctx.restore();
      });

      // 5. 魔法弾
      bullets.forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);

        ctx.beginPath();
        ctx.arc(0, 0, b.radius + 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 15;
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        drawStar4(ctx, 0, 0, b.radius + 2);

        ctx.restore();
      });

      // 6. 敵（ゴースト）
      enemies.forEach(e => {
        ctx.save();
        const floatY = Math.sin(e.floatPhase) * 4;
        ctx.translate(e.x, e.y + floatY);

        const r = e.radius;

        ctx.beginPath();
        ctx.arc(0, -r * 0.2, r * 0.85, Math.PI, 0, false);
        ctx.lineTo(r * 0.85, r * 0.6);
        ctx.quadraticCurveTo(r * 0.55, r * 1.0, r * 0.28, r * 0.6);
        ctx.quadraticCurveTo(0, r * 0.2, -r * 0.28, r * 0.6);
        ctx.quadraticCurveTo(-r * 0.55, r * 1.0, -r * 0.85, r * 0.6);
        ctx.closePath();

        ctx.fillStyle = CONFIG.enemyColor;
        ctx.shadowColor = '#e040fb';
        ctx.shadowBlur = 14;
        ctx.fill();

        ctx.fillStyle = '#100a26';
        ctx.beginPath();
        ctx.arc(-r * 0.3, -r * 0.2, r * 0.16, 0, Math.PI * 2);
        ctx.arc(r * 0.12, -r * 0.2, r * 0.16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-r * 0.34, -r * 0.26, r * 0.06, 0, Math.PI * 2);
        ctx.arc(r * 0.08, -r * 0.26, r * 0.06, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff4081';
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(-r * 0.42, 0, r * 0.12, 0, Math.PI * 2);
        ctx.arc(r * 0.24, 0, r * 0.12, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });

      // 7. パーティクル
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 8. 魔法使い（自機）
      if (gameState === 'PLAYING') {
        ctx.save();
        ctx.translate(player.x, player.y);

        ctx.beginPath();
        ctx.moveTo(-18, 0);
        ctx.lineTo(-34, -9);
        ctx.lineTo(-38, 0);
        ctx.lineTo(-34, 9);
        ctx.closePath();
        ctx.fillStyle = '#d7ccc8';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 4;
        ctx.fill();

        ctx.lineWidth = 4;
        ctx.strokeStyle = '#8d6e63';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-32, 2);
        ctx.lineTo(24, -2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(8, -1);
        ctx.lineTo(-12, 11);
        ctx.lineTo(-12, -11);
        ctx.closePath();
        ctx.fillStyle = CONFIG.playerColor;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(4, -8, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#ffe0b2';
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(3, -11, 11, 3.5, -0.2, 0, Math.PI * 2);
        ctx.fillStyle = '#4a148c';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-3, -12);
        ctx.lineTo(15, -28);
        ctx.lineTo(8, -12);
        ctx.closePath();
        ctx.fillStyle = '#6a1b9a';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(3, -11, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd700';
        ctx.fill();

        ctx.restore();
      }
    }

    // ============================================================
    // メインループ
    // ============================================================
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      let dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      if (dt > 0.1) dt = 0.1;

      if (gameState === 'PLAYING' && !isPausedForPortrait) {
        updateGame(dt);
      }
      renderGame();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('load', init);
  </script>
</body>
