<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マイ・シューティングゲーム</title>
    <style>
        /* === 基本スタイル・タッチ動作抑制 === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* スクロールや引っ張り更新を防止 */
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #051005;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === ゲームコンテナ (画面中央に16:9で保持) === */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* ゲーム用キャンバス */
        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.2);
            background-color: #0d200d;
        }

        /* === UIオーバーレイ（タイトル・UI画面） === */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            pointer-events: auto;
            z-index: 10;
        }

        /* ネオン調スタイル */
        .neon-title {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #ffea00, 0 0 20px #ffea00, 0 0 40px #ffea00;
            margin-bottom: 20px;
        }

        .instructions {
            background: rgba(10, 30, 10, 0.85);
            border: 1px solid #ffea00;
            border-radius: 10px;
            padding: 15px 25px;
            margin-bottom: 25px;
            max-width: 80%;
            font-size: 1rem;
            line-height: 1.6;
            box-shadow: 0 0 15px rgba(255, 234, 0, 0.3);
        }

        .btn-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ボタン共通スタイル */
        .btn {
            background: linear-gradient(135deg, #ffea00, #ff8800);
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 234, 0, 0.6);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(255, 234, 0, 0.8);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff00ff, #8800ff);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
        }

        /* === 画面内スコア・FIREボタン等のUI === */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 下のキャンバス操作を妨げない */
            z-index: 5;
            display: none;
        }

        .hud-text {
            position: absolute;
            top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px #ffea00, 1px 1px 2px #000;
        }

        #score-display { left: 20px; }
        #time-display { right: 20px; }

        /* 敵撃破時の叫び声テキスト（画面左下） */
        #scream-log {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ff3333;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000, 2px 2px 0px #000;
            opacity: 0;
            transition: opacity 0.1s ease-in-out;
            pointer-events: none;
        }

        /* スマホ用 FIRE ボタン */
        #fire-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,234,0,0.9) 0%, rgba(200,100,0,0.9) 100%);
            border: 2px solid #ffff00;
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 234, 0, 0.6);
            pointer-events: auto; /* ボタン単体でタップ可能 */
            touch-action: manipulation;
        }

        #fire-btn:active {
            background: radial-gradient(circle, rgba(255,255,100,1) 0%, rgba(255,150,0,1) 100%);
            transform: scale(0.92);
        }

        /* === 縦画面警告オーバーレイ === */
        #portrait-warning {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 15, 5, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            text-align: center;
        }

        .rotate-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: rotate-anim 2s infinite ease-in-out;
        }

        @keyframes rotate-anim {
            0%, 10% { transform: rotate(0deg); }
            40%, 60% { transform: rotate(-90deg); }
            90%, 100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- ゲーム描画用キャンバス (960x540 固定解像度) -->
        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <!-- プレイ中UI (スコア・FIREボタン・叫び声) -->
        <div id="hud">
            <div id="score-display" class="hud-text">HIT: <span id="hit-count">0</span></div>
            <div id="time-display" class="hud-text">TIME: <span id="time-count">0.0</span>s</div>
            <div id="scream-log">うわあああああああああ！！！！！！！</div>
            <div id="fire-btn">THUNDER</div>
        </div>

        <!-- タイトル画面 -->
        <div id="title-screen" class="overlay">
            <h1 class="neon-title" id="ui-title">ピカチュウ・シューティング</h1>
            <div class="instructions">
                <p>【操作方法】</p>
                <p>・上下ドラッグ：ピカチュウの移動</p>
                <p>・画面タップ / THUNDERボタン / SPACEキー：雷を発射</p>
            </div>
            <div class="btn-container">
                <button id="fullscreen-btn" class="btn btn-secondary">FULL SCREEN</button>
                <button id="start-btn" class="btn">PLAY</button>
            </div>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameover-screen" class="overlay" style="display: none;">
            <h1 class="neon-title" style="text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;">GAME OVER</h1>
            <div class="instructions">
                <p>撃破数 (HIT): <span id="final-hits">0</span></p>
                <p>生存時間 (TIME): <span id="final-time">0.0</span>秒</p>
            </div>
            <button id="retry-btn" class="btn">RETRY</button>
        </div>

        <!-- 縦画面警告画面 -->
        <div id="portrait-warning">
            <div class="rotate-icon">📱</div>
            <h2>画面を横にしてね</h2>
            <p style="margin-top: 10px; color: #aaa;">横向きにするとゲームが始まります</p>
        </div>
    </div>

    <script>
        // =========================================================
        // 【授業用 CONFIG】自由に書き換えてゲームバランスを変更しよう！
        // =========================================================
        const CONFIG = {
            titleText: "ピカチュウ・シューティング", // ゲームのタイトル
            bgColor: "#0a1d0a",             // 森のベース夜景色
            enemySpeed: 200,                // 敵の移動速度（ピクセル/秒）
            enemySpawnInterval: 1.0,        // 敵の出現間隔（秒）
            bulletSpeed: 800,               // 弾（雷）の飛ぶ速度（ピクセル/秒）
            playerFollowSpeed: 14.0          // ピカチュウの追従スピード
        };

        // =========================================================
        // ゲーム内部の定数・変数宣言
        // =========================================================
        const GAME_WIDTH = 960;
        const GAME_HEIGHT = 540;

        // ゲームの状態: 'TITLE', 'PLAYING', 'GAMEOVER'
        let gameState = 'TITLE';

        // キャンバスとコンテキストの取得
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // DOM要素参照
        const container = document.getElementById('game-container');
        const titleScreen = document.getElementById('title-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const portraitWarning = document.getElementById('portrait-warning');
        const hud = document.getElementById('hud');
        const hitCountEl = document.getElementById('hit-count');
        const timeCountEl = document.getElementById('time-count');
        const finalHitsEl = document.getElementById('final-hits');
        const finalTimeEl = document.getElementById('final-time');
        const fireBtn = document.getElementById('fire-btn');
        const screamLog = document.getElementById('scream-log');

        // タイトルテキスト反映
        document.getElementById('ui-title').textContent = CONFIG.titleText;

        // ビューポート変換用データ（スケーリング計算）
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;

        // ゲーム計測値
        let lastTime = 0;
        let survivalTime = 0;
        let hitCount = 0;
        let enemySpawnTimer = 0;
        let screamTimer = null;

        // 背景用の木（ランダム生成）
        let forestTrees = [];
        for (let i = 0; i < 30; i++) {
            forestTrees.push({
                x: Math.random() * GAME_WIDTH,
                y: 100 + Math.random() * (GAME_HEIGHT - 120),
                scale: 0.6 + Math.random() * 0.8,
                color: `rgb(${10 + Math.floor(Math.random() * 20)}, ${40 + Math.floor(Math.random() * 40)}, ${15 + Math.floor(Math.random() * 25)})`,
                layer: Math.floor(Math.random() * 2)
            });
        }
        forestTrees.sort((a, b) => a.layer - b.layer);

        // ゲームオブジェクト
        let player = {
            x: 100,
            y: GAME_HEIGHT / 2,
            targetY: GAME_HEIGHT / 2,
            radius: 22
        };

        let bullets = [];
        let enemies = [];
        let particles = [];

        // =========================================================
        // 画面リサイズ & 960x540レターボックス（アスペクト比固定）計算
        // =========================================================
        function resizeGame() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            if (windowHeight > windowWidth) {
                portraitWarning.style.display = 'flex';
            } else {
                portraitWarning.style.display = 'none';
            }

            let w = windowWidth;
            let h = windowWidth * (9 / 16);

            if (h > windowHeight) {
                h = windowHeight;
                w = windowHeight * (16 / 9);
            }

            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;

            scale = w / GAME_WIDTH;
            const rect = canvas.getBoundingClientRect();
            offsetX = rect.left;
            offsetY = rect.top;
        }

        window.addEventListener('resize', resizeGame);
        window.addEventListener('load', resizeGame);

        // =========================================================
        // 入力処理（タッチ座標変換・キーボード対応）
        // =========================================================
        function screenToGamePos(clientX, clientY) {
            return {
                x: (clientX - offsetX) / scale,
                y: (clientY - offsetY) / scale
            };
        }

        let isDragging = false;

        function handlePointerMove(clientX, clientY) {
            const pos = screenToGamePos(clientX, clientY);
            player.targetY = Math.max(30, Math.min(GAME_HEIGHT - 30, pos.y));
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (gameState !== 'PLAYING') return;
            isDragging = true;
            handlePointerMove(e.clientX, e.clientY);
            shootBullet();
        });

        window.addEventListener('pointermove', (e) => {
            if (isDragging && gameState === 'PLAYING') {
                handlePointerMove(e.clientX, e.clientY);
            }
        });

        window.addEventListener('pointerup', () => { isDragging = false; });
        window.addEventListener('pointercancel', () => { isDragging = false; });

        fireBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (gameState === 'PLAYING') {
                shootBullet();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameState === 'PLAYING') {
                shootBullet();
            }
        });

        // =========================================================
        // フルスクリーン機能
        // =========================================================
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.log(`フルスクリーンエラー: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // =========================================================
        // ゲームロジック
        // =========================================================
        function shootBullet() {
            bullets.push({
                x: player.x + 25,
                y: player.y,
                speed: CONFIG.bulletSpeed,
                radius: 6,
                length: 25
            });
        }

        function spawnEnemy() {
            enemies.push({
                x: GAME_WIDTH + 30,
                y: 40 + Math.random() * (GAME_HEIGHT - 80),
                radius: 20,
                speed: CONFIG.enemySpeed * (0.8 + Math.random() * 0.4)
            });
        }

        function triggerScream() {
            screamLog.style.opacity = '1';
            if (screamTimer) clearTimeout(screamTimer);
            screamTimer = setTimeout(() => {
                screamLog.style.opacity = '0';
            }, 600);
        }

        // 血飛沫（一瞬で消える演出）
        function createBloodExplosion(x, y, count = 25) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 80 + Math.random() * 200;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 0.15 + Math.random() * 0.1, // 約0.15～0.25秒で高速消滅
                    maxLife: 0.25,
                    color: Math.random() > 0.2 ? "#cc0000" : "#ff2222",
                    size: 2.5 + Math.random() * 3.5
                });
            }
        }

        function createExplosion(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 50 + Math.random() * 150;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 0.4,
                    maxLife: 0.4,
                    color: color,
                    size: 2 + Math.random() * 3
                });
            }
        }

        function startGame() {
            gameState = 'PLAYING';
            survivalTime = 0;
            hitCount = 0;
            enemySpawnTimer = 0;
            player.y = GAME_HEIGHT / 2;
            player.targetY = GAME_HEIGHT / 2;
            bullets = [];
            enemies = [];
            particles = [];

            hitCountEl.textContent = '0';
            timeCountEl.textContent = '0.0';
            screamLog.style.opacity = '0';

            titleScreen.style.display = 'none';
            gameoverScreen.style.display = 'none';
            hud.style.display = 'block';

            lastTime = performance.now();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            createExplosion(player.x, player.y, "#ffff00", 30);

            finalHitsEl.textContent = hitCount;
            finalTimeEl.textContent = survivalTime.toFixed(1);

            hud.style.display = 'none';
            gameoverScreen.style.display = 'flex';
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('retry-btn').addEventListener('click', startGame);

        // =========================================================
        // 更新処理 (Update)
        // =========================================================
        function update(dt) {
            if (gameState !== 'PLAYING') return;

            survivalTime += dt;
            timeCountEl.textContent = survivalTime.toFixed(1);

            player.y += (player.targetY - player.y) * CONFIG.playerFollowSpeed * dt;

            enemySpawnTimer += dt;
            if (enemySpawnTimer >= CONFIG.enemySpawnInterval) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].speed * dt;
                if (bullets[i].x > GAME_WIDTH + 50) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x -= e.speed * dt;

                if (e.x < -e.radius) {
                    enemies.splice(i, 1);
                    continue;
                }

                const dxPlayer = e.x - player.x;
                const dyPlayer = e.y - player.y;
                const distPlayer = Math.hypot(dxPlayer, dyPlayer);
                if (distPlayer < e.radius + player.radius) {
                    gameOver();
                    return;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    const dxBullet = e.x - b.x;
                    const dyBullet = e.y - b.y;
                    const distBullet = Math.hypot(dxBullet, dyBullet);

                    if (distBullet < e.radius + b.radius) {
                        createBloodExplosion(e.x, e.y);
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        hitCount++;
                        hitCountEl.textContent = hitCount;
                        triggerScream();
                        break;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // =========================================================
        // 描画処理 (Render) - Canvasグラフィック
        // =========================================================
        function draw() {
            let bgGrad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            bgGrad.addColorStop(0, "#050f05");
            bgGrad.addColorStop(0.6, "#0a200a");
            bgGrad.addColorStop(1, "#030a03");
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = "rgba(180, 255, 180, 0.2)";
            for (let i = 0; i < 15; i++) {
                let starX = (Math.sin(i * 77 + performance.now() * 0.0003) * 0.5 + 0.5) * GAME_WIDTH;
                let starY = (Math.cos(i * 21) * 0.5 + 0.5) * GAME_HEIGHT;
                ctx.fillRect(starX, starY, 3, 3);
            }

            forestTrees.forEach(t => {
                ctx.save();
                ctx.fillStyle = t.color;
                
                ctx.fillRect(t.x - 6 * t.scale, t.y, 12 * t.scale, 80 * t.scale);
                
                ctx.beginPath();
                ctx.moveTo(t.x, t.y - 70 * t.scale);
                ctx.lineTo(t.x - 30 * t.scale, t.y - 20 * t.scale);
                ctx.lineTo(t.x + 30 * t.scale, t.y - 20 * t.scale);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(t.x, t.y - 45 * t.scale);
                ctx.lineTo(t.x - 38 * t.scale, t.y + 10 * t.scale);
                ctx.lineTo(t.x + 38 * t.scale, t.y + 10 * t.scale);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            });

            ctx.save();
            ctx.strokeStyle = "#ffff00";
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "#ffff00";
            ctx.shadowBlur = 12;
            ctx.lineWidth = 3;
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.moveTo(b.x - b.length, b.y);
                ctx.lineTo(b.x - b.length * 0.5, b.y - 6);
                ctx.lineTo(b.x - b.length * 0.2, b.y + 4);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            ctx.save();
            enemies.forEach(e => {
                ctx.strokeStyle = "#ff4444";
                ctx.fillStyle = "#ffaaaa";
                ctx.lineWidth = 3;
                ctx.shadowColor = "#ff0000";
                ctx.shadowBlur = 8;

                ctx.beginPath();
                ctx.arc(e.x, e.y - 12, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(e.x, e.y - 4);
                ctx.lineTo(e.x, e.y + 12);
                
                ctx.moveTo(e.x - 10, e.y + 2);
                ctx.lineTo(e.x + 10, e.y + 2);

                ctx.moveTo(e.x, e.y + 12);
                ctx.lineTo(e.x - 8, e.y + 24);
                ctx.moveTo(e.x, e.y + 12);
                ctx.lineTo(e.x + 8, e.y + 24);
                ctx.stroke();
            });
            ctx.restore();

            if (gameState === 'PLAYING' || gameState === 'TITLE') {
                ctx.save();
                ctx.translate(player.x, player.y);

                ctx.shadowColor = "#ffea00";
                ctx.shadowBlur = 10;

                ctx.fillStyle = "#ffea00";
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-10, -15);
                ctx.lineTo(-22, -35);
                ctx.lineTo(-2, -18);
                ctx.fill();
                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.moveTo(-10, -15);
                ctx.lineTo(-22, -35);
                ctx.lineTo(-15, -28);
                ctx.fill();

                ctx.fillStyle = "#ffea00";
                ctx.beginPath();
                ctx.moveTo(5, -15);
                ctx.lineTo(12, -38);
                ctx.lineTo(15, -12);
                ctx.fill();
                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.moveTo(8, -25);
                ctx.lineTo(12, -38);
                ctx.lineTo(15, -12);
                ctx.fill();

                ctx.fillStyle = "#ff0000";
                ctx.beginPath();
                ctx.arc(8, 6, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(10, -4, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(11, -5, 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "#ffea00";
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(-18, 5);
                ctx.lineTo(-28, 2);
                ctx.lineTo(-24, -8);
                ctx.lineTo(-38, -12);
                ctx.stroke();

                ctx.restore();
            }

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // =========================================================
        // ゲームループ (requestAnimationFrame & Delta Time)
        // =========================================================
        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame((now) => {
            lastTime = now;
            gameLoop(now);
        });

    </script>
</body>
</html>
